<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chatter RCA Grading · Redes Content Agency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
  /* Redes Content Agency palette */
  --bg:#120E22;
  --surface:#1A1531;
  --raised:#241D44;
  --line:#352B62;
  --line-soft:#281F4B;
  --text:#F2EFFB;
  --muted:#ABA3CC;
  --faint:#736B98;
  --flame:#F7A034;
  --ember:#E0336A;
  --purple:#5B3FD0;
  --purple-soft:#A08CFF;
  --brand-grad:linear-gradient(135deg,#F7A034 0%,#EE5B45 50%,#E0336A 100%);
  --gold:var(--purple-soft);
  --gold-deep:#E0336A;
  --green:#45D08F;
  --orange:#F2A43C;
  --red:#F0605E;
  --blue:#A08CFF;
  --ui:"Schibsted Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --r-sm:6px; --r-md:10px; --r-lg:14px;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px/1.5 var(--ui);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--purple-soft)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Layout */
.app{display:grid;grid-template-columns:256px 1fr;min-height:100vh}
.side{overflow-y:auto;background:linear-gradient(180deg,#1E1739,var(--surface) 40%);border-right:1px solid var(--line-soft);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{padding:0 8px}
.logo-tile{display:block;background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 0 0 1px rgba(224,51,106,.35),0 8px 26px rgba(224,51,106,.18)}
.logo-tile img{display:block;width:100%;height:auto}
.brand .name{font-weight:700;font-size:15px;margin-top:14px;letter-spacing:-.1px}
.brand .sub{color:var(--faint);font-size:12px}
.nav{display:flex;flex-direction:column;gap:14px}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-head{display:flex;align-items:center;gap:10px;padding:4px 10px 6px;font-weight:700;font-size:13.5px;color:var(--text)}
.nav-group:not(.cur) .nav-head{color:var(--muted)}
.pbadge{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 5px;border-radius:7px;font-family:var(--display);font-weight:700;font-size:11.5px;letter-spacing:.2px;color:#fff;flex:none}
.pbadge.of{background:var(--brand-grad)}
.pbadge.mym{background:linear-gradient(135deg,#8A6BFF,#4A2FB8)}
.pbadge.lg{min-width:34px;height:34px;font-size:14px;border-radius:10px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);color:var(--muted);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--raised);color:var(--text)}
.nav a.on{background:linear-gradient(90deg,rgba(224,51,106,.16),rgba(91,63,208,.12));color:var(--text);box-shadow:inset 3px 0 0 var(--ember)}
.nav svg{width:17px;height:17px;flex:none;opacity:.85}
.side-foot{margin-top:auto;font-size:12px;color:var(--faint);padding:0 8px}
.selftest{display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px;width:100%;cursor:pointer;color:var(--muted);font-size:12px;text-align:left}
.selftest .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.selftest.ok .dot{background:var(--green)} .selftest.bad .dot{background:var(--red)}
.main{min-width:0;padding:22px 30px 60px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.3px;margin-right:auto;display:flex;align-items:center;gap:12px}
.top h1 .plat{color:var(--muted);font-weight:600}
.picker{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
select,input[type=text],input[type=number],input[type=date],input[type=search],textarea{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px;min-height:34px}
select{padding-right:28px}
textarea{width:100%;min-height:70px;resize:vertical}
input[type=number]{width:100%}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--raised);color:var(--text);padding:7px 14px;border-radius:var(--r-sm);cursor:pointer;font-weight:600;font-size:13px;min-height:34px;text-decoration:none}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--brand-grad);border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red);border-color:#5A2E3A;background:transparent}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);padding:20px}
.panel h2{font-size:15px;font-weight:700;margin:0 0 4px}
.panel .hint{color:var(--muted);font-size:13px;margin:0 0 14px}
.stack{display:flex;flex-direction:column;gap:18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}

/* Hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;padding:26px 26px 22px;background:radial-gradient(90% 140% at 100% 0%,rgba(224,51,106,.16),transparent 60%),linear-gradient(180deg,#261D4C,var(--surface));border:1px solid var(--line-soft);border-radius:var(--r-lg)}
.hero .period{font-family:var(--ui);font-weight:700;font-size:32px;font-weight:600;letter-spacing:-.6px;line-height:1.1}
.hero .meta{color:var(--muted);margin-top:8px;font-size:13px}
.dist{display:flex;gap:8px}
.dist .g{width:74px;text-align:center;padding:10px 0 8px;border-radius:var(--r-md);background:var(--bg);border:1px solid var(--line-soft);cursor:pointer}
.dist .g:hover{border-color:var(--faint)}
.dist .letter{font-family:var(--display);font-size:34px;font-weight:600;line-height:1}
.dist .n{font-size:13px;color:var(--muted);margin-top:4px}
.dist .g.S{border-color:var(--ember);background:radial-gradient(120% 90% at 50% 0%,rgba(247,160,52,.22),var(--bg))}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line-soft);border-radius:var(--r-lg);background:var(--surface)}
.stat{padding:14px 18px;border-left:1px solid var(--line-soft)}
.stat:first-child{border-left:0}
.stat .k{color:var(--muted);font-size:12.5px}
.stat .v{font-size:21px;font-weight:700;margin-top:2px;letter-spacing:-.3px}
.stat .d{font-size:12px;color:var(--faint)}

.stats-auto{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line-soft);overflow:hidden}
.stats-auto .stat{background:var(--surface);border:0!important}
/* Grade glyphs */
.gS{color:#FF7A45} .gA{color:var(--green)} .gB{color:var(--blue)} .gC{color:var(--orange)} .gD{color:var(--red)}
.badge{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;font-family:var(--display);font-weight:600;font-size:18px;background:var(--bg);border:1px solid var(--line)}
.badge.S{border-color:var(--ember);background:rgba(238,91,69,.14);box-shadow:0 0 0 1px rgba(224,51,106,.2),0 0 14px rgba(238,91,69,.28)}
.capnote{font-size:11px;color:var(--orange);margin-left:6px;white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.Critical{background:rgba(240,96,94,.15);color:var(--red)}
.pill.Warning{background:rgba(242,164,60,.15);color:var(--orange)}
.pill.Strong{background:rgba(69,208,143,.14);color:var(--green)}
.pill.OnTrack{background:rgba(160,140,255,.14);color:var(--purple-soft)}
.pill.AtRisk{background:rgba(240,96,94,.1);color:#F59A98}

/* Tables */
.tbl-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tbl-controls input[type=search]{min-width:220px;flex:1 1 220px;max-width:340px}
.tbl-controls input[type=number]{width:112px}
.tbl-controls .count{color:var(--muted);font-size:13px;margin-left:auto}
.tbl-wrap{overflow:auto;max-height:72vh;border:1px solid var(--line-soft);border-radius:var(--r-md)}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line-soft)}
thead th{position:sticky;top:0;background:var(--raised);font-size:12.5px;font-weight:600;color:var(--muted);z-index:1}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--text)}
th.sort[aria-sort]::after{content:"";display:inline-block;margin-left:5px;border:4px solid transparent;vertical-align:middle}
th.sort[aria-sort=descending]::after{border-top-color:var(--flame);margin-top:4px}
th.sort[aria-sort=ascending]::after{border-bottom-color:var(--flame);margin-top:-4px}
td.num,th.num{text-align:right}
tbody tr:hover{background:rgba(255,255,255,.025)}
tbody tr.click{cursor:pointer}
.sub{color:var(--faint);font-size:12px;margin-left:6px}
.sc-hi{color:var(--green)} .sc-mid{color:var(--orange)} .sc-lo{color:var(--red)}
.scorecell{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.minibar{width:56px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.minibar i{display:block;height:100%}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}

/* Detail */
.detail-head{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center}
.biggrade{width:92px;height:92px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:60px;font-weight:600;background:var(--bg);border:1px solid var(--line)}
.biggrade.S{border:0;background:var(--brand-grad);color:#fff;box-shadow:0 0 34px rgba(224,51,106,.35)}
.detail-head .who{font-size:26px;font-weight:700;letter-spacing:-.4px}
.detail-head .line{color:var(--muted);margin-top:4px}
.scorebox{text-align:right}
.scorebox .v{font-family:var(--display);font-size:44px;font-weight:600;line-height:1}
.scorebox .k{color:var(--muted);font-size:12.5px}
.kpi-row{display:grid;grid-template-columns:170px 120px minmax(120px,1fr) 190px;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.kpi-row:last-child{border-bottom:0}
.kpi-row .lab{font-weight:600}
.kpi-row .raw{color:var(--muted)}
.bar{height:9px;border-radius:5px;background:var(--bg);border:1px solid var(--line-soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px}
.kpi-row .math{text-align:right;font-size:13px;color:var(--muted)}
.kpi-row .math b{color:var(--text)}
.obs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.obs li{padding:9px 12px 9px 14px;border-radius:var(--r-sm);background:var(--bg);border-left:3px solid var(--faint)}
.obs li.info{border-left-color:var(--purple-soft)} .obs li.good{border-left-color:var(--green)} .obs li.warn{border-left-color:var(--orange)} .obs li.crit{border-left-color:var(--red)}
.back{background:none;border:0;color:var(--muted);cursor:pointer;padding:0;margin-bottom:14px;font-weight:500}
.back:hover{color:var(--text)}

/* Import */
.drop{border:1.5px dashed var(--line);border-radius:var(--r-lg);padding:34px 20px;text-align:center;background:var(--bg);cursor:pointer}
.drop.over{border-color:var(--ember);background:rgba(224,51,106,.06)}
.drop strong{display:block;font-size:16px;margin-bottom:4px}
.drop span{color:var(--muted)}
.maprow{display:grid;grid-template-columns:170px minmax(0,1fr) 90px;gap:10px;align-items:center;padding:6px 0}
.maprow select{width:100%}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;text-align:center}
.tag.exact{background:rgba(69,208,143,.13);color:var(--green)}
.tag.partial{background:rgba(242,164,60,.14);color:var(--orange)}
.tag.manual{background:rgba(160,140,255,.14);color:var(--purple-soft)}
.tag.derived{background:rgba(160,140,255,.14);color:var(--purple-soft)}
.tag.optional{background:var(--raised);color:var(--muted)}
.tag.missing{background:rgba(240,96,94,.14);color:var(--red)}
.alert{padding:12px 14px;border-radius:var(--r-md);border:1px solid;font-size:13.5px}
.alert.err{border-color:#5A2E3A;background:rgba(240,96,94,.08);color:#F7B3B2}
.alert.warn{border-color:#5B4424;background:rgba(242,164,60,.07);color:#F5CB8E}
.alert.ok{border-color:#1F4A38;background:rgba(69,208,143,.07);color:#A5E8C7}
.summary{display:flex;gap:26px;flex-wrap:wrap;align-items:baseline}
.summary b{font-size:22px;font-weight:700;margin-right:6px}
tr.issue-error td{background:rgba(240,96,94,.05)}
tr.issue-warn td{background:rgba(242,164,60,.05)}
.issues{color:var(--orange);font-size:12.5px;white-space:normal;min-width:220px}
tr.issue-error .issues{color:var(--red)}
.fieldrow{display:flex;gap:14px;flex-wrap:wrap}
.fieldrow label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.check{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}

/* Settings */
.set-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.set-grid label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.bands{width:auto}
.bands td,.bands th{padding:5px 8px;border:0}
.bands input{width:110px}
.sumline{margin-top:10px;font-size:13px}
.sumline.bad{color:var(--red)} .sumline.good{color:var(--green)}
.savebar{position:sticky;bottom:12px;display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:12px 16px;background:rgba(36,29,68,.94);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:var(--r-lg)}
.savebar .msg{margin-right:auto;font-size:13px}

/* Charts */
.chart-box{position:relative;height:230px}
.chart-box.tall{height:280px}
.nochart{color:var(--faint);font-size:13px;padding:30px;text-align:center}

/* Toast + modal */
.toast{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--raised);border:1px solid var(--line);border-left:3px solid var(--green);padding:11px 16px;border-radius:var(--r-md);max-width:380px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.err{border-left-color:var(--red)}
.modal-bg{position:fixed;inset:0;background:rgba(10,7,22,.72);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;max-width:560px;width:100%;max-height:85vh;overflow:auto}
.modal h3{margin:0 0 10px;font-size:16px}
.modal .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.testlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.testlist li{padding:8px 10px;background:var(--bg);border-radius:var(--r-sm);font-size:13px}
.testlist .p{color:var(--green);font-weight:600} .testlist .f{color:var(--red);font-weight:600}
.testlist small{display:block;color:var(--faint)}

@media (max-width:1180px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.stat:nth-child(4){border-left:0}.stat:nth-child(n+4){border-top:1px solid var(--line-soft)}}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:10px 12px;gap:12px;z-index:10;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line-soft);padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .brand .name,.brand .sub,.side-foot{display:none}
  .logo-tile{padding:6px 10px;border-radius:10px}
  .logo-tile img{width:auto;height:40px}
  .nav{flex-direction:row;gap:10px}
  .nav-group{flex-direction:row;align-items:center}
  .nav-head{padding:0 4px}
  .nav-head span{display:none}
  .nav a{white-space:nowrap}
  .nav a span{display:none}
  .main{padding:18px 16px 50px}
  .hero{grid-template-columns:1fr}
  .grid2,.grid3{grid-template-columns:1fr}
  .kpi-row{grid-template-columns:1fr 1fr;gap:6px 14px}
  .kpi-row .bar{grid-column:1/-1}
  .kpi-row .math{text-align:left}
  .detail-head{grid-template-columns:auto 1fr}
  .scorebox{grid-column:1/-1;text-align:left}
}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{border-left:0;border-top:1px solid var(--line-soft)}.dist .g{width:auto;flex:1}.maprow{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">

<!-- ============ MOTEUR : plateformes, notation, détection et validation (sans DOM) ============ -->
<script id="engine">
const RCA = (() => {
  const GRADE_ORDER = ['S','A','B','C','D'];
  const NAME_ALIASES = ['name','chatter','chatter name','username','user name','agent','operator','employes','employe','employee','employees','employee name','chatters','full name','nom','nom du chatter','operateur','pseudo'];

  /* ---------- Plateformes ----------
     kind: money | pct | count | seconds
     scoring: target (proportionnel à un objectif) | bands (paliers « à partir de ») | info (affiché, non noté)
     lowerIsBetter: pour les paliers dont les points baissent quand la valeur monte (réactivité)
     pctRule: unlock (≤ 1 = fraction) | golden (< 0,1 = fraction) */
  const PLATFORMS = {
    of: {
      id:'of', name:'OnlyFans', short:'OF', currency:'$',
      kpis: [
        {key:'revenue', label:'CA total', kind:'money', scoring:'target',
          aliases:['revenue','total revenue','total ca','ca','gross revenue','sales revenue','sales','total sales','total earnings','net revenue','ca total',"chiffre d'affaires",'chiffre d affaires total','revenu total','revenus']},
        {key:'unlock', label:'Unlock Ratio', kind:'pct', pctRule:'unlock', scoring:'bands',
          aliases:['unlock ratio','unlock %','unlock rate','unlock','unlocked ratio','unlock ratio %','taux d unlock','taux de deblocage','ratio unlock']},
        {key:'ppv', label:'Ventes PPV / brutes', kind:'money', scoring:'target',
          aliases:['ppv','ppv sales','gross sales','sales','gross ppv','gross sales / ppv sales','ppv revenue','gross ppv sales','ppv gross sales','ventes ppv','ventes brutes','ventes ppv brutes']},
        {key:'tips', label:'Tips', kind:'money', scoring:'target',
          aliases:['tips','tip','total tips','tips revenue','pourboires','total pourboires']},
        {key:'golden', label:'Golden Ratio', kind:'pct', pctRule:'golden', scoring:'bands',
          aliases:['golden ratio','golden %','golden rate','golden','ratio golden']},
        {key:'fan', label:'Dépense moyenne par fan', kind:'money', dec:2, scoring:'bands',
          aliases:['average fan spend','avg fan spend','average spend','avg spend','fan spend','avg earnings per fan who spent money','average earnings per fan who spent money','earnings per fan who spent money','avg earnings per paying fan','average earnings per paying fan','depense moyenne par fan','depense moyenne','depense par fan','panier moyen']}
      ],
      dashStats: [['sum','revenue',`CA de l'équipe`],['avg','unlock','Unlock Ratio moyen'],['sum','ppv','Ventes PPV'],['sum','tips','Tips']],
      defaults: {
        weights: {revenue:25, unlock:25, ppv:20, tips:10, golden:10, fan:10},
        targets: {revenue:7000, ppv:5000, tips:1500},
        bands: {
          unlock: [[0,0],[20,30],[30,50],[40,65],[50,80],[60,90],[70,100]],
          golden: [[0,30],[0.5,50],[0.75,70],[1,85],[1.25,95],[1.5,100]],
          fan: [[0,40],[75,55],[100,70],[125,80],[150,90],[175,100]]
        },
        caps: {enabled:true, kpi:'unlock', criticalBelow:20, criticalCap:'C', warnBelow:30, warnCap:'B'},
        grades: {S:90, A:80, B:70, C:60}
      }
    },
    mym: {
      id:'mym', name:'MYM', short:'M', currency:'€',
      kpis: [
        {key:'react', label:'Réactivité', kind:'seconds', scoring:'bands', lowerIsBetter:true,
          aliases:['reactivite','reactivity','temps de reponse','temps de reponse moyen','response time','avg response time','delai de reponse']},
        {key:'proposed', label:'Proposé', kind:'count', scoring:'info', optional:true,
          aliases:['propose','proposes','ppv proposes','medias proposes','offered','sent','ppv sent']},
        {key:'sold', label:'Vendu', kind:'count', scoring:'info', optional:true,
          aliases:['vendu','vendus','ppv vendus','medias vendus','sold','ppv sold']},
        {key:'conv', label:'Taux de conversion', kind:'pct', pctRule:'unlock', scoring:'bands',
          derive:{from:['sold','proposed'], fn:(sold, prop) => prop > 0 ? sold / prop * 100 : null},
          aliases:['taux conv','taux conv %','taux de conversion','conversion','conversion rate','conv','taux conversion']},
        {key:'ppv', label:'CA PPV', kind:'money', dec:2, scoring:'target',
          aliases:['ca ppv','ppv','ventes ppv','revenu ppv','ppv revenue']},
        {key:'tips', label:'CA Tips', kind:'money', dec:2, scoring:'target',
          aliases:['ca tips','tips','pourboires','ca pourboires','tips revenue']},
        {key:'total', label:'CA total', kind:'money', dec:2, scoring:'target',
          aliases:['ca total','total','chiffre d affaires','chiffre d affaires total','revenue','total revenue','revenu total']}
      ],
      dashStats: [['sum','total',`CA de l'équipe`],['avg','conv','Taux de conversion moyen'],['sum','ppv','CA PPV'],['sum','tips','CA Tips']],
      defaults: {
        weights: {react:15, conv:25, ppv:20, tips:10, total:30},
        targets: {ppv:3500, tips:1200, total:5000},
        bands: {
          react: [[0,100],[60,90],[120,80],[180,65],[240,50],[300,30],[420,0]],
          conv: [[0,0],[10,30],[15,50],[20,65],[25,80],[30,90],[35,100]]
        },
        caps: {enabled:true, kpi:'conv', criticalBelow:10, criticalCap:'C', warnBelow:15, warnCap:'B'},
        grades: {S:90, A:80, B:70, C:60}
      }
    }
  };
  for (const P of Object.values(PLATFORMS)) {
    P.fields = [{key:'name', label:'Nom du chatter', aliases:NAME_ALIASES}, ...P.kpis];
    P.scored = P.kpis.filter(k => k.scoring !== 'info');
    P.kpi = Object.fromEntries(P.kpis.map(k => [k.key, k]));
    P.defaults.aliases = Object.fromEntries(P.fields.map(f => [f.key, []]));
  }

  const clone = o => JSON.parse(JSON.stringify(o));
  const r1 = x => Math.round((x + 1e-9) * 10) / 10;
  const r6 = x => Math.round(x * 1e6) / 1e6;
  const fr = (v, d = 2) => Number(v).toLocaleString('fr-FR', {maximumFractionDigits:d});
  const defaultSettings = pid => clone(PLATFORMS[pid].defaults);

  function mergeSettings(pid, saved) {
    const d = defaultSettings(pid);
    if (!saved || typeof saved !== 'object') return d;
    for (const k of ['weights','targets','caps','grades','aliases']) if (saved[k]) Object.assign(d[k], saved[k]);
    if (saved.bands) for (const b of Object.keys(d.bands)) if (Array.isArray(saved.bands[b])) d.bands[b] = saved.bands[b];
    return d;
  }
  // Anciens paramètres (version OF seule) → nouveau format
  function migrateLegacyOF(old) {
    if (!old || typeof old !== 'object') return null;
    return {weights: old.weights, targets: old.targets, grades: old.grades, aliases: old.aliases,
      bands: {unlock: old.unlockBands, golden: old.goldenBands, fan: old.fanBands},
      caps: Object.assign({enabled:true, kpi:'unlock'}, old.unlockCaps || {})};
  }

  /* ---------- Notation ---------- */
  function bandScore(v, bands) {
    const sorted = [...bands].sort((a,b) => a[0] - b[0]);
    let pts = sorted.length ? sorted[0][1] : 0;
    for (const [min, p] of sorted) if (v >= min - 1e-9) pts = p;
    return pts;
  }
  const propScore = (v, target) => target > 0 ? r1(Math.min(100, Math.max(0, v / target * 100))) : 0;
  function gradeFor(score, g) {
    if (score >= g.S) return 'S';
    if (score >= g.A) return 'A';
    if (score >= g.B) return 'B';
    if (score >= g.C) return 'C';
    return 'D';
  }
  const worseOf = (a, b) => GRADE_ORDER[Math.max(GRADE_ORDER.indexOf(a), GRADE_ORDER.indexOf(b))];

  // status : clé interne (Critical, Warning, At risk, Strong, On track), traduite à l'affichage.
  function scoreChatter(row, P, s) {
    const scores = {}, contrib = {};
    let total = 0;
    for (const k of P.scored) {
      scores[k.key] = k.scoring === 'target' ? propScore(row[k.key], s.targets[k.key]) : bandScore(row[k.key], s.bands[k.key]);
      contrib[k.key] = scores[k.key] * s.weights[k.key] / 100;
      total += contrib[k.key];
    }
    const final = r1(total);
    const scoreGrade = gradeFor(final, s.grades);
    const c = s.caps;
    let cap = null, critical = false;
    const warnings = [];
    if (c && c.enabled && row[c.kpi] != null) {
      const lab = P.kpi[c.kpi].label, v = row[c.kpi];
      if (v < c.criticalBelow) { critical = true; cap = c.criticalCap; warnings.push(`${lab} critique : inférieur à ${fr(c.criticalBelow)} %`); }
      else if (v < c.warnBelow) { cap = c.warnCap; warnings.push(`${lab} inférieur à ${fr(c.warnBelow)} %`); }
    }
    const grade = cap ? worseOf(scoreGrade, cap) : scoreGrade;
    const capped = grade !== scoreGrade;
    if (capped) warnings.push(`Grade plafonné à ${grade} (grade du score : ${scoreGrade})`);
    let status;
    if (critical) status = 'Critical';
    else if (cap) status = 'Warning';
    else if (grade === 'D') status = 'At risk';
    else if (grade === 'S' || grade === 'A') status = 'Strong';
    else status = 'On track';
    return {name: row.name, row, scores, contrib, final, scoreGrade, grade, capped, cap, critical, warnings, status};
  }

  function computePeriod(period, s) {
    const P = PLATFORMS[period.platform || 'of'];
    const results = period.rows.map(r => scoreChatter(r, P, s));
    results.sort((a,b) => b.final - a.final || a.name.localeCompare(b.name, 'fr'));
    let lastScore = null, lastRank = 0;
    results.forEach((r, i) => {
      if (r.final !== lastScore) { lastRank = i + 1; lastScore = r.final; }
      r.rank = lastRank;
    });
    const n = results.length;
    const sum = {}, avg = {}, avgScores = {};
    for (const k of P.kpis) {
      const vals = results.map(r => r.row[k.key]).filter(v => v != null);
      sum[k.key] = vals.reduce((a, v) => a + v, 0);
      avg[k.key] = vals.length ? sum[k.key] / vals.length : null;
    }
    for (const k of P.scored) avgScores[k.key] = n ? results.reduce((a, r) => a + r.scores[k.key], 0) / n : 0;
    const grades = {S:0, A:0, B:0, C:0, D:0};
    results.forEach(r => grades[r.grade]++);
    return {period, platform: P, results, stats: {
      count: n, grades, sum, avg, avgScores,
      avgScore: r1(n ? results.reduce((a, r) => a + r.final, 0) / n : 0),
      critical: results.filter(r => r.critical).length,
      capped: results.filter(r => r.capped).length
    }};
  }

  // Le store met en cache les résultats par période et vide le cache quand les paramètres changent :
  // chaque période est recalculée à partir de ses données brutes avec les paramètres de sa plateforme.
  function createStore(periods, settingsByPlatform) {
    const cache = new Map();
    return {
      periods,
      settings: pid => settingsByPlatform[pid],
      setSettings(pid, ns) { settingsByPlatform[pid] = ns; cache.clear(); },
      invalidate() { cache.clear(); },
      results(id) {
        if (!cache.has(id)) {
          const p = periods.find(x => x.id === id);
          cache.set(id, p ? computePeriod(p, settingsByPlatform[p.platform || 'of']) : null);
        }
        return cache.get(id);
      }
    };
  }

  /* ---------- Lecture des valeurs ---------- */
  function normHeader(s) {
    return String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
      .replace(/%/g, ' % ').replace(/[^a-z0-9%]+/g, ' ').replace(/\s+/g, ' ').trim();
  }
  function cellText(c) {
    if (c == null) return '';
    if (typeof c === 'object' && 'v' in c) return c.w != null ? String(c.w) : String(c.v);
    return String(c);
  }
  // Renvoie {value, pct} | {empty:true} | {invalid:true, text}
  function parseCell(c) {
    if (c == null) return {empty:true};
    if (typeof c === 'object' && 'v' in c) {
      if (typeof c.v === 'number') return {value: c.pct ? r6(c.v * 100) : c.v, pct: !!c.pct};
      c = c.v;
    }
    if (typeof c === 'number') return Number.isFinite(c) ? {value:c, pct:false} : {invalid:true, text:String(c)};
    const orig = String(c);
    let s = orig.trim();
    if (!s || /^(-|—|–|n\/?a|null|none|nd)$/i.test(s)) return {empty:true, text:s};
    const pct = s.includes('%');
    let neg = false;
    if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
    s = s.replace(/usd|eur|gbp/ig, '').replace(/[%$€£¥\s\u00a0\u202f']/g, '');
    if (s.startsWith('-')) { neg = !neg; s = s.slice(1); }
    else if (s.startsWith('+')) s = s.slice(1);
    const hasC = s.includes(','), hasD = s.includes('.');
    if (hasC && hasD) {
      s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
    } else if (hasC) {
      s = /^\d{1,3}(,\d{3})+$/.test(s) ? s.replace(/,/g, '') : s.replace(',', '.');
    }
    if (!/^(\d+\.?\d*|\.\d+)$/.test(s)) return {invalid:true, text:orig};
    let v = parseFloat(s);
    if (neg) v = -v;
    return {value:v, pct};
  }
  // Durées : « 140s », « 140 s », « 2m20s », « 2 min 20 s », « 02:20 », « 1:02:20 », « 140 » → secondes
  function parseDuration(c) {
    if (c == null) return {empty:true};
    if (typeof c === 'object' && 'v' in c) c = typeof c.v === 'number' ? c.v : c.w ?? c.v;
    if (typeof c === 'number') return Number.isFinite(c) ? {value:c} : {invalid:true, text:String(c)};
    const orig = String(c), s = orig.trim().toLowerCase().replace(/\s+/g, '');
    if (!s || /^(-|—|–|n\/?a|nd)$/.test(s)) return {empty:true, text:orig};
    if (/^-/.test(s)) return {value:-1};
    let m;
    if ((m = s.match(/^(\d+):(\d{1,2})(?::(\d{1,2}))?$/))) return {value: m[3] != null ? (+m[1]) * 3600 + (+m[2]) * 60 + (+m[3]) : (+m[1]) * 60 + (+m[2])};
    if ((m = s.match(/^(?:(\d+(?:[.,]\d+)?)h)?(?:(\d+(?:[.,]\d+)?)(?:min|mn|m))?(?:(\d+(?:[.,]\d+)?)(?:sec|s))?$/)) && (m[1] || m[2] || m[3]))
      return {value: [m[1], m[2], m[3]].map((x, i) => x ? parseFloat(x.replace(',', '.')) * [3600, 60, 1][i] : 0).reduce((a, b) => a + b, 0)};
    const p = parseCell(orig);
    return p.invalid || p.empty ? p : {value: p.value};
  }
  // Pourcentages : un % explicite est toujours respecté ; aucune valeur n'est convertie deux fois.
  // Règle « unlock » : valeur brute ≤ 1 = fraction (×100). Règle « golden » : seules les valeurs < 0,1 sont des fractions.
  function toPercent(p, rule) {
    if (p.pct) return r6(p.value);
    if (rule === 'golden') return p.value < 0.1 ? r6(p.value * 100) : r6(p.value);
    return p.value <= 1 ? r6(p.value * 100) : r6(p.value);
  }

  function parseCSV(text) {
    text = text.replace(/^\uFEFF/, '');
    const firstLine = text.split(/\r?\n/).find(l => l.trim()) || '';
    const counts = {',':0, ';':0, '\t':0};
    let q = false;
    for (const ch of firstLine) { if (ch === '"') q = !q; else if (!q && ch in counts) counts[ch]++; }
    const top = Object.entries(counts).sort((a,b) => b[1] - a[1])[0];
    const delim = top[1] > 0 ? top[0] : ',';
    const rows = []; let row = []; let field = ''; q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i+1] === '"') { field += '"'; i++; } else q = false; }
        else field += ch;
      } else if (ch === '"') q = true;
      else if (ch === delim) { row.push(field); field = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i+1] === '\n') i++;
        row.push(field); rows.push(row); row = []; field = '';
      } else field += ch;
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows.filter(r => r.some(c => String(c).trim() !== ''));
  }

  /* ---------- Détection des colonnes ---------- */
  function aliasList(P, field, s) {
    const f = P.fields.find(x => x.key === field);
    const custom = (s && s.aliases && s.aliases[field]) || [];
    const seen = new Set(); const out = [];
    for (const a of [...custom, ...f.aliases]) { const n = normHeader(a); if (n && !seen.has(n)) { seen.add(n); out.push(n); } }
    return out;
  }
  // Passe 1 : correspondance exacte (normalisée), champ par champ dans l'ordre de priorité.
  // Passe 2 : correspondance partielle sur mots entiers, alias le plus long d'abord. Une colonne n'est jamais utilisée deux fois.
  function detectColumns(P, headers, s) {
    const nh = headers.map(normHeader);
    const used = new Set();
    const map = {};
    const order = [P.fields[0], ...P.scored, ...P.kpis.filter(k => k.scoring === 'info')];
    for (const f of order) {
      map[f.key] = {idx:-1, type:'missing'};
      for (const a of aliasList(P, f.key, s)) {
        const i = nh.findIndex((h, j) => !used.has(j) && h === a);
        if (i >= 0) { map[f.key] = {idx:i, type:'exact', alias:a}; used.add(i); break; }
      }
    }
    const cands = [];
    order.forEach((f, ord) => {
      if (map[f.key].idx >= 0) return;
      for (const a of aliasList(P, f.key, s)) {
        if (a.length < 2) continue;
        nh.forEach((h, i) => {
          if (used.has(i) || !h) return;
          if (f.key === 'name' && /\b(creator|createur|creatrice|model|modele|account|compte|page)\b/.test(h)) return;
          if ((' ' + h + ' ').includes(' ' + a + ' ')) cands.push({f:f.key, i, len:a.length, ord, a});
        });
      }
    });
    cands.sort((x, y) => y.len - x.len || x.ord - y.ord || x.i - y.i);
    for (const c of cands) {
      if (map[c.f].idx >= 0 || used.has(c.i)) continue;
      map[c.f] = {idx:c.i, type:'partial', alias:c.a};
      used.add(c.i);
    }
    return map;
  }
  function findHeaderRow(P, grid, s) {
    let best = 0, bestCount = -1;
    for (let r = 0; r < Math.min(grid.length, 15); r++) {
      const det = detectColumns(P, grid[r].map(cellText), s);
      const cnt = P.fields.filter(f => det[f.key].idx >= 0).length;
      if (cnt > bestCount) { best = r; bestCount = cnt; }
    }
    return best;
  }
  // Champs obligatoires sans colonne (un KPI calculable à partir d'autres colonnes n'est pas manquant)
  function missingFields(P, mapping) {
    return P.fields.filter(f => mapping[f.key] < 0 && !f.optional && !(f.derive && f.derive.from.every(x => mapping[x] >= 0)));
  }

  /* ---------- Validation ---------- */
  const TOTAL_RE = /^(grand\s*)?totals?$|^total g[eé]n[eé]ral$|^sum$|^somme$|^all( chatters)?$|^tous$|^average$|^moyenne$|^team( total)?$|^[eé]quipe$/i;
  function buildRows(P, grid, headerRow, mapping) {
    const out = [];
    for (let r = headerRow + 1; r < grid.length; r++) {
      const cells = grid[r] || [];
      if (!cells.some(c => cellText(c).trim() !== '')) continue;
      const issues = [];
      const name = mapping.name >= 0 ? cellText(cells[mapping.name]).trim().replace(/\s+/g, ' ') : '';
      if (!name) issues.push({sev:'error', msg:'Nom du chatter vide'});
      const values = {}, derived = {};
      for (const k of P.kpis) {
        const idx = mapping[k.key];
        values[k.key] = null;
        if (idx < 0) continue;
        const p = k.kind === 'seconds' ? parseDuration(cells[idx]) : parseCell(cells[idx]);
        if (p.empty) { if (!k.optional) issues.push({sev:'error', msg:`Valeur manquante : ${k.label}`}); continue; }
        if (p.invalid) { issues.push({sev:'error', msg:`Valeur non numérique pour ${k.label} (« ${p.text} »)`}); continue; }
        if (p.value < 0) { issues.push({sev:'error', msg:`Valeur négative pour ${k.label}`}); continue; }
        const v = k.kind === 'pct' ? toPercent(p, k.pctRule) : r6(p.value);
        if (k.kind === 'pct' && v > 100) { issues.push({sev:'error', msg:`${k.label} hors de la plage 0–100 % (${fr(v)} %)`}); continue; }
        values[k.key] = v;
      }
      for (const k of P.kpis) {
        if (!k.derive || mapping[k.key] >= 0) continue;
        const args = k.derive.from.map(x => values[x]);
        if (args.every(a => a != null)) {
          const v = k.derive.fn(...args);
          if (v == null) issues.push({sev:'error', msg:`${k.label} impossible à calculer (division par zéro)`});
          else if (v > 100) issues.push({sev:'error', msg:`${k.label} calculé supérieur à 100 %`});
          else { values[k.key] = r6(v); derived[k.key] = true; }
        } else if (!issues.some(i => i.sev === 'error')) issues.push({sev:'error', msg:`Valeur manquante : ${k.label}`});
      }
      if (name && TOTAL_RE.test(name)) issues.push({sev:'warn', msg:'Ressemble à une ligne de total'});
      out.push({line: r + 1, name, values, derived, issues, include: false});
    }
    const counts = {};
    out.forEach(o => { if (o.name) { const k = o.name.toLowerCase(); counts[k] = (counts[k] || 0) + 1; } });
    out.forEach(o => {
      if (o.name && counts[o.name.toLowerCase()] > 1) o.issues.push({sev:'warn', msg:'Nom de chatter en double'});
      o.include = o.issues.length === 0;
    });
    return out;
  }
  function summarize(rows) {
    const total = rows.length;
    const valid = rows.filter(r => r.issues.length === 0).length;
    const errors = rows.filter(r => r.issues.some(i => i.sev === 'error')).length;
    return {total, valid, review: total - valid, errors, included: rows.filter(r => r.include).length};
  }

  /* ---------- Auto-tests ---------- */
  function runSelfTests(storedPeriods) {
    const OF = PLATFORMS.of, MYM = PLATFORMS.mym;
    const s = defaultSettings('of'), sm = defaultSettings('mym');
    const strong = {revenue:20000, ppv:10000, tips:5000, golden:2, fan:300};
    const tests = [];
    const t = (name, fn) => { try { const d = fn(); tests.push({name, pass: d.pass, detail: d.detail}); } catch (e) { tests.push({name, pass:false, detail:String(e)}); } };

    t('OF · Unlock Ratio à 15 % → alerte critique + grade plafonné à C', () => {
      const r = scoreChatter({name:'t1', ...strong, unlock:15}, OF, s);
      const pass = r.critical && r.status === 'Critical' && GRADE_ORDER.indexOf(r.grade) >= GRADE_ORDER.indexOf('C') && r.warnings.some(w => w.startsWith('Unlock Ratio critique'));
      return {pass, detail:`score ${fr(r.final, 1)}, grade du score ${r.scoreGrade}, grade final ${r.grade}, critique = ${r.critical ? 'oui' : 'non'}`};
    });
    t('OF · Unlock Ratio à 65 % → score Unlock de 90/100', () => {
      const r = scoreChatter({name:'t2', ...strong, unlock:65}, OF, s);
      return {pass: r.scores.unlock === 90, detail:`score Unlock ${r.scores.unlock}`};
    });
    t('OF · Unlock Ratio à 72 % → score Unlock de 100/100', () => {
      const r = scoreChatter({name:'t3', ...strong, unlock:72}, OF, s);
      return {pass: r.scores.unlock === 100, detail:`score Unlock ${r.scores.unlock}`};
    });
    t('OF · CA élevé + Unlock Ratio très faible → jamais S', () => {
      const rs = [5, 15, 25, 29.99].map(u => scoreChatter({name:'t4', ...strong, revenue:1e6, unlock:u}, OF, s));
      return {pass: rs.every(r => r.grade !== 'S' && GRADE_ORDER.indexOf(r.grade) >= GRADE_ORDER.indexOf('B')), detail: rs.map(r => `${fr(r.row.unlock)} % → ${fr(r.final, 1)} ${r.grade}`).join(' ; ')};
    });
    t(`OF · Changer l'objectif de CA recalcule toutes les périodes enregistrées`, () => {
      let periods = (storedPeriods || []).filter(p => (p.platform || 'of') === 'of' && p.rows && p.rows.length);
      const source = periods.length ? 'périodes enregistrées' : 'périodes de test';
      if (!periods.length) periods = [
        {id:'a', platform:'of', rows:[{name:'X', revenue:3500, unlock:55, ppv:2500, tips:700, golden:1, fan:120}, {name:'Y', revenue:9000, unlock:72, ppv:6000, tips:1600, golden:1.6, fan:190}]},
        {id:'b', platform:'of', rows:[{name:'X', revenue:5000, unlock:61, ppv:4000, tips:900, golden:1.2, fan:140}]}
      ];
      const store = createStore(clone(periods), {of: clone(s), mym: clone(sm)});
      const before = store.periods.map(p => store.results(p.id));
      const ns = clone(store.settings('of')); ns.targets.revenue = ns.targets.revenue * 2;
      store.setSettings('of', ns);
      let ok = true, changed = 0, checked = 0;
      store.periods.forEach((p, pi) => {
        store.results(p.id).results.forEach(r => {
          checked++;
          const exp = propScore(r.row.revenue, ns.targets.revenue);
          const expFinal = r1(OF.scored.reduce((a, k) => a + r.scores[k.key] * ns.weights[k.key] / 100, 0));
          if (r.scores.revenue !== exp || r.final !== expFinal) ok = false;
          const old = before[pi].results.find(o => o.name === r.name);
          if (old && (old.scores.revenue !== r.scores.revenue || old.final !== r.final)) changed++;
        });
      });
      return {pass: ok && changed > 0, detail:`${source} : ${checked} résultats revérifiés, ${changed} modifiés après doublement de l'objectif`};
    });
    t('MYM · « 140s » de réactivité → 140 secondes, 80/100', () => {
      const v = parseDuration('140s').value, r = scoreChatter({name:'m', react:v, conv:25, ppv:3000, tips:800, total:4000}, MYM, sm);
      return {pass: v === 140 && r.scores.react === 80, detail:`${v} s → ${r.scores.react}/100`};
    });
    t('MYM · Taux de conversion à 8 % → alerte critique + grade plafonné', () => {
      const r = scoreChatter({name:'m', react:30, conv:8, ppv:99999, tips:99999, total:99999}, MYM, sm);
      return {pass: r.critical && r.grade !== 'S' && GRADE_ORDER.indexOf(r.grade) >= GRADE_ORDER.indexOf(sm.caps.criticalCap), detail:`score ${fr(r.final, 1)}, grade final ${r.grade}`};
    });
    t('MYM · Montants « 4 966,31 EUR » et taux calculé si la colonne manque', () => {
      const grid = [['Chatter','Réactivité','Proposé','Vendu','CA PPV','CA Tips','CA Total'], ['A','140s','1173','248','4 966,31 EUR','684,48 EUR','5 650,79 EUR']];
      const map = Object.fromEntries(Object.entries(detectColumns(MYM, grid[0], sm)).map(([k, v]) => [k, v.idx]));
      const row = buildRows(MYM, grid, 0, map)[0];
      const ok = row.values.ppv === 4966.31 && row.values.total === 5650.79 && Math.abs(row.values.conv - 21.142) < 0.01 && row.derived.conv && missingFields(MYM, map).length === 0;
      return {pass: ok, detail:`CA PPV ${fr(row.values.ppv)} €, taux calculé ${fr(row.values.conv)} %`};
    });
    return tests;
  }

  return {GRADE_ORDER, PLATFORMS, clone, r1, defaultSettings, mergeSettings, migrateLegacyOF,
    bandScore, propScore, gradeFor, scoreChatter, computePeriod, createStore,
    normHeader, cellText, parseCell, parseDuration, toPercent, parseCSV, aliasList, detectColumns, findHeaderRow, missingFields, buildRows, summarize, runSelfTests};
})();
if (typeof module !== 'undefined') module.exports = RCA;
</script>

<!-- ============ APPLICATION : interface, stockage, import, graphiques ============ -->
<script>
(() => {
const {GRADE_ORDER, PLATFORMS} = RCA;
const PIDS = ['of', 'mym'];
const LS = {settings:'rca.settings.v2', legacySettings:'rca.settings.v1', periods:'rca.periods.v1', ui:'rca.ui.v2'};
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { toast(`Le stockage du navigateur est indisponible ou plein. Les modifications ne dureront que pendant cette session.`, true); return false; } };

/* ---------- Chargement + migration de l'ancienne version (OF seul) ---------- */
const savedSettings = lsGet(LS.settings, null) || {of: RCA.migrateLegacyOF(lsGet(LS.legacySettings, null))};
const allSettings = Object.fromEntries(PIDS.map(p => [p, RCA.mergeSettings(p, savedSettings[p])]));
const periods = lsGet(LS.periods, []);
periods.forEach(p => { if (!p.platform) p.platform = 'of'; });
const store = RCA.createStore(periods, allSettings);
const ui = Object.assign({period:{}, historyName:{}}, lsGet(LS.ui, {}));
const tbl = {sortKey:'final', dir:'desc', q:'', grade:'all', min:'', max:''};
const importDraft = {of:null, mym:null};
const settingsDraft = {of:null, mym:null};
let charts = [];

const saveSettings = () => lsSet(LS.settings, allSettings);
const savePeriods = () => lsSet(LS.periods, store.periods);
const saveUI = () => lsSet(LS.ui, {period: ui.period});
const platformPeriods = pid => store.periods.filter(p => p.platform === pid);
const sortedPeriods = pid => platformPeriods(pid).sort((a,b) => (b.start || '').localeCompare(a.start || '') || b.createdAt - a.createdAt);
const chronoPeriods = pid => platformPeriods(pid).sort((a,b) => (a.start || '').localeCompare(b.start || '') || a.createdAt - b.createdAt);
function currentPeriod(pid) {
  const list = sortedPeriods(pid);
  if (!list.length) return null;
  let p = list.find(x => x.id === ui.period[pid]);
  if (!p) { p = list[0]; ui.period[pid] = p.id; saveUI(); }
  return p;
}

/* ---------- Formatage (fr-FR) ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = (v, min, max) => Number(v).toLocaleString('fr-FR', {minimumFractionDigits:min, maximumFractionDigits:max});
const num = (v, d = 1) => nf(v, d, d);
const pct = (v, d = 2) => v == null ? '—' : nf(v, 0, d) + '\u00a0%';
const moneyP = (P, v, d = 0) => v == null ? '—' : nf(v, d, d) + '\u00a0' + P.currency;
function fmtK(P, k, v, dec) {
  if (v == null) return '—';
  if (k.kind === 'money') return moneyP(P, v, dec ?? k.dec ?? 0);
  if (k.kind === 'pct') return pct(v, 2);
  if (k.kind === 'seconds') return nf(v, 0, 0) + '\u00a0s';
  return nf(v, 0, 0);
}
const unitOf = (P, k) => k.kind === 'money' ? P.currency : k.kind === 'pct' ? '%' : k.kind === 'seconds' ? 's' : '';
const scClass = v => v >= 80 ? 'sc-hi' : v >= 50 ? 'sc-mid' : 'sc-lo';
const scColor = v => v >= 80 ? 'var(--green)' : v >= 50 ? 'var(--orange)' : 'var(--red)';
const plural = (n, one, many) => `${n} ${n > 1 ? many : one}`;
const ordinal = n => n === 1 ? '1er' : n + 'e';
function parseDate(s) { const [y,m,d] = (s || '').split('-').map(Number); return y ? new Date(y, m - 1, d) : null; }
function fmtRange(a, b) {
  const A = parseDate(a), B = parseDate(b);
  if (!A || !B) return 'Période sans date';
  const o = {day:'numeric', month:'short'};
  if (A.getFullYear() === B.getFullYear()) return `${A.toLocaleDateString('fr-FR', o)} – ${B.toLocaleDateString('fr-FR', o)} ${B.getFullYear()}`;
  return `${A.toLocaleDateString('fr-FR', {...o, year:'numeric'})} – ${B.toLocaleDateString('fr-FR', {...o, year:'numeric'})}`;
}
const STATUS_LABEL = {'Critical':'Critique', 'Warning':'Attention', 'At risk':'À risque', 'Strong':'Excellent', 'On track':'Correct'};
const capLabel = P => P.kpi[allSettings[P.id].caps.kpi]?.label || 'KPI';
const gradeBadge = (P, r) => `<span class="badge ${r.grade} g${r.grade}" title="${r.capped ? `Grade du score ${r.scoreGrade}, plafonné à ${r.grade} par le ${esc(capLabel(P))}` : `Grade ${r.grade}`}">${r.grade}</span>${r.capped ? `<span class="capnote">plafonné (${r.scoreGrade})</span>` : ''}`;
const statusPill = s => `<span class="pill ${s.replace(/\s/g,'')}">${esc(STATUS_LABEL[s] || s)}</span>`;
const pbadge = (P, lg) => `<span class="pbadge ${P.id}${lg ? ' lg' : ''}" aria-hidden="true">${P.short}</span>`;

/* ---------- Notification + fenêtre ---------- */
let toastTimer;
function toast(msg, err) {
  document.querySelector('.toast')?.remove();
  const el = document.createElement('div');
  el.className = 'toast' + (err ? ' err' : '');
  el.setAttribute('role', 'status');
  el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 4200);
}
function modal(title, bodyHTML, okLabel, cancelLabel = 'Annuler') {
  return new Promise(res => {
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><div>${bodyHTML}</div><div class="acts">${cancelLabel ? `<button class="btn ghost" data-a="0">${esc(cancelLabel)}</button>` : ''}${okLabel ? `<button class="btn primary" data-a="1">${esc(okLabel)}</button>` : ''}</div></div>`;
    const close = v => { bg.remove(); document.removeEventListener('keydown', onKey); res(v); };
    const onKey = e => { if (e.key === 'Escape') close(false); };
    bg.addEventListener('click', e => { if (e.target === bg) close(false); const a = e.target.closest('[data-a]'); if (a) close(a.dataset.a === '1'); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(bg);
    bg.querySelector('[data-a="1"],[data-a="0"]')?.focus();
  });
}

/* ---------- Navigation ---------- */
const ICONS = {
  dashboard:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',
  chatters:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.7 3 2.4 3.5 5.2"/>',

  download:'<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>'
};
const icon = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k]}</svg>`;
const PAGES = [['dashboard','Tableau de bord'],['chatters','Chatters'],['analytics',`Analyse d'équipe`],['history','Historique'],['import','Import'],['settings','Paramètres']];
const PAGE_LABEL = Object.fromEntries(PAGES);
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  const m = h.match(/^(of|mym)\/(.*)$/);
  const pid = m ? m[1] : 'of', rest = m ? m[2] : h;
  if (rest.startsWith('chatter/')) return {pid, page:'chatters', chatter:rest.slice(8)};
  return {pid, page: PAGE_LABEL[rest] ? rest : 'dashboard'};
}
const go = h => { location.hash = h; };
window.addEventListener('hashchange', render);

function renderNav(rt) {
  document.getElementById('nav').innerHTML = PIDS.map(pid => {
    const P = PLATFORMS[pid];
    return `<div class="nav-group ${rt.pid === pid ? 'cur' : ''}"><div class="nav-head">${pbadge(P)}<span>${P.name}</span></div>
      ${PAGES.map(([k, l]) => { const on = rt.pid === pid && rt.page === k; return `<a href="#${pid}/${k}" class="${on ? 'on' : ''}" ${on ? 'aria-current="page"' : ''} title="${esc(l)} ${P.name}">${icon(k)}<span>${esc(l)}</span></a>`; }).join('')}</div>`;
  }).join('');
}
function topbar(P, title, withPicker) {
  let right = '';
  if (withPicker && platformPeriods(P.id).length) {
    const cur = currentPeriod(P.id);
    right = `<label class="picker">Période <select id="period-pick">${sortedPeriods(P.id).map(p => `<option value="${p.id}" ${p.id === cur.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label>
      <button class="btn" id="export-btn" type="button">${icon('download')}Exporter en CSV</button>`;
  }
  return `<div class="top"><h1>${pbadge(P, true)}<span>${esc(title)} <span class="plat">${P.name}</span></span></h1>${right}</div>`;
}
function bindTopbar(P) {
  document.getElementById('period-pick')?.addEventListener('change', e => { ui.period[P.id] = e.target.value; saveUI(); render(); });
  document.getElementById('export-btn')?.addEventListener('click', () => exportCSV(P));
}
function destroyCharts() { charts.forEach(c => { try { c.destroy(); } catch {} }); charts = []; }

function render() {
  destroyCharts();
  const rt = route(), P = PLATFORMS[rt.pid];
  renderNav(rt);
  const main = document.getElementById('main');
  main.dataset.platform = P.id;
  if (rt.page === 'dashboard') renderDashboard(main, P);
  else if (rt.page === 'chatters') rt.chatter != null ? renderDetail(main, P, rt.chatter) : renderChatters(main, P);
  else if (rt.page === 'analytics') renderAnalytics(main, P);
  else if (rt.page === 'history') renderHistory(main, P);
  else if (rt.page === 'import') renderImport(main, P);
  else if (rt.page === 'settings') renderSettings(main, P);
  bindTopbar(P);
}

function emptyState(P, title) {
  return topbar(P, title, false) + `<div class="panel empty"><h2 style="font-size:18px;margin-bottom:6px">Aucune période ${P.name} importée</h2><p class="hint" style="margin:0 auto 16px;max-width:460px">Importez un rapport ${P.name} (CSV ou XLSX). Chaque chatter est noté et classé automatiquement.</p><a class="btn primary" href="#${P.id}/import">Importer un rapport ${P.name}</a></div>`;
}

/* ---------- Tableau de classement ---------- */
const STATUS_ORDER = ['Strong','On track','Warning','At risk','Critical'];
function columns(P) {
  return [
    {k:'rank', l:'Rang', num:true, v:r => r.rank, h:r => r.rank === 1 ? '1<sup>er</sup>' : `${r.rank}<sup>e</sup>`},
    {k:'name', l:'Chatter', v:r => r.name.toLowerCase(), h:r => `<strong>${esc(r.name)}</strong>`},
    {k:'final', l:'Score final', num:true, v:r => r.final, h:r => `<div class="scorecell"><span class="minibar"><i style="width:${r.final}%;background:${scColor(r.final)}"></i></span><strong>${num(r.final)}</strong></div>`},
    {k:'grade', l:'Grade', v:r => GRADE_ORDER.indexOf(r.grade), h:r => gradeBadge(P, r)},
    ...P.kpis.map(k => ({k:k.key, l:k.label, num:true, v:r => r.row[k.key] ?? -Infinity,
      h:r => `${fmtK(P, k, r.row[k.key])}${k.scoring !== 'info' ? `<span class="sub ${scClass(r.scores[k.key])}">${num(r.scores[k.key], 0)}</span>` : ''}`})),
    {k:'status', l:'Statut', v:r => STATUS_ORDER.indexOf(r.status), h:r => statusPill(r.status)}
  ];
}
function rankingHTML(P, id) {
  const cols = columns(P);
  if (!cols.some(c => c.k === tbl.sortKey)) { tbl.sortKey = 'final'; tbl.dir = 'desc'; }
  return `<div class="tbl-controls">
    <input type="search" id="${id}-q" placeholder="Rechercher un chatter" value="${esc(tbl.q)}" aria-label="Rechercher un chatter par nom">
    <select id="${id}-grade" aria-label="Filtrer par grade"><option value="all">Tous les grades</option>${GRADE_ORDER.map(g => `<option value="${g}" ${tbl.grade === g ? 'selected' : ''}>Grade ${g}</option>`).join('')}</select>
    <input type="number" id="${id}-min" placeholder="Score min" min="0" max="100" value="${esc(tbl.min)}" aria-label="Score minimum">
    <input type="number" id="${id}-max" placeholder="Score max" min="0" max="100" value="${esc(tbl.max)}" aria-label="Score maximum">
    <span class="count" id="${id}-count"></span>
  </div>
  <div class="tbl-wrap"><table><thead><tr>${cols.map(c => `<th class="sort ${c.num ? 'num' : ''}" data-k="${c.k}" tabindex="0" ${tbl.sortKey === c.k ? `aria-sort="${tbl.dir === 'asc' ? 'ascending' : 'descending'}"` : ''}>${esc(c.l)}</th>`).join('')}</tr></thead><tbody id="${id}-body"></tbody></table></div>
  <p class="hint" style="margin:8px 0 0;font-size:12px">Le petit chiffre à côté d'un KPI est son score sur 100.${P.kpis.some(k => k.scoring === 'info') ? ` ${P.kpis.filter(k => k.scoring === 'info').map(k => k.label).join(' et ')} sont affichés à titre d'information et ne sont pas notés.` : ''} Le classement utilise toujours le score pondéré complet.</p>`;
}
function bindRanking(P, id, res) {
  const cols = columns(P);
  const body = document.getElementById(id + '-body');
  const draw = () => {
    const q = tbl.q.trim().toLowerCase();
    const mn = tbl.min === '' ? -Infinity : Number(tbl.min), mx = tbl.max === '' ? Infinity : Number(tbl.max);
    const col = cols.find(c => c.k === tbl.sortKey) || cols[2];
    const rows = res.results.filter(r => (!q || r.name.toLowerCase().includes(q)) && (tbl.grade === 'all' || r.grade === tbl.grade) && r.final >= mn && r.final <= mx)
      .sort((a, b) => { const x = col.v(a), y = col.v(b); const c = x < y ? -1 : x > y ? 1 : 0; return (tbl.dir === 'asc' ? c : -c) || a.rank - b.rank; });
    body.innerHTML = rows.length ? rows.map(r => `<tr class="click" data-name="${esc(r.name)}" tabindex="0">${cols.map(c => `<td class="${c.num ? 'num' : ''}">${c.h(r)}</td>`).join('')}</tr>`).join('')
      : `<tr><td colspan="${cols.length}" class="empty">Aucun chatter ne correspond à ces filtres.</td></tr>`;
    document.getElementById(id + '-count').textContent = `${rows.length} sur ${plural(res.results.length, 'chatter', 'chatters')}`;
  };
  const on = (sfx, ev, fn) => document.getElementById(id + sfx).addEventListener(ev, fn);
  on('-q', 'input', e => { tbl.q = e.target.value; draw(); });
  on('-grade', 'change', e => { tbl.grade = e.target.value; draw(); });
  on('-min', 'input', e => { tbl.min = e.target.value; draw(); });
  on('-max', 'input', e => { tbl.max = e.target.value; draw(); });
  const table = body.closest('table');
  const sortBy = th => {
    const k = th.dataset.k;
    if (tbl.sortKey === k) tbl.dir = tbl.dir === 'asc' ? 'desc' : 'asc';
    else { tbl.sortKey = k; tbl.dir = (k === 'name' || k === 'rank' || k === 'grade' || k === 'status' || P.kpi[k]?.lowerIsBetter) ? 'asc' : 'desc'; }
    table.querySelectorAll('th').forEach(t => t.removeAttribute('aria-sort'));
    th.setAttribute('aria-sort', tbl.dir === 'asc' ? 'ascending' : 'descending');
    draw();
  };
  table.querySelector('thead').addEventListener('click', e => { const th = e.target.closest('th'); if (th) sortBy(th); });
  table.querySelector('thead').addEventListener('keydown', e => { const th = e.target.closest('th'); if (th && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); sortBy(th); } });
  const open = tr => go(`${P.id}/chatter/` + encodeURIComponent(tr.dataset.name));
  body.addEventListener('click', e => { const tr = e.target.closest('tr[data-name]'); if (tr) open(tr); });
  body.addEventListener('keydown', e => { const tr = e.target.closest('tr[data-name]'); if (tr && e.key === 'Enter') open(tr); });
  draw();
  return draw;
}

/* ---------- Tableau de bord ---------- */
function renderDashboard(main, P) {
  const p = currentPeriod(P.id);
  if (!p) { main.innerHTML = emptyState(P, 'Tableau de bord'); return; }
  const s = allSettings[P.id], res = store.results(p.id), st = res.stats;
  const statCell = ([agg, key, label]) => {
    const k = P.kpi[key];
    if (agg === 'sum') return `<div class="stat"><div class="k">${esc(label)}</div><div class="v">${fmtK(P, k, st.sum[key], 0)}</div><div class="d">${fmtK(P, k, st.avg[key], 0)} par chatter</div></div>`;
    const capNote = s.caps.enabled && s.caps.kpi === key ? `Critique sous ${pct(s.caps.criticalBelow)}` : 'Moyenne des chatters';
    return `<div class="stat"><div class="k">${esc(label)}</div><div class="v">${fmtK(P, k, st.avg[key])}</div><div class="d">${capNote}</div></div>`;
  };
  main.innerHTML = topbar(P, 'Tableau de bord', true) + `<div class="stack">
    <section class="hero">
      <div>
        <div class="period">${esc(fmtRange(p.start, p.end))}</div>
        <div class="meta">${plural(st.count, 'chatter noté', 'chatters notés')} à partir de ${esc(p.fileName || `l'import`)}${p.excluded ? `, ${plural(p.excluded, 'ligne exclue', 'lignes exclues')} à l'import` : ''}${st.critical ? ` · <span style="color:var(--red)">${st.critical} avec un ${esc(capLabel(P))} critique</span>` : ''}</div>
      </div>
      <div class="dist" aria-label="Chatters par grade">${GRADE_ORDER.map(g => `<button type="button" class="g ${g}" data-grade="${g}" title="Afficher uniquement le grade ${g}"><div class="letter g${g}">${g}</div><div class="n">${st.grades[g]}</div></button>`).join('')}</div>
    </section>
    <section class="stats">
      <div class="stat"><div class="k">Chatters</div><div class="v">${st.count}</div><div class="d">${plural(st.capped, 'grade plafonné', 'grades plafonnés')}</div></div>
      <div class="stat"><div class="k">Score moyen de l'équipe</div><div class="v ${scClass(st.avgScore)}">${num(st.avgScore)}</div><div class="d">Niveau grade ${RCA.gradeFor(st.avgScore, s.grades)}</div></div>
      ${P.dashStats.map(statCell).join('')}
    </section>
    <section class="panel"><h2>Classement de l'équipe</h2><p class="hint">Les ${st.count} chatters, classés par score final pondéré. Cliquez sur une ligne pour voir le détail complet.</p>${rankingHTML(P, 'dash')}</section>
  </div>`;
  const draw = bindRanking(P, 'dash', res);
  main.querySelectorAll('.dist .g').forEach(b => b.addEventListener('click', () => {
    tbl.grade = tbl.grade === b.dataset.grade ? 'all' : b.dataset.grade;
    document.getElementById('dash-grade').value = tbl.grade; draw();
  }));
}

/* ---------- Chatters ---------- */
function renderChatters(main, P) {
  const p = currentPeriod(P.id);
  if (!p) { main.innerHTML = emptyState(P, 'Chatters'); return; }
  main.innerHTML = topbar(P, 'Chatters', true) + `<section class="panel"><h2>${esc(p.name)}</h2><p class="hint">Triez par n'importe quelle colonne, cherchez par nom ou filtrez par grade et par score. Cliquez sur un chatter pour le détail de ses KPI.</p>${rankingHTML(P, 'ch')}</section>`;
  bindRanking(P, 'ch', store.results(p.id));
}

// Palier suivant dans le « bon » sens : vers le haut pour la plupart des KPI, vers le bas pour la réactivité.
function improvement(k, v, bands) {
  const sorted = [...bands].sort((a,b) => a[0] - b[0]);
  const i = sorted.reduce((acc, b, j) => v >= b[0] - 1e-9 ? j : acc, 0);
  if (!k.lowerIsBetter) { const nb = sorted[i + 1]; return nb && nb[1] > sorted[i][1] ? {verb:'atteindre', v:nb[0], pts:nb[1]} : null; }
  const pb = sorted[i - 1]; return pb && pb[1] > sorted[i][1] ? {verb:'descendre sous', v:sorted[i][0], pts:pb[1]} : null;
}
function observations(P, r, res) {
  const s = allSettings[P.id], o = [], c = s.caps;
  const capKpi = c.enabled ? P.kpi[c.kpi] : null;
  if (capKpi && r.row[c.kpi] != null) {
    const v = r.row[c.kpi];
    if (r.critical) o.push(['crit', `${capKpi.label} critique : ${pct(v)}, sous le seuil de ${pct(c.criticalBelow)}. Grade plafonné à ${c.criticalCap}.`]);
    else if (v < c.warnBelow) o.push(['warn', `${capKpi.label} de ${pct(v)}, sous ${pct(c.warnBelow)}. Grade plafonné à ${c.warnCap}.`]);
  }
  if (r.capped) o.push(['warn', `Le score de ${num(r.final)} correspond au grade ${r.scoreGrade} ; le plafond lié au ${capKpi ? capKpi.label : 'KPI'} fixe le grade final à ${r.grade}.`]);
  for (const k of P.scored) {
    const v = r.row[k.key], sc = r.scores[k.key];
    if (k.scoring === 'target') {
      const t = s.targets[k.key], share = t ? v / t * 100 : 0;
      if (v >= t) o.push(['good', `${k.label} : objectif atteint (${fmtK(P, k, v)} pour un objectif de ${fmtK(P, k, t)}).`]);
      else o.push([share < 50 ? 'crit' : 'warn', `${k.label} sous l'objectif : ${fmtK(P, k, v)} sur ${fmtK(P, k, t)} (${num(share, 0)} %), il manque ${fmtK(P, k, t - v)}.`]);
    } else {
      if (r.critical && k.key === c.kpi) continue;
      const imp = improvement(k, v, s.bands[k.key]);
      const lowest = Math.min(...s.bands[k.key].map(b => b[1]));
      if (sc >= 100) o.push(['good', `Excellent ${k.label} (${fmtK(P, k, v)}) : palier maximum atteint.`]);
      else o.push([sc <= lowest ? 'crit' : sc >= 80 ? 'good' : 'warn', `${k.label} de ${fmtK(P, k, v)} : ${sc}/100${imp ? ` ; ${imp.verb} ${fmtK(P, k, imp.v)} le fait passer à ${imp.pts}` : ''}.`]);
    }
  }
  if (P.id === 'mym' && r.row.sold != null && r.row.proposed != null) o.push(['info', `${nf(r.row.sold, 0, 0)} ventes pour ${nf(r.row.proposed, 0, 0)} médias proposés.`]);
  const losses = P.scored.map(k => [k, (100 - r.scores[k.key]) * s.weights[k.key] / 100]).sort((a,b) => b[1] - a[1]);
  if (losses.length && losses[0][1] > 0.05) o.push(['warn', `Plus grosse perte de points : ${losses[0][0].label}, qui coûte ${num(losses[0][1], 2)} points pondérés.`]);
  const diff = RCA.r1(r.final - res.stats.avgScore);
  o.push([diff >= 0 ? 'good' : 'warn', `Classé ${ordinal(r.rank)} sur ${res.stats.count}, ${diff >= 0 ? '+' : ''}${num(diff)} points par rapport à la moyenne de l'équipe (${num(res.stats.avgScore)}).`]);
  return o;
}
function renderDetail(main, P, name) {
  const p = currentPeriod(P.id);
  if (!p) { main.innerHTML = emptyState(P, 'Chatter'); return; }
  const res = store.results(p.id);
  const r = res.results.find(x => x.name === name);
  if (!r) {
    main.innerHTML = topbar(P, 'Chatter', true) + `<a class="back" href="#${P.id}/chatters" style="display:inline-block;text-decoration:none">‹ Tous les chatters</a><div class="panel empty">${esc(name)} n'a pas de données sur ${esc(p.name)}. Choisissez une autre période ci-dessus ou ouvrez l'<a href="#${P.id}/history">Historique</a>.</div>`;
    return;
  }
  const s = allSettings[P.id];
  const info = P.kpis.filter(k => k.scoring === 'info');
  main.innerHTML = topbar(P, 'Détail du chatter', true) + `<button class="back" type="button" id="back">‹ Tous les chatters</button>
  <div class="stack">
    <section class="panel detail-head">
      <div class="biggrade ${r.grade} g${r.grade}" aria-label="Grade final ${r.grade}">${r.grade}</div>
      <div><div class="who">${esc(r.name)}</div>
        <div class="line">${ordinal(r.rank)} sur ${res.stats.count} · ${esc(p.name)} · ${statusPill(r.status)}</div>
        <div class="line">${r.capped ? `Grade du score <b class="g${r.scoreGrade}">${r.scoreGrade}</b>, grade final <b class="g${r.grade}">${r.grade}</b> après le plafond lié au ${esc(capLabel(P))}.` : `Le grade final correspond au grade du score.`}</div>
      </div>
      <div class="scorebox"><div class="v ${scClass(r.final)}">${num(r.final)}</div><div class="k">Score final / 100</div></div>
    </section>
    <section class="panel"><h2>Détail des KPI</h2><p class="hint">Chaque KPI est noté sur 100, puis multiplié par son poids. La somme des contributions donne le score final.</p>
      ${P.scored.map(k => `<div class="kpi-row">
        <div class="lab">${k.label}</div>
        <div class="raw">${fmtK(P, k, r.row[k.key])}</div>
        <div class="bar" role="img" aria-label="Score ${esc(k.label)} : ${r.scores[k.key]} sur 100"><i style="width:${r.scores[k.key]}%;background:${scColor(r.scores[k.key])}"></i></div>
        <div class="math"><b class="${scClass(r.scores[k.key])}">${num(r.scores[k.key], r.scores[k.key] % 1 ? 1 : 0)}</b>/100 × ${nf(s.weights[k.key], 0, 2)} % = <b>${num(r.contrib[k.key], 2)}</b></div>
      </div>`).join('')}
      ${info.map(k => `<div class="kpi-row"><div class="lab">${k.label}</div><div class="raw">${fmtK(P, k, r.row[k.key])}</div><div></div><div class="math">Information, non noté</div></div>`).join('')}
      <div class="kpi-row" style="border-top:1px solid var(--line)"><div class="lab">Score final</div><div></div><div></div><div class="math"><b>${num(r.final)}</b> → grade <b class="g${r.grade}">${r.grade}</b></div></div>
    </section>
    <div class="grid2">
      <section class="panel"><h2>Observations</h2><p class="hint">Générées à partir des chiffres de ce chatter et des paramètres ${P.name} actuels.</p><ul class="obs">${observations(P, r, res).map(([t, m]) => `<li class="${t}">${esc(m)}</li>`).join('')}</ul></section>
      <section class="panel"><h2>Score sur les périodes</h2><p class="hint">L'évolution complète est sur la page <a href="#${P.id}/history" id="hist-link">Historique</a>.</p><div class="chart-box" id="mini-box"><canvas id="mini"></canvas></div></section>
    </div>
  </div>`;
  document.getElementById('back').addEventListener('click', () => go(`${P.id}/chatters`));
  document.getElementById('hist-link').addEventListener('click', () => { ui.historyName[P.id] = r.name; });
  const series = chronoPeriods(P.id).map(pp => ({p: pp, r: store.results(pp.id).results.find(x => x.name === r.name)}));
  lineChart('mini', series.map(x => x.p.name), [{label:'Score final', data: series.map(x => x.r ? x.r.final : null), color:'#EE5B45', grades: series.map(x => x.r ? x.r.grade : null)}], {min:0, max:100});
}

/* ---------- Graphiques ---------- */
function chartsReady(boxId) {
  if (window.Chart) return true;
  const b = document.getElementById(boxId);
  if (b) b.innerHTML = `<div class="nochart">Les graphiques n'ont pas pu se charger (Chart.js inaccessible). Les scores et les tableaux fonctionnent toujours.</div>`;
  return false;
}
function lineChart(canvasId, labels, sets, yopt = {}, fmt) {
  const cv = document.getElementById(canvasId);
  if (!cv || !chartsReady(cv.parentElement.id)) return;
  Chart.defaults.color = '#ABA3CC';
  Chart.defaults.borderColor = '#281F4B';
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  charts.push(new Chart(cv, {
    type:'line',
    data:{labels, datasets: sets.map(d => ({label:d.label, data:d.data, borderColor:d.color, backgroundColor:d.color, pointRadius:4, pointHoverRadius:6, tension:.25, spanGaps:false, borderWidth:2}))},

/* ---------- Analyse d'équipe ---------- */
// Cible : l'objectif configuré, ou le seuil qui donne le maximum de points pour les KPI à paliers.
function kpiTarget(P, k, s) {
  if (k.scoring === 'target') return {v: s.targets[k.key], note:'objectif configuré', meets: v => v >= s.targets[k.key] - 1e-9, sign:''};
  const sorted = [...s.bands[k.key]].sort((a,b) => a[0] - b[0]);
  const maxPts = Math.max(...sorted.map(b => b[1]));
  if (k.lowerIsBetter) {
    const i = sorted.findIndex(b => b[1] === maxPts), next = sorted[i + 1];
    const lim = next ? next[0] : Infinity;
    return {v: lim, note:'seuil du score maximum', meets: v => v < lim - 1e-9, sign:'< '};
  }
  const top = sorted.filter(b => b[1] === maxPts)[0];
  return {v: top[0], note:'seuil du score maximum', meets: v => v >= top[0] - 1e-9, sign:''};
}

      ${rows.map(r => `<tr><td><strong>${r.k.label}</strong></td><td class="num">${nf(s.weights[r.k.key], 0, 2)} %</td><td class="num">${fmtK(P, r.k, r.avg)}</td><td class="num">${r.t.sign}${fmtK(P, r.k, r.t.v)}</td><td class="num ${scClass(r.avgScore)}">${num(r.avgScore)}</td><td class="num">${r.meeting} / ${st.count}</td><td>${r.below ? statusPill(r.avgScore < 50 ? 'Critical' : 'Warning') : `<span class="pill Strong">Atteint</span>`}</td></tr>`).join('')}

/* ---------- Import ---------- */
function gridFromWorkbook(wb) {
  const ws = wb.Sheets[wb.SheetNames[0]];
  if (!ws || !ws['!ref']) return [];
  const range = XLSX.utils.decode_range(ws['!ref']);
  const grid = [];
  for (let r = range.s.r; r <= range.e.r; r++) {
    const row = [];
    for (let c = range.s.c; c <= range.e.c; c++) {
      const cell = ws[XLSX.utils.encode_cell({r, c})];
      if (!cell) row.push(null);
      else if (cell.t === 'n') row.push({v: cell.v, pct: /%/.test(cell.z || ''), w: cell.w});
      else row.push(cell.w != null ? String(cell.w) : String(cell.v ?? ''));
    }
    grid.push(row);
  }
  return grid.filter(r => r.some(c => RCA.cellText(c).trim() !== ''));
}
async function handleFile(P, file) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  let grid;
  try {
    if (ext === 'csv' || ext === 'tsv' || ext === 'txt') {
      grid = RCA.parseCSV(await file.text());
    } else if (ext === 'xlsx' || ext === 'xls') {
      if (!window.XLSX) { toast(`Le lecteur XLSX n'a pas pu se charger. Exportez le rapport en CSV à la place.`, true); return; }
      grid = gridFromWorkbook(XLSX.read(await file.arrayBuffer(), {type:'array', cellNF:true}));
    } else { toast(`« ${file.name} » n'est pas un fichier CSV ou XLSX.`, true); return; }
  } catch (e) { toast(`Impossible de lire « ${file.name} » : ${e.message}`, true); return; }
  if (grid.length < 2) { toast(`« ${file.name} » ne contient aucune ligne de données.`, true); return; }
  const s = allSettings[P.id];
  const headerRow = RCA.findHeaderRow(P, grid, s);
  const headers = grid[headerRow].map(c => RCA.cellText(c).trim());
  const det = RCA.detectColumns(P, headers, s);
  const dates = (file.name.match(/\d{4}-\d{2}-\d{2}/g) || []);
  const d = importDraft[P.id] = {fileName: file.name, grid, headerRow, headers, det, mapping: Object.fromEntries(P.fields.map(f => [f.key, det[f.key].idx])), manual:{}, onlyIssues:false, remember:true,
    start: dates[0] || '', end: dates[1] || dates[0] || ''};
  d.rows = RCA.buildRows(P, grid, headerRow, d.mapping);
  const matched = P.fields.filter(f => d.mapping[f.key] >= 0).length;
  if (matched <= 2) toast(`Très peu de colonnes reconnues. Vérifiez qu'il s'agit bien d'un export ${P.name}.`, true);
  render();
}

  const d = importDraft[P.id];

  const keep = () => { const y = window.scrollY; render(); window.scrollTo(0, y); };

  document.getElementById('d-end').addEventListener('change', e => { d.end = e.target.value; keep(); });

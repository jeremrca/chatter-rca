  document.querySelectorAll('[data-map]').forEach(sel => sel.addEventListener('change', () => {
    const f = sel.dataset.map, idx = Number(sel.value);
    for (const k of Object.keys(d.mapping)) if (k !== f && idx >= 0 && d.mapping[k] === idx) { d.mapping[k] = -1; d.manual[k] = true; }
    d.mapping[f] = idx; d.manual[f] = true;
    d.rows = RCA.buildRows(P, d.grid, d.headerRow, d.mapping);
    keep();
  }));
  document.querySelectorAll('[data-inc]').forEach(cb => cb.addEventListener('change', () => { d.rows[Number(cb.dataset.inc)].include = cb.checked; keep(); }));
  document.getElementById('cancel-import').addEventListener('click', () => { importDraft[P.id] = null; render(); });
  document.getElementById('confirm-import').addEventListener('click', () => confirmImport(P));
}
function confirmImport(P) {
  const d = importDraft[P.id];
  const rows = d.rows.filter(r => r.include && !r.issues.some(i => i.sev === 'error')).map(r => ({name: r.name, ...r.values}));
  if (rows.some(r => P.scored.some(k => r[k.key] == null))) { toast('Certaines lignes sélectionnées ont des KPI manquants.', true); return; }
  if (d.remember) {
    const s = RCA.clone(allSettings[P.id]); let added = 0;
    for (const [k, man] of Object.entries(d.manual)) {
      const idx = d.mapping[k]; if (!man || idx < 0) continue;
      const h = d.headers[idx]; if (!h) continue;
      if (!RCA.aliasList(P, k, s).includes(RCA.normHeader(h))) { s.aliases[k] = [...(s.aliases[k] || []), h]; added++; }
    }
    if (added) { store.setSettings(P.id, s); saveSettings(); }
  }
  const period = {id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), platform: P.id, name: (d.label || '').trim() || fmtRange(d.start, d.end), start: d.start, end: d.end,
    fileName: d.fileName, createdAt: Date.now(), excluded: d.rows.length - rows.length, rows};
  store.periods.push(period); store.invalidate(); savePeriods();
  ui.period[P.id] = period.id; saveUI();
  importDraft[P.id] = null;
  toast(`${plural(rows.length, 'chatter importé', 'chatters importés')} dans ${P.name} · ${period.name}.`);
  go(`${P.id}/dashboard`);
}

/* ---------- Export (format Excel français : séparateur ; et virgule décimale) ---------- */
function csvCell(v) {
  const s = typeof v === 'number' ? String(v).replace('.', ',') : String(v ?? '');
  return /[";\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
async function exportCSV(P) {
  const p = currentPeriod(P.id); if (!p) return;
  const res = store.results(p.id);
  const unit = k => k.kind === 'pct' ? ' (%)' : k.kind === 'seconds' ? ' (s)' : k.kind === 'money' ? ` (${P.currency})` : '';
  const head = ['Chatter','Plateforme','Période', ...P.kpis.flatMap(k => k.scoring === 'info' ? [k.label + unit(k)] : [k.label + unit(k), 'Score ' + k.label]), 'Score final','Grade','Alertes'];
  const lines = [head.map(csvCell).join(';')].concat(res.results.map(r => [r.name, P.name, p.name,
    ...P.kpis.flatMap(k => k.scoring === 'info' ? [r.row[k.key] ?? ''] : [r.row[k.key], r.scores[k.key]]), r.final, r.grade, r.warnings.join(' ; ')].map(csvCell).join(';')));
  const data = '\uFEFF' + lines.join('\r\n');
  const filename = `notation-${P.id}_${p.start || 'periode'}${p.end ? '_' + p.end : ''}.csv`;
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch { dl = null; }
  if (dl) {
    try { await dl.save({filename, data}); toast('Export enregistré.'); }
    catch (e) { if (e && e.code !== 'declined') toast(`L'export n'a pas pu être enregistré ici.`, true); }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], {type:'text/csv;charset=utf-8'}));
  a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- Paramètres ---------- */
function bandTable(P, k, draft) {
  const bands = draft.bands[k.key], u = unitOf(P, k);
  return `<div><h3 style="font-size:14px;margin:0 0 4px">${k.label}</h3>
    ${k.lowerIsBetter ? `<p class="hint" style="margin:0 0 6px;font-size:12px">Plus la valeur est basse, plus il y a de points.</p>` : ''}
    <table class="bands"><thead><tr><th>À partir de (${u})</th><th>Points</th></tr></thead><tbody>
    ${bands.map((b, i) => `<tr><td><input type="number" step="any" data-band="${k.key}" data-i="${i}" data-j="0" value="${b[0]}" ${i === 0 ? `readonly title="Le premier palier commence toujours à 0"` : ''}></td><td><input type="number" step="any" min="0" max="100" data-band="${k.key}" data-i="${i}" data-j="1" value="${b[1]}"></td></tr>`).join('')}
  </tbody></table></div>`;
}
function validateSettings(P, s) {
  const errs = [];
  const wsum = P.scored.reduce((a, k) => a + Number(s.weights[k.key]), 0);
  if (P.scored.some(k => !Number.isFinite(Number(s.weights[k.key])) || s.weights[k.key] < 0)) errs.push('Les poids doivent être des nombres positifs ou nuls.');
  if (Math.abs(wsum - 100) > 1e-6) errs.push(`La somme des poids est de ${nf(wsum, 0, 1)} %. Elle doit être exactement de 100 %.`);
  for (const k of P.scored.filter(k => k.scoring === 'target')) if (!(s.targets[k.key] > 0)) errs.push(`L'objectif ${k.label} doit être supérieur à 0.`);
  for (const k of P.scored.filter(k => k.scoring === 'bands')) {
    const b = s.bands[k.key];
    if (b.some(x => !Number.isFinite(x[0]) || !Number.isFinite(x[1]))) errs.push(`Paliers ${k.label} : chaque case doit contenir un nombre.`);
    else if (b.some((x, i) => i > 0 && x[0] <= b[i - 1][0])) errs.push(`Paliers ${k.label} : les seuils doivent augmenter de haut en bas.`);
    if (b.some(x => x[1] < 0 || x[1] > 100)) errs.push(`Paliers ${k.label} : les points doivent être compris entre 0 et 100.`);
  }
  const g = s.grades;
  if (!(g.S > g.A && g.A > g.B && g.B > g.C && g.C > 0 && g.S <= 100)) errs.push('Les seuils de grade doivent être décroissants : S > A > B > C > 0, avec S au maximum à 100.');
  const c = s.caps;
  if (c.enabled && !(c.criticalBelow >= 0 && c.warnBelow >= c.criticalBelow && c.warnBelow <= 100)) errs.push(`Le seuil critique du plafond doit être inférieur ou égal au seuil d'alerte.`);
  return errs;
}
function renderSettings(main, P) {
  if (!settingsDraft[P.id]) settingsDraft[P.id] = RCA.clone(allSettings[P.id]);
  const s = settingsDraft[P.id];
  const wsum = P.scored.reduce((a, k) => a + Number(s.weights[k.key] || 0), 0);
  const gradeOpts = v => ['S','A','B','C','D'].map(g => `<option ${v === g ? 'selected' : ''}>${g}</option>`).join('');
  const sumText = t => `Total : ${nf(t, 0, 1)} %${Math.abs(t - 100) > 1e-6 ? ' — doit être exactement 100 % pour enregistrer' : ''}`;
  const targets = P.scored.filter(k => k.scoring === 'target'), banded = P.scored.filter(k => k.scoring === 'bands');
  const capOptions = P.scored.filter(k => k.kind === 'pct');
  const capK = P.kpi[s.caps.kpi];
  main.innerHTML = topbar(P, 'Paramètres', false) + `<div class="stack">
    <div class="alert ok">Ces paramètres ne s'appliquent qu'à ${P.name}. ${P.id === 'of' ? 'Les réglages MYM se trouvent dans Paramètres MYM.' : 'Les réglages OnlyFans se trouvent dans Paramètres OnlyFans.'}</div>
    <section class="panel"><h2>Poids des KPI</h2><p class="hint">Le score final est la somme des scores de chaque KPI multipliés par leur poids.${P.kpis.some(k => k.scoring === 'info') ? ` ${P.kpis.filter(k => k.scoring === 'info').map(k => k.label).join(' et ')} sont affichés sans être notés.` : ''}</p>
      <div class="set-grid">${P.scored.map(k => `<label>${k.label} (%)<input type="number" step="any" min="0" max="100" data-path="weights.${k.key}" value="${s.weights[k.key]}"></label>`).join('')}</div>
      <div class="sumline ${Math.abs(wsum - 100) > 1e-6 ? 'bad' : 'good'}" id="wsum">${sumText(wsum)}</div>
    </section>
    <section class="panel"><h2>Objectifs</h2><p class="hint">Ces KPI sont notés proportionnellement : atteindre l'objectif donne 100 points, 90 % de l'objectif donne 90 points, etc.</p>
      <div class="set-grid">${targets.map(k => `<label>Objectif ${k.label} (${P.currency})<input type="number" step="any" min="0" data-path="targets.${k.key}" value="${s.targets[k.key]}"></label>`).join('')}</div>
    </section>
    <section class="panel"><h2>Paliers</h2><p class="hint">Une valeur obtient les points du palier le plus haut qu'elle atteint.</p>
      <div class="grid2">${banded.map(k => bandTable(P, k, s)).join('')}</div>
    </section>
    <section class="panel"><h2>Plafond de grade</h2><p class="hint">Si le KPI choisi est trop bas, le grade est plafonné, quel que soit le score. Le plafond s'applique après le calcul du grade.</p>
      <label class="check" style="margin-bottom:12px"><input type="checkbox" id="cap-on" ${s.caps.enabled ? 'checked' : ''}> Activer le plafond de grade</label>
      <div class="set-grid">
        <label>KPI surveillé<select data-path="caps.kpi">${capOptions.map(k => `<option value="${k.key}" ${s.caps.kpi === k.key ? 'selected' : ''}>${k.label}</option>`).join('')}</select></label>
        <label>Critique en dessous de (%)<input type="number" step="any" data-path="caps.criticalBelow" value="${s.caps.criticalBelow}"></label>
        <label>Grade plafond si critique<select data-path="caps.criticalCap">${gradeOpts(s.caps.criticalCap)}</select></label>
        <label>Alerte en dessous de (%)<input type="number" step="any" data-path="caps.warnBelow" value="${s.caps.warnBelow}"></label>
        <label>Grade plafond si alerte<select data-path="caps.warnCap">${gradeOpts(s.caps.warnCap)}</select></label>
      </div>
      ${capK ? '' : '<p class="hint">Aucun KPI en pourcentage disponible.</p>'}
    </section>
    <section class="panel"><h2>Seuils des grades</h2><p class="hint">Score final minimum pour chaque grade. En dessous de C, c'est D.</p>
      <div class="set-grid">${['S','A','B','C'].map(g => `<label>${g} à partir de<input type="number" step="any" min="0" max="100" data-path="grades.${g}" value="${s.grades[g]}"></label>`).join('')}</div>
    </section>
    <section class="panel"><h2>Alias de colonnes</h2><p class="hint">Noms d'en-têtes supplémentaires à reconnaître dans les exports ${P.name}, un par ligne. Ils sont vérifiés avant les noms intégrés.</p>
      <div class="grid3">${P.fields.map(f => `<label style="display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)"><strong style="color:var(--text)">${f.label}</strong>
        <textarea data-alias="${f.key}" placeholder="ex. : votre en-tête exact">${esc((s.aliases[f.key] || []).join('\n'))}</textarea>
        <span style="font-size:12px;color:var(--faint)">Intégrés : ${esc(f.aliases.join(', '))}</span></label>`).join('')}</div>
    </section>
    <section class="panel"><h2>Données</h2><p class="hint">Les périodes et les paramètres sont stockés uniquement dans ce navigateur.</p>
      <button class="btn danger" id="wipe" type="button">Supprimer toutes les périodes ${P.name}</button></section>
    <div class="savebar"><span class="msg" id="set-msg"></span>
      <button class="btn ghost" id="reset" type="button">Rétablir les paramètres par défaut</button>
      <button class="btn ghost" id="revert" type="button">Annuler les modifications</button>
      <button class="btn primary" id="save" type="button">Enregistrer et recalculer</button></div>
  </div>`;
  const setPath = (path, val) => { const [a, b] = path.split('.'); s[a][b] = val; };
  main.querySelectorAll('input[data-path]').forEach(el => el.addEventListener('input', () => {
    setPath(el.dataset.path, el.value === '' ? NaN : Number(el.value));
    if (el.dataset.path.startsWith('weights.')) {
      const t = P.scored.reduce((a, k) => a + (Number(s.weights[k.key]) || 0), 0), bad = Math.abs(t - 100) > 1e-6;
      const w = document.getElementById('wsum'); w.className = 'sumline ' + (bad ? 'bad' : 'good'); w.textContent = sumText(t);
    }
  }));
  main.querySelectorAll('select[data-path]').forEach(el => el.addEventListener('change', () => setPath(el.dataset.path, el.value)));
  document.getElementById('cap-on').addEventListener('change', e => { s.caps.enabled = e.target.checked; });
  main.querySelectorAll('[data-band]').forEach(el => el.addEventListener('input', () => { s.bands[el.dataset.band][Number(el.dataset.i)][Number(el.dataset.j)] = el.value === '' ? NaN : Number(el.value); }));
  main.querySelectorAll('[data-alias]').forEach(el => el.addEventListener('input', () => { s.aliases[el.dataset.alias] = el.value.split('\n').map(x => x.trim()).filter(Boolean); }));
  const count = () => plural(platformPeriods(P.id).length, `période ${P.name} recalculée`, `périodes ${P.name} recalculées`);
  document.getElementById('save').addEventListener('click', () => {
    const errs = validateSettings(P, s);
    const msg = document.getElementById('set-msg');
    if (errs.length) { msg.className = 'msg sc-lo'; msg.textContent = errs[0]; toast(errs.join(' '), true); return; }
    store.setSettings(P.id, RCA.clone(s)); saveSettings();
    settingsDraft[P.id] = null;
    toast(`Paramètres ${P.name} enregistrés. ${count()}.`);
    render();
  });
  document.getElementById('revert').addEventListener('click', () => { settingsDraft[P.id] = null; render(); });
  document.getElementById('reset').addEventListener('click', async () => {
    if (!(await modal(`Rétablir les paramètres ${P.name} par défaut`, `<p>Remettre tous les poids, objectifs, paliers et plafonds ${P.name} à leur valeur par défaut et supprimer les alias de colonnes personnalisés ? Les périodes ${P.name} seront recalculées. Les paramètres de l'autre plateforme ne changent pas.</p>`, 'Rétablir'))) return;
    store.setSettings(P.id, RCA.defaultSettings(P.id)); saveSettings(); settingsDraft[P.id] = null;
    toast(`Paramètres ${P.name} par défaut rétablis. ${count()}.`); render();
  });
  document.getElementById('wipe').addEventListener('click', async () => {
    const n = platformPeriods(P.id).length;
    if (!n) { toast(`Il n'y a aucune période ${P.name} à supprimer.`); return; }
    if (!(await modal(`Supprimer toutes les périodes ${P.name}`, `<p>Supprimer les ${plural(n, `période ${P.name} enregistrée`, `périodes ${P.name} enregistrées`)} de ce navigateur ? Les périodes de l'autre plateforme sont conservées. Cette action est définitive.</p>`, 'Tout supprimer'))) return;
    for (let i = store.periods.length - 1; i >= 0; i--) if (store.periods[i].platform === P.id) store.periods.splice(i, 1);
    store.invalidate(); savePeriods(); ui.period[P.id] = null; saveUI();
    toast(`Toutes les périodes ${P.name} ont été supprimées.`); render();
  });
}

/* ---------- Auto-test ---------- */
function selfTest() {
  const tests = RCA.runSelfTests(store.periods);
  const passed = tests.filter(t => t.pass).length;
  console.groupCollapsed(`%cChatter RCA Grading — auto-test : ${passed}/${tests.length} réussis`, `color:${passed === tests.length ? '#45D08F' : '#F0605E'};font-weight:bold`);
  tests.forEach((t, i) => console[t.pass ? 'log' : 'error'](`${t.pass ? '✓' : '✗'} ${i + 1}. ${t.name} — ${t.detail}`));
  console.groupEnd();
  const btn = document.getElementById('selftest-btn');
  btn.className = 'selftest ' + (passed === tests.length ? 'ok' : 'bad');
  document.getElementById('selftest-label').textContent = `Auto-test : ${passed}/${tests.length} réussis`;
  btn.onclick = () => modal(`Résultats de l'auto-test`, `<ul class="testlist">${tests.map((t, i) => `<li><span class="${t.pass ? 'p' : 'f'}">${t.pass ? 'Réussi' : 'Échec'}</span> ${i + 1}. ${esc(t.name)}<small>${esc(t.detail)}</small></li>`).join('')}</ul>`, null, 'Fermer');
}

if (!location.hash || !/^#(of|mym)\//.test(location.hash)) {
  const r = route(); history.replaceState(null, '', `#${r.pid}/${r.chatter != null ? 'chatter/' + encodeURIComponent(r.chatter) : r.page}`);
}
render();
selfTest();
})();
</script>

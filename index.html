/* ---------- Tableau de bord (mise en page du rapport PDF) ---------- */
function asvDashboard(P, r) {
  const rows = periodRows(P.id, r);
  if (!rows.length) return `<section class="nc"><h2>Aucune donnée sur cette période</h2><p class="muted">Choisissez une autre période ci-dessus : ${plural(entriesOf(P.id).length, 'entrée enregistrée', 'entrées enregistrées')} pour ${P.name}.</p></section>`;
  const best = rows.find(x => x.asv != null);
  const E = entriesOf(P.id), ms = ASVE.months(E);
  const withFans = rows.filter(x => x.fans != null), withRev = rows.filter(x => x.revenue != null);
  const tf = withFans.length === rows.length ? withFans.reduce((a, x) => a + x.fans, 0) : null;
  const tr = withRev.length === rows.length ? withRev.reduce((a, x) => a + x.revenue, 0) : null;
  const weighted = tf > 0 && rows.every(x => x.fans != null && x.asv != null) ? rows.reduce((a, x) => a + x.asv * x.fans, 0) / tf : null;
  const avg = rows.filter(x => x.asv != null).reduce((a, x, _, arr) => a + x.asv / arr.length, 0);
  const bestSub = best ? [best.revenue != null ? `${fa(P.id, best.revenue, 0)} de CA net` : null, best.fans != null ? `${fint(best.fans)} nouveaux fans` : null].filter(Boolean).join(' · ') : '';
  const sF = rows.some(x => x.fans != null), sR = rows.some(x => x.revenue != null);
  const table = `<div class="tbl-wrap" style="max-height:none"><table><thead><tr><th class="num">#</th><th>Modèle</th>${sF ? '<th class="num">Nouveaux fans</th>' : ''}${sR ? '<th class="num">CA net</th>' : ''}<th class="num">ASV</th><th>Objectif</th><th>Évolution</th></tr></thead><tbody>
    ${rows.map((x, i) => `<tr><td class="num ${i === 0 ? 'gold' : ''}">${String(i + 1).padStart(2, '0')}</td><td><strong class="${i === 0 ? 'gold' : ''}">${esc(x.m.name)} ${PCODE[P.id]}</strong></td>${sF ? `<td class="num">${fint(x.fans)}</td>` : ''}${sR ? `<td class="num">${x.revenue == null ? '<span class="muted">—</span>' : fa(P.id, x.revenue)}</td>` : ''}<td class="num"><strong>${x.asv == null ? '<span class="muted">0 abonné</span>' : fa(P.id, x.asv)}</strong>${x.approx ? ' <span class="muted" title="Moyenne simple de plusieurs périodes sans abonnés">≈</span>' : ''}</td><td>${goalPill(P.id, ASVE.targetFor(x.asv, asvState.settings[P.id].paliers))}</td><td>${deltaBadge(x.delta)}</td></tr>`).join('')}
  </tbody></table></div>`;
  const cross = ms.length ? `<div class="tbl-wrap" style="max-height:none"><table><thead><tr><th>Modèle</th>${ms.map(ym => `<th class="num">${esc(monthHead(E, ym))}</th>`).join('')}</tr></thead><tbody>
    ${(() => {
      const grid = modelsOf(P.id).map(m => ({m, v: ms.map(ym => { const mr = ASVE.monthRange(ym); const a = ASVE.aggregate(E, m.id, mr.start, mr.end); return a ? a.asv : null; })}));
      const bestCol = ms.map((_, j) => Math.max(...grid.map(g => g.v[j] ?? -Infinity)));
      return grid.filter(g => g.v.some(v => v != null)).map(g => `<tr><td><strong>${esc(g.m.name)} ${PCODE[P.id]}</strong></td>${g.v.map((v, j) => `<td class="num ${v != null && v === bestCol[j] ? 'bestcol' : ''}">${v == null ? '<span class="muted">—</span>' : fa(P.id, v)}</td>`).join('')}</tr>`).join('');
    })()}
  </tbody></table></div>` : `<p class="muted">Aucune donnée mensuelle : la vue mensuelle ne compte que les périodes comprises dans un seul mois.</p>`;
  const n = rows.filter(x => x.asv != null).length;
  return `
    <section class="nc nbest"><div><div class="nlabel">MEILLEUR ASV DE LA PÉRIODE</div><div class="nbest-name">${best ? `${esc(best.m.name)} ${PCODE[P.id]}` : '—'}</div>
      ${bestSub ? `<div class="muted" style="margin-top:4px">${bestSub}</div>` : ''}</div>
      <div class="nbest-val"><div class="v">${best ? fa(P.id, best.asv) : '—'}</div><div class="muted" style="font-size:12px;text-align:right">ASV</div></div></section>
    <section class="nc"><div class="ncard-head"><h2>Classement — ASV par modèle</h2>
      <label class="check"><input type="checkbox" id="asv-cmp" ${asvUI.compare[P.id] ? 'checked' : ''}> Comparer à la période précédente</label></div>
      <div class="chart-box" id="asv-bars-box" style="height:${Math.max(200, n * (asvUI.compare[P.id] ? 40 : 24) + 30)}px;max-width:760px;margin:0 auto"><canvas id="asv-bars"></canvas></div></section>
    <section class="nc"><div class="ncard-head"><h2>Évolution mensuelle ${asvUI.allLines[P.id] ? '(tous les modèles)' : '(top 3)'}</h2>
      <label class="check"><input type="checkbox" id="asv-all" ${asvUI.allLines[P.id] ? 'checked' : ''}> Afficher tous les modèles</label></div>
      <div class="chart-box tall" id="asv-lines-box"><canvas id="asv-lines"></canvas></div></section>
    <section class="nstats">
      <div class="nc"><div class="k">${weighted != null ? `ASV de l'équipe` : 'ASV moyen'}</div><div class="v">${fa(P.id, weighted ?? avg)}</div><div class="muted" style="font-size:12px;margin-top:4px">${weighted != null ? 'pondéré par les nouveaux fans' : 'moyenne des modèles'}</div></div>
      ${tf != null ? `<div class="nc"><div class="k">Nouveaux fans</div><div class="v">${fint(tf)}</div></div>` : ''}
      ${tr != null ? `<div class="nc"><div class="k">CA net</div><div class="v">${fa(P.id, tr, 0)}</div></div>` : ''}
      <div class="nc"><div class="k">Modèles classées</div><div class="v">${n}<span class="muted" style="font-size:14px"> / ${modelsOf(P.id).length}</span></div></div>
    </section>
    <section class="nc"><h2>Détail du classement</h2>${table}</section>
    <section class="nc"><div class="ncard-head"><h2>Vue mensuelle croisée</h2><span class="muted" style="font-size:12.5px">Meilleure valeur du mois en or · « partiel » = mois incomplet</span>
      <button class="btn" id="asv-cross-csv" type="button" style="margin-left:auto">${icon('download')}Exporter en CSV</button></div>${cross}</section>`;
}

/* ---------- Objectifs ---------- */
function asvObjectifs(P, r) {
  const set = asvState.settings[P.id];
  const rows = periodRows(P.id, r).filter(x => x.asv != null);
  if (!rows.length) return `<section class="nc"><h2>Aucune donnée sur cette période</h2><p class="muted">Choisissez une autre période ci-dessus.</p></section>`;
  const pal = [...set.paliers].sort((a, b) => a - b);
  return `<section class="nc"><h2>Objectifs ASV ${P.name}</h2><p class="muted" style="margin-top:0">Paliers : sous ${fa(P.id, pal[0], 0)} → ${fa(P.id, pal[0], 0)}${pal.slice(1).map((p, i) => ` · de ${fa(P.id, pal[i], 0)} à ${fa(P.id, p, 0)} → ${fa(P.id, p, 0)}`).join('')} · à partir de ${fa(P.id, pal[pal.length - 1], 0)} → STABLE (maintenir).</p>
    <div class="tbl-wrap" style="max-height:none"><table><thead><tr><th>Modèle</th><th class="num">ASV actuel</th><th>Objectif</th><th class="num">Écart</th><th>Évolution</th></tr></thead><tbody>
    ${rows.map(x => { const t = ASVE.targetFor(x.asv, set.paliers); return `<tr><td><strong>${esc(x.m.name)}</strong></td><td class="num"><strong>${fa(P.id, x.asv)}</strong></td><td>${goalPill(P.id, t)}</td><td class="num">${t ? `<span class="gap-orange">+${fa(P.id, t - x.asv)}</span>` : '<span class="muted">—</span>'}</td><td>${deltaBadge(x.delta)}</td></tr>`; }).join('')}
    </tbody></table></div></section>`;
}

/* ---------- À prioriser (plateformes mélangées) ---------- */
function asvPriorites(P, r) {
  const all = PIDS.flatMap(pid => periodRows(pid, r).filter(x => x.asv != null).map(x => ({...x, t: ASVE.targetFor(x.asv, asvState.settings[pid].paliers)})));
  const prio = all.filter(x => x.t != null).map(x => ({...x, gap: x.t - x.asv})).sort((a, b) => b.gap - a.gap);
  const stable = all.filter(x => x.t === null);
  if (!all.length) return `<section class="nc"><h2>Aucune donnée sur cette période</h2><p class="muted">Aucune plateforme n'a de chiffres pour ${esc(fmtRange(r.start, r.end))}.</p></section>`;
  const drop = x => x.delta && x.delta.dir === 'down' && Math.abs(x.delta.pct) >= asvState.settings[x.pid].dropAlert;
  return `<section class="nc"><h2>Modèles à prioriser</h2><p class="muted" style="margin-top:0">OnlyFans et MYM mélangés, triés par écart à l'objectif (le plus loin en premier). « En baisse » signale une chute d'ASV supérieure au seuil des Réglages. Les écarts sont exprimés dans la devise de chaque plateforme.</p>
    ${prio.length ? `<div class="tbl-wrap" style="max-height:none"><table><thead><tr><th class="num">Rang</th><th>Modèle</th><th class="num">ASV actuel</th><th>Objectif</th><th class="num">Écart</th><th>Évolution</th><th>Alerte</th></tr></thead><tbody>
    ${prio.map((x, i) => `<tr><td class="num"><strong class="${i < 3 ? 'gap-red' : ''}">${i + 1}</strong></td><td>${pbadge(PLATFORMS[x.pid])} <strong style="margin-left:6px">${esc(x.m.name)}</strong></td><td class="num">${fa(x.pid, x.asv)}</td><td>${goalPill(x.pid, x.t)}</td><td class="num"><span class="${i < 3 ? 'gap-red' : 'gap-orange'}">−${fa(x.pid, x.gap)}</span></td><td>${deltaBadge(x.delta)}</td><td>${drop(x) ? '<span class="dlt down">En baisse</span>' : ''}</td></tr>`).join('')}
    </tbody></table></div>` : '<p>Toutes les modèles sont au palier « STABLE » sur cette période.</p>'}
    ${stable.length ? `<p class="muted" style="margin-bottom:0">Au palier STABLE : ${stable.map(x => `${esc(x.m.name)} (${PLATFORMS[x.pid].short}, ${fa(x.pid, x.asv)})`).join(', ')}.</p>` : ''}</section>`;
}

/* ---------- Saisie & import ---------- */
/* ---------- Import ASV en 3 étapes : période → données → vérification ---------- */
function nextPeriod(pid) {
  const E = entriesOf(pid);
  const d = new Date(), ymNow = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  if (!E.length) return {p:{type:'month', a:ymNow, b:''}, note:'Par défaut : le mois en cours. Changez-la si besoin.'};
  const last = [...E].sort((x, y) => y.end.localeCompare(x.end) || x.start.localeCompare(y.start))[0];
  const ym = last.start.slice(0, 7), full = ASVE.monthRange(ym);
  const [y, m] = ym.split('-').map(Number), nextYm = m === 12 ? `${y + 1}-01` : `${y}-${String(m + 1).padStart(2, '0')}`;
  const note = `Suggestion : la période qui suit votre dernier import (${fmtRange(last.start, last.end)}). Changez-la si besoin.`;
  if (last.start === full.start && last.end === full.end) return {p:{type:'month', a:nextYm, b:''}, note};
  if (last.start === `${ym}-01` && last.end === `${ym}-15`) return {p:{type:'half', a:ym, b:'2'}, note};
  if (last.start === `${ym}-16` && last.end === full.end) return {p:{type:'half', a:nextYm, b:'1'}, note};
  const len = Math.round((new Date(last.end) - new Date(last.start)) / 86400000) + 1;
  return {p:{type:'custom', a:ASVE.addDays(last.end, 1), b:ASVE.addDays(last.end, len)}, note};
}
function impState(P) {
  asvUI.imp ||= {};
  if (!asvUI.imp[P.id]) { const s = nextPeriod(P.id); asvUI.imp[P.id] = {p:s.p, note:s.note, text:'', source:'', res:null, rows:[], remember:true}; }
  return asvUI.imp[P.id];
}
function impRange(st) { const r = ASVE.rangeFor(st.p.type, st.p.a, st.p.b); return r.start && r.end && r.end >= r.start ? r : null; }
function periodFromData(start, end) {
  const ym = start.slice(0, 7), full = ASVE.monthRange(ym);
  if (start === full.start && end === full.end) return {type:'month', a:ym, b:''};
  if (start === `${ym}-01` && end === `${ym}-15`) return {type:'half', a:ym, b:'1'};
  if (start === `${ym}-16` && end === full.end) return {type:'half', a:ym, b:'2'};
  return {type:'custom', a:start, b:end};
}
// Applique un résultat de lecture à l'état de l'import. Renvoie true si la période a été modifiée (dates trouvées dans les données).
function setImportResult(P, res, source) {
  const st = impState(P);
  const wasMulti = !!st.multi;
  st.source = source; st.res = res; st.rows = []; st.multi = null;

const PLAN_SEED = {"week":"2026-09-28","models":[{"id":"mym-naya","name":"Naya","group":"mym"},{"id":"mym-thais","name":"Thais","group":"mym"},{"id":"mym-carla","name":"Carla","group":"mym"},{"id":"mym-ava-paid-subs","name":"Ava Paid Subs","group":"mym"},{"id":"mym-marie","name":"Marie","group":"mym"},{"id":"mym-flavie","name":"Flavie","group":"mym"},{"id":"mym-chloe","name":"Chloe","group":"mym"},{"id":"mym-eden","name":"Eden","group":"mym"},{"id":"mym-carla-baby","name":"Carla Baby","group":"mym"},{"id":"other-ava-reveal","name":"Ava Reveal","group":"other"},{"id":"mym-angel","name":"Angel","group":"mym"},{"id":"mym-charlotte","name":"Charlotte","group":"mym"},{"id":"mym-tia","name":"Tia","group":"mym"},{"id":"mym-steffy","name":"Steffy","group":"mym"},{"id":"mym-victoria","name":"Victoria","group":"mym"},{"id":"mym-anaelle","name":"Anaelle","group":"mym"},{"id":"other-lila-telegram","name":"Lila Telegram","group":"other"},{"id":"of-naya","name":"Naya","group":"of"},{"id":"of-angel","name":"Angel","group":"of"},{"id":"of-carla-baby","name":"Carla Baby","group":"of"},{"id":"of-steffy","name":"Steffy","group":"of"},{"id":"of-ava","name":"Ava","group":"of"},{"id":"of-mae","name":"Mae","group":"of"},{"id":"of-thais","name":"Thaïs","group":"of"},{"id":"of-flavie","name":"Flavie","group":"of"},{"id":"of-carla-trans","name":"Carla Trans","group":"of"},{"id":"of-marie","name":"Marie","group":"of"},{"id":"of-eden","name":"Eden","group":"of"},{"id":"of-lila","name":"Lila","group":"of"}]};
const PLAN_GROUPS = [
  {id:'mym', label:'MYM', color:'#22c55e', ink:'#062b14'},
  {id:'other', label:'Reveal / Telegram', color:'#a855f7', ink:'#ffffff'},
  {id:'of', label:'OnlyFans', color:'#eab308', ink:'#2a1d02'}

const PLAN_SHIFTS = ['04 - 10', '10 - 16', '16 - 22', '22 - 04'];

const PLAN_DAYS_LONG = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
const NEW_SHIFTS = 5;   // un nouveau chatter est mis en couleur sur ses 5 premiers shifts travaillés
const LS_PLAN = 'rca.plan.v1', LS_PLANCFG = 'rca.plancfg.v1';
const DEFAULT_PLANCFG = {models: PLAN_SEED.models.map((m, i) => ({...m, order: i}))};
let planState = (() => { const s = lsGet(LS_PLAN, null) || {}; s.weeks ||= {}; s.chatters ||= {}; return s; })();
let planCfgSaved = lsGet(LS_PLANCFG, null);
const planCfg = () => planCfgSaved && Array.isArray(planCfgSaved.models) && planCfgSaved.models.length ? planCfgSaved : DEFAULT_PLANCFG;
const savePlan = () => { lsSet(LS_PLAN, planState); Sync.changed('planning'); };
const savePlanCfg = () => { lsSet(LS_PLANCFG, planCfgSaved); Sync.changed('plancfg'); };
const planUI = {week:null, day:null, q:'', tab:'week'};
/* ---------- Jours OFF (un ou plusieurs jours fixes par chatter) ---------- */
const DAY_WORDS = {lundi:0, lun:0, mardi:1, mar:1, mercredi:2, mer:2, jeudi:3, jeu:3, vendredi:4, ven:4, samedi:5, sam:5, dimanche:6, dim:6};
const offKey = n => normName(n).replace(/\s+(mym|of)$/, '');
const dayOff = () => (planState.dayoff ||= {});
// Équipe suivie = liste des Jours OFF + chatters planifiés sur les 3 dernières semaines (sauf « ne plus suivre »)
const rosterKey = n => offKey(String(n || '').replace(/\(.*?\)/g, ' ').trim()).replace(/[^a-z]/g, '');
// Deux prénoms à une lettre près (« Juliannot » / « Julianot ») sont considérés comme la même personne
function nearKey(a, b) {
  if (a === b) return true;
  if (Math.abs(a.length - b.length) > 1 || Math.min(a.length, b.length) < 5) return false;
  let i = 0, j = 0, diff = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { i++; j++; continue; }
    if (++diff > 1) return false;
    if (a.length > b.length) i++; else if (b.length > a.length) j++; else { i++; j++; }
  }
  return diff + (a.length - i) + (b.length - j) <= 1;
}
const hasNear = (keys, k) => { for (const x of keys) if (nearKey(x, k)) return true; return false; };
function teamRoster(wk) {
  const ign = planState.ignored || {}, roster = new Map();
  const ignKeys = Object.keys(ign);
  const add = n => { const t = String(n || '').trim(); const k = rosterKey(t); if (t && k && !hasNear(ignKeys, k) && !hasNear(roster.keys(), k)) roster.set(k, t.replace(/\s+(mym|of)$/i, '').trim() || t); };
  for (const o of Object.values(planState.dayoff || {})) add(o.name);
  for (const w of [wk, addDaysIso(wk, -7), addDaysIso(wk, -14)]) { const W = planState.weeks[w]; if (!W) continue; for (const list of Object.values(W.cells || {})) for (const e of list) [e.n, ...(e.r ? e.r.split('/') : [])].forEach(add); }
  return roster;
}
function unplannedOn(wk, d) {
  const W = planState.weeks[wk]; if (!W) return [];
  const planned = new Set();
  for (const [k, list] of Object.entries(W.cells || {})) { if (k.split('|')[0] !== String(d)) continue; for (const e of list) [e.n, ...(e.r ? e.r.split('/') : [])].forEach(n => { if (n) planned.add(rosterKey(n)); }); }
  const offDay = new Set(Object.values(planState.dayoff || {}).filter(o => (o.days || []).includes(+d)).map(o => rosterKey(o.name)));
  for (const r of absReqsOnDate(addDaysIso(wk, +d))) if ((r.shifts || []).length === PLAN_SHIFTS.length) offDay.add(rosterKey(r.name));   // absent toute la journée
  return [...teamRoster(wk)].filter(([k]) => !hasNear(planned, k) && !hasNear(offDay, k)).map(([k, n]) => ({k, n})).sort((a, b) => a.n.localeCompare(b.n, 'fr'));
}
function offOn(name, d) { if (!planState.dayoff) return false; return String(name).split('/').some(x => { const o = planState.dayoff[offKey(x.trim())]; return o && (o.days || []).includes(+d); }); }
function parseDays(txt) {
  const t = normName(txt);
  if (!t || /pas de off|aucun|^non$|^-$/.test(t)) return [];
  return [...new Set(t.split(/[^a-z]+/).map(w => DAY_WORDS[w]).filter(x => x != null))].sort();
}
// Liste collée depuis Excel : « Chatter | Jour OFF | Note » (tabulations, points-virgules ou espaces)
function parseOffList(text) {
  const out = [], skipped = [];
  for (const raw of String(text).replace(/\r/g, '').split('\n')) {
    const line = raw.trim(); if (!line) continue;
    let cols = line.includes('\t') ? raw.split('\t') : line.includes(';') ? line.split(';') : null;
    if (!cols) { const m = line.match(/^(.+?)\s+((?:pas de off)|(?:(?:lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)\b[\s,\/et]*)+)(.*)$/i); cols = m ? [m[1], m[2], m[3]] : [line]; }
    cols = cols.map(c => c.trim());
    const name = cols[0]; if (!name) continue;
    if (/^(name|nom|chatter|chatteur)s?$/i.test(name)) continue;   // ligne d'en-têtes
    const daysTxt = cols[1] || '', note = (cols[2] || '').trim();
    out.push({name, days: parseDays(daysTxt), none: /pas de off/i.test(daysTxt), unknown: !!daysTxt.trim() && !parseDays(daysTxt).length && !/pas de off/i.test(daysTxt), note});
  }
  return out;
}
const normName = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const cellKey = (d, s, mid) => `${d}|${s}|${mid}`;

const sortModels = list => list.sort((a, b) => groupIdx(a.group) - groupIdx(b.group) || (a.order ?? 0) - (b.order ?? 0) || a.name.localeCompare(b.name, 'fr'));

}
const allModels = () => sortModels(Object.entries(planModelsMap()).map(([id, m]) => ({id, ...m})));

const workerOf = e => e.r ? e.r : (e.a ? null : e.n);

/* ---------- Nouveaux chatters : 5 premiers shifts travaillés, dans l'ordre chronologique ---------- */
function newHighlights() {
  const flagged = new Map(Object.entries(planState.chatters || {}).filter(([, c]) => c && c.isNew).map(([k, c]) => [k, c]));
  const out = new Map();
  if (!flagged.size) return out;
  const counts = {};
  const models = activeModels();
  for (const wk of Object.keys(planState.weeks).sort()) {
    const W = planState.weeks[wk];
    for (let d = 0; d < 7; d++) {
      const date = addDaysIso(wk, d);
      for (let s = 0; s < PLAN_SHIFTS.length; s++) {
        const seen = new Set();
        for (const m of models) for (const e of (W.cells[cellKey(d, s, m.id)] || [])) {
          const w = workerOf(e); if (!w) continue;
          for (const one of w.split('/').map(x => x.trim()).filter(Boolean)) {
            const k = normName(one), c = flagged.get(k);
            if (!c || seen.has(k) || (c.since && date < c.since)) continue;
            seen.add(k); counts[k] = (counts[k] || 0) + 1;
            if (counts[k] <= NEW_SHIFTS) out.set(`${wk}|${d}|${s}|${k}`, counts[k]);

  }

}
const isFlaggedNew = name => !!(planState.chatters[normName(name)] || {}).isNew;

  for (const p of store.periods) for (const r of p.rows) if (!set.has(normName(r.name))) set.set(normName(r.name), r.name);

/* ---------- Bilan des absences et retards ---------- */
// Une absence = prénom en rouge ou remplacé ; un retard = orange ; une coupure = violet. Comptés une fois par shift.
function planIncidents(wk) {
  const W = planState.weeks[wk]; const by = new Map();
  if (!W) return by;
  const seen = new Set();
  for (const [k, list] of Object.entries(W.cells || {})) {
    const [d, s, mid] = k.split('|'); const m = allModels().find(x => x.id === mid);
    for (const e of list) {
      let kind = e.a || e.r ? 'abs' : e.l ? 'late' : e.c ? 'cut' : null; if (!kind) continue;
      if (kind === 'abs' && absReqFor(e.n, addDaysIso(wk, +d), +s)) kind = 'absj';   // absence prévenue (demande non refusée)
      const nk = normName(e.n), sk = `${nk}|${d}|${s}|${kind}`; if (seen.has(sk)) continue; seen.add(sk);
      const r = by.get(nk) || {name: e.n, abs: 0, absj: 0, late: 0, cut: 0, details: []};
      r[kind]++; r.details.push({kind, d: +d, s: +s, model: m ? modelLabel(m) : '', rep: e.r || ''});
      by.set(nk, r);
    }
  }
  return by;
}
// Score de fiabilité : absence non prévenue = 3 points, retard = 1, absence prévenue = 0
const relScore = r => r.abs * 3 + r.late;
function planBilanHTML(wk) {
  if (!planState.weeks[wk]) return `<div class="panel empty">La ${esc(planWeekLabel(wk))} n'existe pas encore dans le planning.</div>`;
  const cur = planIncidents(wk);
  const prev = [1, 2, 3].map(i => planIncidents(addDaysIso(wk, -7 * i)));
  const rows = [...cur.entries()].map(([k, r]) => {
    const tot = {abs: r.abs, absj: r.absj, late: r.late};
    for (const p of prev) { const x = p.get(k); if (x) { tot.abs += x.abs; tot.absj += x.absj; tot.late += x.late; } }
    return {...r, k, tot, score: relScore(r), tscore: relScore(tot)};
  }).sort((a, b) => b.score - a.score || b.tscore - a.tscore || b.absj - a.absj || a.name.localeCompare(b.name, 'fr'));
  const max = Math.max(1, ...rows.map(r => r.score));
  const T = rows.reduce((a, r) => ({abs: a.abs + r.abs, absj: a.absj + r.absj, late: a.late + r.late, cut: a.cut + r.cut}), {abs: 0, absj: 0, late: 0, cut: 0});
  const seen = new Set(rows.map(r => rosterKey(r.name)));
  const clean = [...teamRoster(wk)].filter(([k]) => !hasNear(seen, k)).map(([, n]) => n).sort((a, b) => a.localeCompare(b, 'fr'));
  const tag = r => r.score >= 6 ? '<span class="rtag hot">À surveiller de près</span>' : r.score >= 3 ? '<span class="rtag warm">À surveiller</span>' : r.score > 0 ? '<span class="rtag">Léger</span>' : '<span class="rtag ok">Prévenu</span>';
  return `<div class="stack"><section class="stats sui-stats">
      <div class="stat"><div class="k">Absences non prévenues</div><div class="v" style="color:#f87171">${T.abs}</div><div class="d">3 points chacune</div></div>
      <div class="stat"><div class="k">Retards</div><div class="v" style="color:#fb923c">${T.late}</div><div class="d">1 point chacun</div></div>
      <div class="stat"><div class="k">Absences prévenues</div><div class="v" style="color:#93c5fd">${T.absj}</div><div class="d">avec demande d'absence · 0 point</div></div>
      <div class="stat"><div class="k">Coupures de courant</div><div class="v" style="color:#c084fc">${T.cut}</div><div class="d">non comptées</div></div></section>
    <section class="panel"><h2>Classement de fiabilité · du pire au meilleur</h2><p class="hint">Absence non prévenue = 3 points, retard = 1 point, absence prévenue (demande d'absence) = 0. La colonne « 4 semaines » cumule la semaine affichée et les 3 précédentes pour repérer les habitués. « Pénaliser » ouvre une pénalité préremplie.</p>
      ${rows.length ? `<div class="tbl-wrap" style="max-height:none"><table class="sui-table rank-table"><thead><tr><th class="num">#</th><th>Chatteur</th><th style="min-width:160px">Score de la semaine</th><th class="num">Abs. non prévenues</th><th class="num">Retards</th><th class="num">Abs. prévenues</th><th class="num">4 semaines</th><th>Détail</th><th></th></tr></thead><tbody>

function editCell(wk, key) {
  const [d, s, mid] = key.split('|'); const m = allModels().find(x => x.id === mid);
  const W = weekOf(wk);
  let list = (W.cells[key] || []).map(e => ({...e}));

  const draw = () => {
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" style="max-width:640px"><h3>${esc(m ? modelLabel(m) : mid)} · ${PLAN_DAYS_LONG[d]} ${parseDate(addDaysIso(wk, +d)).toLocaleDateString('fr-FR', {day:'numeric', month:'long'})} · ${PLAN_SHIFTS[s]}</h3>
      <datalist id="pl-names">${names.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
      ${list.length ? `<div class="pe-list">${list.map((e, i) => `<div class="pe-row">
        <strong class="${e.a && !e.r ? 'sc-lo' : ''}">${esc(e.n)}${absReqFor(e.n, addDaysIso(wk, +d), +s) ? ` <b class="abstag" title="${esc(absReqFor(e.n, addDaysIso(wk, +d), +s).note || 'Demande d’absence')}">ABS demandée</b>` : ''}</strong>
        <label class="check"><input type="checkbox" data-abs="${i}" ${e.a ? 'checked' : ''}> Absent</label>
        <label class="check" title="Coupure de courant"><input type="checkbox" data-cut="${i}" ${e.c ? 'checked' : ''}> Coupure</label>
        <label class="check" title="Arrivé(e) en retard"><input type="checkbox" data-late="${i}" ${e.l ? 'checked' : ''}> Retard</label>
        <input type="text" list="pl-names" data-rep="${i}" value="${esc(e.r || '')}" placeholder="Remplaçant (facultatif)">
        <label class="check" title="Mis en couleur sur ses ${NEW_SHIFTS} premiers shifts travaillés"><input type="checkbox" data-new="${i}" ${isFlaggedNew(e.n) ? 'checked' : ''}> Nouveau</label>
        <button class="btn ghost" type="button" data-del="${i}" aria-label="Retirer ${esc(e.n)}">×</button></div>`).join('')}</div>` : '<p class="hint">Personne sur ce shift.</p>'}
      ${(() => { const rq = absReqsOnDate(addDaysIso(wk, +d)).filter(r => (r.shifts || []).includes(+s)); return rq.length ? `<div class="absbox" style="margin-top:12px"><div class="absbox-h">Demandes d’absence sur ce shift</div><div style="font-size:13px">${rq.map(r => `<strong>${esc(r.name)}</strong>${r.status === 'wait' ? ' (en attente)' : ''}${r.note ? ` — ${esc(r.note)}` : ''}`).join(' · ')}</div></div>` : ''; })()}
      <div style="display:flex;gap:8px;margin-top:12px"><input type="text" id="pe-add" list="pl-names" placeholder="Ajouter un ou plusieurs chatters (séparés par /)" style="flex:1"><button class="btn" id="pe-addb" type="button">Ajouter</button></div>
      <div class="acts"><button class="btn ghost" data-a="0" type="button">Annuler</button><button class="btn primary" data-a="1" type="button">Enregistrer</button></div></div>`;
    bg.querySelector('#pe-add').focus();
  };
  const sync = () => {
    bg.querySelectorAll('[data-abs]').forEach(c => { list[+c.dataset.abs].a = c.checked ? 1 : 0; });
    bg.querySelectorAll('[data-cut]').forEach(c => { list[+c.dataset.cut].c = c.checked ? 1 : 0; });
    bg.querySelectorAll('[data-late]').forEach(c => { list[+c.dataset.late].l = c.checked ? 1 : 0; });
    bg.querySelectorAll('[data-rep]').forEach(c => { const v = c.value.trim(); list[+c.dataset.rep].r = v || undefined; });
  };
  const add = () => { sync(); const v = bg.querySelector('#pe-add').value; for (const n of v.split('/').map(x => x.trim()).filter(Boolean)) if (!list.some(e => normName(e.n) === normName(n))) list.push({n}); draw(); };
  const newFlags = {};
  draw();
  bg.addEventListener('keydown', e => { if (e.key === 'Escape') bg.remove(); if (e.key === 'Enter' && e.target.id === 'pe-add') { e.preventDefault(); add(); } });
  bg.addEventListener('change', e => { const t = e.target; if (t.dataset.new != null) newFlags[normName(list[+t.dataset.new].n)] = {name: list[+t.dataset.new].n, on: t.checked}; });
  bg.addEventListener('click', e => {
    if (e.target === bg) { bg.remove(); return; }
    if (e.target.id === 'pe-addb') { add(); return; }
    const del = e.target.closest('[data-del]'); if (del) { sync(); list.splice(+del.dataset.del, 1); draw(); return; }
    const a = e.target.closest('[data-a]'); if (!a) return;
    if (a.dataset.a === '1') {
      sync(); if (bg.querySelector('#pe-add').value.trim()) add();
      const clean = list.map(e => { const o = {n: e.n}; if (e.a) o.a = 1; if (e.c) o.c = 1; if (e.l) o.l = 1; if (e.r) o.r = e.r; return o; });
      if (clean.length) W.cells[key] = clean; else delete W.cells[key];
      for (const [k, f] of Object.entries(newFlags)) { if (f.on) planState.chatters[k] = {...(planState.chatters[k] || {}), name: f.name, isNew: true}; else if (planState.chatters[k]) planState.chatters[k].isNew = false; }
      savePlan(); render();
    }
    bg.remove();
  });
  document.body.appendChild(bg);
}

/* ---------- Indisponibilité : retirer ou marquer absent un chatter sur plusieurs jours d'un coup ---------- */
function unavailability(wk) {
  const W = weekOf(wk), models = activeModels(), names = knownChatters();
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  const st = {name:'', days:new Set(), mode:'abs'};
  const slots = () => { const k = normName(st.name); if (!k) return []; const out = [];
    for (const d of st.days) for (let s = 0; s < PLAN_SHIFTS.length; s++) for (const m of models) (W.cells[cellKey(d, s, m.id)] || []).forEach((e, i) => { if (normName(e.n) === k) out.push({d, s, m, i}); });
    return out; };
  const draw = () => {
    const sl = slots();
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" style="max-width:600px"><h3>Indisponibilité · ${esc(planWeekLabel(wk))}</h3>
      <datalist id="pl-names2">${names.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
      <label style="display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)">Chatter<input type="text" id="un-name" list="pl-names2" value="${esc(st.name)}" placeholder="Prénom"></label>
      <div style="margin:12px 0 6px;font-size:13px;color:var(--muted)">Jours concernés</div>
      <div class="un-days">${PLAN_DAYS.map((x, i) => `<label class="check"><input type="checkbox" data-ud="${i}" ${st.days.has(i) ? 'checked' : ''}> ${x} ${parseDate(addDaysIso(wk, i)).getDate()}</label>`).join('')}</div>
      <div class="un-days" style="margin-top:12px"><label class="check"><input type="radio" name="un-mode" value="abs" ${st.mode === 'abs' ? 'checked' : ''}> Marquer absent (prénom en rouge, on peut ajouter un remplaçant)</label>
        <label class="check"><input type="radio" name="un-mode" value="del" ${st.mode === 'del' ? 'checked' : ''}> Retirer du planning</label></div>
      <p class="hint" id="un-prev" style="margin:12px 0 0"></p>
      <div class="acts"><button class="btn ghost" data-a="0" type="button">Annuler</button><button class="btn primary" data-a="1" type="button" id="un-go" disabled>Appliquer</button></div></div>`;
  };
  const preview = () => {
    const sl = slots();
    bg.querySelector('#un-prev').innerHTML = st.name && st.days.size ? (sl.length ? `${plural(sl.length, 'créneau trouvé', 'créneaux trouvés')} : ${sl.slice(0, 8).map(x => `${PLAN_DAYS[x.d]} ${PLAN_SHIFTS[x.s]} ${esc(modelLabel(x.m))}`).join(' · ')}${sl.length > 8 ? '…' : ''}` : 'Aucun créneau trouvé pour ce chatter sur ces jours.') : 'Choisissez un chatter et des jours.';
    bg.querySelector('#un-go').disabled = !sl.length;
  };
  draw(); preview();
  bg.addEventListener('input', e => { if (e.target.id === 'un-name') { st.name = e.target.value; preview(); } });
  bg.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.ud != null) t.checked ? st.days.add(+t.dataset.ud) : st.days.delete(+t.dataset.ud);
    if (t.name === 'un-mode') st.mode = t.value;
    preview();
  });
  bg.addEventListener('keydown', e => { if (e.key === 'Escape') bg.remove(); });
  bg.addEventListener('click', e => {
    if (e.target === bg) { bg.remove(); return; }
    const a = e.target.closest('[data-a]'); if (!a) return;
    if (a.dataset.a === '1') {
      const sl = slots();
      const byKey = {};
      for (const x of sl) (byKey[cellKey(x.d, x.s, x.m.id)] ||= []).push(x.i);
      for (const [k, idx] of Object.entries(byKey)) {
        if (st.mode === 'abs') idx.forEach(i => { W.cells[k][i].a = 1; });
        else { W.cells[k] = W.cells[k].filter((_, i) => !idx.includes(i)); if (!W.cells[k].length) delete W.cells[k]; }
      }
      savePlan(); toast(`${st.name} : ${plural(sl.length, 'créneau', 'créneaux')} ${st.mode === 'abs' ? 'marqué(s) absent' : 'retiré(s) du planning'}.`); render();
    }
    bg.remove();
  });
  document.body.appendChild(bg);
}

      <td><input type="date" data-me="${m.id}" value="${esc(m.end && m.end > '2000-01-01' ? m.end : (m.end ? '2000-01-01' : ''))}"></td>
      <td><button class="btn ghost small-btn" data-mu="${m.id}" type="button" aria-label="Monter">↑</button> <button class="btn ghost small-btn" data-md="${m.id}" type="button" aria-label="Descendre">↓</button></td>
      <td>${modelActiveOn(m, date) ? '<span class="pill Strong">Affichée</span>' : (m.start && date < m.start ? '<span class="pill OnTrack">Pas encore lancée</span>' : '<span class="pill Warning">Arrêtée</span>')}</td>${Sync.canManage() ? `<td class="num"><button class="btn danger" data-mdel="${m.id}" type="button">Supprimer</button></td>` : ''}</tr>`).join('')}
    </tbody></table></div>
    <button class="btn" id="pm-add" type="button" style="margin-top:12px">+ Ajouter une modèle</button>
  </details>`;
}
function bindPlanModels(wk, d) {
  const panel = document.getElementById('pm-panel'); if (!panel) return;
  panel.addEventListener('toggle', () => { planUI.modelsOpen = panel.open; });
  const map = planModelsMap();
  const done = () => { savePlan(); render(); };
  // Suppression définitive (administrateurs) : la modèle et toutes ses cases disparaissent de toutes les semaines
  panel.querySelectorAll('[data-mdel]').forEach(b => b.addEventListener('click', async () => {
    const id = b.dataset.mdel, m = map[id]; if (!m) return;
    let n = 0; for (const W of Object.values(planState.weeks)) for (const k of Object.keys(W.cells || {})) if (k.split('|')[2] === id) n++;
    if (!(await modal(`Supprimer ${m.name}`, `<p>Supprimer <strong>${esc(modelLabel({...m, id}))}</strong> du planning, sur toutes les semaines${n ? `, ainsi que ses ${plural(n, 'case remplie', 'cases remplies')}` : ''} ? Cette action est définitive.</p><p class="hint">Pour arrêter une modèle en gardant l'historique, indiquez plutôt son « Dernier jour ».</p>`, 'Supprimer définitivement'))) return;
    delete map[id];
    for (const W of Object.values(planState.weeks)) for (const k of Object.keys(W.cells || {})) if (k.split('|')[2] === id) delete W.cells[k];
    savePlan(); toast(`${m.name} supprimée du planning.`); render();
  }));
  panel.querySelectorAll('[data-mg]').forEach(el => el.addEventListener('change', () => { map[el.dataset.mg].group = el.value; done(); }));
  panel.querySelectorAll('[data-mn]').forEach(el => el.addEventListener('change', () => { if (el.value.trim()) { map[el.dataset.mn].name = el.value.trim(); done(); } }));
  panel.querySelectorAll('[data-ms]').forEach(el => el.addEventListener('change', () => { const m = map[el.dataset.ms]; if (el.value) m.start = el.value; else delete m.start; done(); }));
  panel.querySelectorAll('[data-me]').forEach(el => el.addEventListener('change', () => {
    const id = el.dataset.me, m = map[id];
    if (!el.value) { delete m.end; return done(); }
    m.end = el.value;
    // Les cases recopiées après le dernier jour sont vidées (seulement après cette date)
    let removed = 0;
    for (const [wkey, W] of Object.entries(planState.weeks)) for (const k of Object.keys(W.cells || {})) {
      const [dd, , mid] = k.split('|');
      if (mid === id && addDaysIso(wkey, +dd) > m.end) { delete W.cells[k]; removed++; }
    }
    if (removed) toast(`${m.name} : dernier jour le ${fmtDayFr(m.end)}, ${plural(removed, 'case vidée', 'cases vidées')} après cette date.`);
    done();
  }));
  const move = (id, dir) => { const same = allModels().filter(x => x.group === map[id].group); same.forEach((x, i) => { map[x.id].order = i; }); const i = same.findIndex(x => x.id === id), j = i + dir; if (j < 0 || j >= same.length) return; map[same[i].id].order = j; map[same[j].id].order = i; done(); };
  panel.querySelectorAll('[data-mu]').forEach(el => el.addEventListener('click', () => move(el.dataset.mu, -1)));
  panel.querySelectorAll('[data-md]').forEach(el => el.addEventListener('click', () => move(el.dataset.md, 1)));
  document.getElementById('pm-add').addEventListener('click', () => addModelModal(addDaysIso(wk, d)));
}

/* =====================================================================
   PRIMES & PÉNALITÉS — pénalités, réattributions de ventes et primes, semaine par semaine
   Partagé avec toute l'équipe (clé « suivi »). Les semaines de plus de 5 semaines sont supprimées automatiquement.
   ===================================================================== */
const LS_SUIVI = 'rca.suivi.v1', LS_SUIVI_SUP = 'rca.suivi.sup';
const SUIVI_KEEP_WEEKS = 5;
let suiviState = (() => { const s = lsGet(LS_SUIVI, null) || {}; s.weeks ||= {}; return s; })();
const saveSuivi = () => { lsSet(LS_SUIVI, suiviState); Sync.changed('suivi'); };
const suiviUI = {week:null, tab:'pen', q:''};
const SUIVI_KINDS = {
  pen: {label:'Pénalités', one:'pénalité', add:'Ajouter une pénalité', color:'#f0605e', pts:'Malus'},
  rea: {label:'Réattributions', one:'réattribution', add:'Ajouter une réattribution', color:'#f2a43c'},
  pri: {label:'Primes', one:'prime', add:'Ajouter une prime', color:'#45d08f', pts:'Bonus'}
};
const suiviWeek = wk => (suiviState.weeks[wk] ||= {pen:{}, rea:{}, pri:{}});
const suiviList = (wk, kind) => Object.entries((suiviState.weeks[wk] || {})[kind] || {}).map(([id, e]) => ({id, ...e})).sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.at || 0) - (a.at || 0));
const fmtDateFr = iso => iso ? parseDate(iso).toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric'}) : '';
const saleAmount = s => { const nums = String(s || '').replace(/(\d)\s+(?=\d{3}\b)/g, '$1').match(/\d+(?:[.,]\d+)?/g); return nums ? nums.reduce((a, n) => a + parseFloat(n.replace(',', '.')), 0) : 0; };

// Suppression automatique : on garde la semaine en cours et les 5 précédentes
function purgeSuivi() {
  const cutoff = addDaysIso(mondayOf(isoOf(new Date())), -7 * SUIVI_KEEP_WEEKS);
  const old = Object.keys(suiviState.weeks).filter(k => k < cutoff);
  if (old.length) { old.forEach(k => delete suiviState.weeks[k]); saveSuivi(); }
}
function suiviSuggestions() {
  const s = {chatter:new Map(), sup:new Map(), comment:new Map(), model:new Map(), type:new Map()};
  const add = (m, v) => { const t = String(v || '').trim(); if (t) m.set(t.toLowerCase(), t); };
  for (const W of Object.values(suiviState.weeks)) for (const kind of ['pen', 'rea', 'pri']) for (const e of Object.values(W[kind] || {})) {
    add(s.chatter, e.chatter); add(s.sup, e.sup); add(s.comment, e.comment); add(s.model, e.model); add(s.type, e.type);
  }
  for (const n of knownChatters()) add(s.chatter, n);
  for (const m of allModels()) add(s.model, modelLabel(m));
  ['Média', 'Tips', 'Média + tips', 'Custom', 'Sextape'].forEach(t => add(s.type, t));
  ['Prime CUSTOM', 'Prime CAM'].forEach(t => add(s.comment, t));
  const sorted = m => [...m.values()].sort((a, b) => a.localeCompare(b, 'fr'));
  return {chatter:sorted(s.chatter), sup:sorted(s.sup), comment:sorted(s.comment), model:sorted(s.model), type:sorted(s.type)};
}

/* ---------- Page ---------- */
function renderSuivi(main) {
  purgeSuivi();
  const wk = suiviUI.week ||= mondayOf(isoOf(new Date()));
  const W = suiviState.weeks[wk] || {pen:{}, rea:{}, pri:{}};
  const counts = {pen: Object.keys(W.pen || {}).length, rea: Object.keys(W.rea || {}).length, pri: Object.keys(W.pri || {}).length};

  const weeksAvail = [...new Set([...Object.keys(suiviState.weeks), mondayOf(isoOf(new Date())), wk])].sort().reverse();

      <select id="sw-sel">${weeksAvail.map(k => `<option value="${k}" ${k === wk ? 'selected' : ''}>${esc(planWeekLabel(k))}</option>`).join('')}</select>

  else {

      : [['Date', e => fmtDateFr(e.date)], [K.pts, e => `<span class="ptsb ${tab}">${tab === 'pen' ? '−' : '+'}${esc(e.pts)}</span>`], ['Chatteur', e => `<strong>${esc(e.chatter || '')}</strong>`], ['Commentaire', e => esc(e.comment || '')], ['Superviseur', e => esc(e.sup || '')]];
    body = `<section class="panel sui-card" style="--tc:${K.color}">
      <div class="sui-bar"><button class="btn primary" id="s-add" type="button">+ ${K.add}</button>
        <input type="search" id="s-q" placeholder="Rechercher un chatteur ou un commentaire" value="${esc(suiviUI.q)}">
        <span class="muted sui-total">${rows.length ? plural(rows.length, K.one, K.label.toLowerCase()) : ''}${rows.length ? ` · ${tab === 'rea' ? `${nf(total, 0, 2)} au total` : `${tab === 'pen' ? '−' : '+'}${nf(total, 0, 1)} pts`}` : ''}</span>
        ${rows.length ? `<button class="btn ghost" id="s-csv" type="button">${icon('download')}CSV</button>` : ''}</div>
      ${rows.length ? `<div class="tbl-wrap" style="max-height:none"><table class="sui-table"><thead><tr>${cols.map(c => `<th>${c[0]}</th>`).join('')}</tr></thead><tbody>
        ${rows.map(e => `<tr class="click" data-sid="${e.id}" tabindex="0" title="Cliquer pour modifier">${cols.map(c => `<td>${c[1](e)}</td>`).join('')}</tr>`).join('')}
      </tbody></table></div>`
      : `<div class="empty" style="padding:34px 10px"><div style="font-size:15px;color:var(--text);font-weight:600">Aucune ${K.one} ${q ? 'trouvée' : `pour la ${esc(planWeekLabel(wk))}`}</div><div class="hint" style="margin-top:4px">${q ? 'Essayez une autre recherche.' : `Cliquez sur « ${K.add} » pour en saisir une.`}</div></div>`}
    </section>`;
  }
  main.innerHTML = head + tabs + `<div class="stack">${body}
    <p class="hint" style="text-align:center;font-size:12px;margin:0">Partagé avec toute l'équipe · les ${SUIVI_KEEP_WEEKS} dernières semaines sont conservées, les plus anciennes sont supprimées automatiquement.</p></div>`;
  const goW = k => { suiviUI.week = k; render(); };
  document.getElementById('sw-prev').addEventListener('click', () => goW(addDaysIso(wk, -7)));
  document.getElementById('sw-next').addEventListener('click', () => goW(addDaysIso(wk, 7)));
  document.getElementById('sw-sel').addEventListener('change', e => goW(e.target.value));
  main.querySelectorAll('[data-stab]').forEach(b => b.addEventListener('click', () => { suiviUI.tab = b.dataset.stab; render(); }));
  if (tab !== 'bilan') {
    document.getElementById('s-add').addEventListener('click', () => suiviEdit(wk, tab, null));
    const qi = document.getElementById('s-q'); let t;
    qi.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { suiviUI.q = qi.value; render(); const n = document.getElementById('s-q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); });
    main.querySelectorAll('[data-sid]').forEach(tr => { const open = () => suiviEdit(wk, tab, tr.dataset.sid); tr.addEventListener('click', open); tr.addEventListener('keydown', e => { if (e.key === 'Enter') open(); }); });
    document.getElementById('s-csv')?.addEventListener('click', () => suiviCSV(wk, tab));
  } else {
    main.querySelectorAll('[data-bil]').forEach(tr => tr.addEventListener('click', () => { suiviUI.q = tr.dataset.bil; suiviUI.tab = tr.dataset.tab || 'pen'; render(); }));
    document.getElementById('s-csv-all')?.addEventListener('click', () => suiviCSV(wk, 'bilan'));

}

/* ---------- Bilan par chatteur ---------- */
function suiviBilanData(wk) {
  const by = new Map();
  const row = n => { const k = normName(n); if (!by.has(k)) by.set(k, {name: n, mal: 0, nPen: 0, bon: 0, nPri: 0, nRea: 0, rea: 0}); return by.get(k); };
  for (const e of suiviList(wk, 'pen')) { const r = row(e.chatter); r.mal += +e.pts || 0; r.nPen++; }
  for (const e of suiviList(wk, 'pri')) { const r = row(e.chatter); r.bon += +e.pts || 0; r.nPri++; }
  for (const e of suiviList(wk, 'rea')) { const r = row(e.chatter); r.nRea++; r.rea += saleAmount(e.sale); }
  return [...by.values()].map(r => ({...r, net: r.bon - r.mal})).sort((a, b) => a.net - b.net || b.nRea - a.nRea || a.name.localeCompare(b.name, 'fr'));
}
function suiviBilanHTML(wk) {
  const rows = suiviBilanData(wk);
  const T = rows.reduce((a, r) => ({mal: a.mal + r.mal, bon: a.bon + r.bon, nPen: a.nPen + r.nPen, nPri: a.nPri + r.nPri, nRea: a.nRea + r.nRea, rea: a.rea + r.rea}), {mal:0, bon:0, nPen:0, nPri:0, nRea:0, rea:0});
  return `<section class="stats sui-stats">
      <div class="stat"><div class="k">Pénalités</div><div class="v" style="color:#f87171">−${nf(T.mal, 0, 1)} pts</div><div class="d">${plural(T.nPen, 'pénalité', 'pénalités')}</div></div>
      <div class="stat"><div class="k">Primes</div><div class="v" style="color:#4ade80">+${nf(T.bon, 0, 1)} pts</div><div class="d">${plural(T.nPri, 'prime', 'primes')}</div></div>
      <div class="stat"><div class="k">Réattributions</div><div class="v" style="color:#fbbf24">${T.nRea}</div><div class="d">${nf(T.rea, 0, 2)} au total</div></div>
      <div class="stat"><div class="k">Chatteurs concernés</div><div class="v">${rows.length}</div><div class="d">${esc(planWeekLabel(wk))}</div></div>
    </section>
    <section class="panel"><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px"><h2 style="margin:0">Bilan par chatteur</h2><span class="hint" style="margin:0">Du solde le plus négatif au plus positif · cliquez sur une ligne pour voir le détail</span>
      ${rows.length ? `<button class="btn ghost" id="s-csv-all" type="button" style="margin-left:auto">${icon('download')}Exporter le bilan</button>` : ''}</div>
      ${rows.length ? `<div class="tbl-wrap" style="max-height:none"><table><thead><tr><th>Chatteur</th><th class="num">Malus</th><th class="num">Bonus</th><th class="num">Solde</th><th class="num">Réattributions</th></tr></thead><tbody>
        ${rows.map(r => `<tr class="click" data-bil="${esc(r.name)}" data-tab="${r.nPen ? 'pen' : r.nRea ? 'rea' : 'pri'}"><td><strong>${esc(r.name)}</strong></td>
          <td class="num">${r.nPen ? `<span class="ptsb pen">−${nf(r.mal, 0, 1)}</span> <span class="sub">${r.nPen}×</span>` : '<span class="muted">—</span>'}</td>
          <td class="num">${r.nPri ? `<span class="ptsb pri">+${nf(r.bon, 0, 1)}</span> <span class="sub">${r.nPri}×</span>` : '<span class="muted">—</span>'}</td>
          <td class="num"><strong class="${r.net < 0 ? 'sc-lo' : r.net > 0 ? 'sc-hi' : ''}">${r.net > 0 ? '+' : ''}${nf(r.net, 0, 1)}</strong></td>
          <td class="num">${r.nRea ? `${r.nRea} <span class="sub">(${nf(r.rea, 0, 2)})</span>` : '<span class="muted">—</span>'}</td></tr>`).join('')}
      </tbody></table></div>` : `<div class="empty" style="padding:30px 10px">Rien de saisi pour la ${esc(planWeekLabel(wk))}.</div>`}
    </section>`;
}

/* ---------- Saisie / modification ---------- */
function suiviEdit(wk, kind, id, prefill) {
  const K = SUIVI_KINDS[kind], sug = suiviSuggestions();
  const today = isoOf(new Date());
  const cur = id ? {...suiviState.weeks[wk][kind][id]} : {date: today >= wk && today <= addDaysIso(wk, 6) ? today : addDaysIso(wk, 6), sup: lsGet(LS_SUIVI_SUP, '') || '', pts: kind === 'pen' ? 5 : kind === 'pri' ? 10 : undefined, ...(prefill || {})};
  const dl = (idn, list) => `<datalist id="${idn}">${list.map(v => `<option value="${esc(v)}">`).join('')}</datalist>`;
  const f = (label, html, wide) => `<label class="sf ${wide ? 'wide' : ''}"><span>${label}</span>${html}</label>`;
  const inp = (name, extra = '') => `<input type="text" name="${name}" value="${esc(cur[name] ?? '')}" ${extra}>`;
  const quick = kind === 'pen' ? [2, 5, 10] : kind === 'pri' ? [5, 10, 20] : [];
  const fields = kind === 'rea'
    ? f('Date', `<input type="date" name="date" value="${esc(cur.date || '')}" required>`) + f('Type', inp('type', 'list="sd-type" placeholder="Média, Tips…"')) + f('Vente', inp('sale', 'placeholder="40 ou 25 tips + 100 ppv"'))
      + f('Fan', inp('fan', 'placeholder="Nom du fan"')) + f('ID du fan', inp('fanId', 'placeholder="@u507578546"')) + f('Modèle', inp('model', 'list="sd-model" placeholder="Alice OF"'))
      + f('Chatteur', inp('chatter', 'list="sd-chatter" required')) + f('Superviseur', inp('sup', 'list="sd-sup"')) + f('Commentaire', `<textarea name="comment" rows="2" placeholder="non respect du pricing…">${esc(cur.comment || '')}</textarea>`, true)
    : f('Date', `<input type="date" name="date" value="${esc(cur.date || '')}" required>`)
      + f(K.pts + ' (points)', `<div class="qrow">${quick.map(v => `<button type="button" class="qpt ${+cur.pts === v ? 'on' : ''}" data-qpt="${v}">${kind === 'pen' ? '−' : '+'}${v}</button>`).join('')}<input type="number" name="pts" min="0" step="any" value="${esc(cur.pts ?? '')}" style="width:90px"></div>`)
      + f('Chatteur', inp('chatter', 'list="sd-chatter" required'))
      + f('Superviseur', inp('sup', 'list="sd-sup"'))
      + f('Commentaire', `${kind === 'pri' ? `<div class="qrow" style="margin-bottom:6px">${['Prime CUSTOM', 'Prime CAM'].map(v => `<button type="button" class="qpt" data-qc="${v}">${v}</button>`).join('')}</div>` : ''}<textarea name="comment" rows="2" placeholder="${kind === 'pen' ? 'Inactif, mauvais prix de sextape…' : 'Prime CUSTOM, Prime CAM…'}">${esc(cur.comment || '')}</textarea>`, true);
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal sui-modal" role="dialog" aria-modal="true" style="--tc:${K.color}"><h3><span class="sdot"></span>${id ? `Modifier la ${K.one}` : K.add}</h3>
    <form class="sform" novalidate>${fields}</form>
    ${dl('sd-chatter', sug.chatter)}${dl('sd-sup', sug.sup)}${dl('sd-model', sug.model)}${dl('sd-type', sug.type)}
    <div id="s-err" class="sc-lo" style="min-height:18px;font-size:13px;margin-top:6px"></div>
    <div class="acts">${id ? '<button class="btn danger" data-a="del" type="button" style="margin-right:auto">Supprimer</button>' : ''}<button class="btn ghost" data-a="0" type="button">Annuler</button><button class="btn primary" data-a="1" type="button">${id ? 'Enregistrer' : 'Ajouter'}</button></div></div>`;
  const form = bg.querySelector('form');
  const close = () => bg.remove();
  bg.addEventListener('keydown', e => { if (e.key === 'Escape') close(); if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); bg.querySelector('[data-a="1"]').click(); } });
  bg.addEventListener('click', async e => {
    if (e.target === bg) return close();
    const q = e.target.closest('[data-qpt]'); if (q) { form.pts.value = q.dataset.qpt; bg.querySelectorAll('[data-qpt]').forEach(b => b.classList.toggle('on', b === q)); return; }
    const qc = e.target.closest('[data-qc]'); if (qc) { form.comment.value = qc.dataset.qc; return; }
    const a = e.target.closest('[data-a]'); if (!a) return;
    if (a.dataset.a === '0') return close();
    if (a.dataset.a === 'del') {
      if (!(await modal(`Supprimer cette ${K.one}`, `<p>Supprimer la ${K.one} de <strong>${esc(cur.chatter || '')}</strong> du ${esc(fmtDateFr(cur.date))} ? Cette action est définitive.</p>`, 'Supprimer'))) return;
      delete suiviState.weeks[wk][kind][id]; saveSuivi(); close(); toast(`${K.one.charAt(0).toUpperCase() + K.one.slice(1)} supprimée.`); render(); return;
    }
    const data = Object.fromEntries(new FormData(form).entries());
    for (const k of Object.keys(data)) data[k] = String(data[k]).trim();
    const err = !data.date ? 'Choisissez une date.' : !data.chatter ? 'Indiquez le chatteur.' : kind !== 'rea' && !(+data.pts > 0) ? `Indiquez le ${K.pts.toLowerCase()} en points.` : '';
    if (err) { bg.querySelector('#s-err').textContent = err; return; }
    if (kind !== 'rea') data.pts = +data.pts;
    const clean = Object.fromEntries(Object.entries(data).filter(([, v]) => v !== ''));
    clean.at = id ? (cur.at || Date.now()) : Date.now();
    if (data.sup) lsSet(LS_SUIVI_SUP, data.sup);
    const target = mondayOf(data.date);
    if (id) delete suiviState.weeks[wk][kind][id];
    suiviWeek(target)[kind][id || 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6)] = clean;
    saveSuivi(); close();

/* =====================================================================
   GESTION CAM / CUSTOM — demandes personnalisées, suivi « faite », rappels des demandes en attente

const LS_CAMS = 'rca.cams.v1', LS_CAMS_REMIND = 'rca.cams.remind';
let camsState = (() => { const s = lsGet(LS_CAMS, null) || {}; s.items ||= {}; return s; })();
const saveCams = () => { lsSet(LS_CAMS, camsState); Sync.changed('cams'); };
const camsUI = {tab:'todo', week:null, type:'all', plat:'', model:'', q:''};
// Plateformes : MYM, OF et Reveal par défaut ; toute plateforme saisie à la main devient ensuite un choix proposé.
const CAM_PLATFORMS = ['MYM', 'OF', 'Reveal'];
const PLAT_COLORS = {MYM: '#22c55e', OF: '#eab308', REVEAL: '#a855f7'};
const platColor = p => PLAT_COLORS[String(p || '').toUpperCase()] || '#94a3b8';
const platOf = e => e.platform || (/\bof\b/i.test(e.model || '') ? 'OF' : /\bmym\b/i.test(e.model || '') ? 'MYM' : /reveal/i.test(e.model || '') ? 'Reveal' : '');
const modelBase = e => e.platform ? (e.model || '') : String(e.model || '').replace(/\s+(of|mym)$/i, '').trim();
const camLabel = e => `${modelBase(e)}${platOf(e) ? ' ' + platOf(e) : ''}`.trim();
const platBadge = p => p ? `<span class="platb" style="--tc:${platColor(p)}">${esc(p)}</span>` : '';
function camPlatforms() {
  const seen = new Map(CAM_PLATFORMS.map(p => [p.toLowerCase(), p]));
  for (const e of camList()) { const p = platOf(e); if (p && !seen.has(p.toLowerCase())) seen.set(p.toLowerCase(), p); }
  return [...seen.values()];
}
const CAM_TYPES = [['custom', 'Custom', '#a78bfa'], ['cam', 'Cam', '#38bdf8'], ['snap', 'Snap', '#facc15']];
const camType = t => CAM_TYPES.find(x => x[0] === t) || ['autre', t || 'Autre', '#94a3b8'];
const camList = () => Object.entries(camsState.items).map(([id, e]) => ({id, ...e}));
const camCur = e => { const p = platOf(e).toUpperCase(); return p === 'OF' ? '$' : p === 'MYM' ? '€' : ''; };
const camMoney = (v, c) => v == null || v === '' ? '—' : `${nf(+v, 0, 2)}${c ? '\u00a0' + c : ''}`;
const camRest = e => Math.max(0, (+e.price || 0) - (+e.paid || 0));

  const todo = camList().filter(e => (e.status || 'todo') === 'todo');
  const urgent = todo.filter(e => camLevel(e) === 3), late = todo.filter(e => camLevel(e) === 2);
  const worst = todo.reduce((m, e) => Math.max(m, camLevel(e)), -1);

}
// Rappel : une fois par jour et par navigateur, s'il reste des demandes en attente
function camsReminder() {
  camsNotifyCheck();
  const p = camsPending(); if (!p.all.length) return;
  const today = isoOf(new Date()); if (lsGet(LS_CAMS_REMIND, '') === today) return;
  lsSet(LS_CAMS_REMIND, today);

function camsSuggest() {
  const m = {chatter:new Map(), model:new Map()};
  const add = (map, v) => { const t = String(v || '').trim(); if (t) map.set(t.toLowerCase(), t); };
  for (const e of camList()) { add(m.chatter, e.chatter); add(m.model, modelBase(e)); }
  for (const n of knownChatters()) add(m.chatter, n);
  for (const x of allModels()) add(m.model, x.name);
  const s = map => [...map.values()].sort((a, b) => a.localeCompare(b, 'fr'));

/* ---------- Niveaux d'ancienneté et notifications ---------- */
const CAM_CFG_DEF = {orange: 4, red: 8, urgent: 15};

// Demande non faite : 0 récente, 1 orange, 2 rouge clair, 3 urgente (ou date limite dépassée)
function camLevel(e) {
  if ((e.status || 'todo') !== 'todo') return -1;
  const c = camCfg(), today = isoOf(new Date());
  if (e.due && e.due < today) return 3;
  const a = daysSince(e.date);
  return a >= c.urgent ? 3 : a >= c.red ? 2 : a >= c.orange ? 1 : 0;
}
const camWho = () => (Sync.email() || '').split('@')[0] || lsGet(LS_SUIVI_SUP, '') || '';

const notifSupported = () => 'Notification' in window;
const notifOn = () => notifSupported() && Notification.permission === 'granted' && lsGet(LS_CAMS_NOTIF, false);
function camsNotify(title, body, tag) {
  try { const n = new Notification(title, {body, tag}); n.onclick = () => { window.focus(); location.hash = `#${route().pid}/cams`; n.close(); }; } catch (e) { /* navigateur sans notifications */ }
}
// Notifications système : nouvelle demande urgente + récapitulatif une fois par matin (site ouvert, même en arrière-plan)
function camsNotifyCheck() {
  if (!notifOn()) return;
  const p = camsPending(), today = isoOf(new Date());
  const seen = lsGet(LS_CAMS_NOTIFIED, {}) || {};
  const fresh = p.urgent.filter(e => !seen[e.id]);
  if (fresh.length) {
    camsNotify(`Cam / Custom : ${plural(fresh.length, 'demande urgente', 'demandes urgentes')}`, fresh.slice(0, 4).map(e => `${camLabel(e)} · ${e.chatter || ''} · ${daysSince(e.date)} j`).join('\n') + (fresh.length > 4 ? `\n+ ${fresh.length - 4} autres` : ''), 'cams-urgent');
    fresh.forEach(e => { seen[e.id] = today; }); lsSet(LS_CAMS_NOTIFIED, seen);
  }
  if (lsGet(LS_CAMS_MORNING, '') !== today && new Date().getHours() >= 7) {
    lsSet(LS_CAMS_MORNING, today);
    if (p.all.length) camsNotify('Cam / Custom · récap du jour', `${plural(p.all.length, 'demande en attente', 'demandes en attente')} · ${p.urgent.length} urgente${p.urgent.length > 1 ? 's' : ''} · ${p.late.length} en retard`, 'cams-morning');

    if (route().page !== 'cams') go(`${route().pid}/cams`); else render();

/* =====================================================================
   SUIVI DES CHATTERS — liste des moins performants (2 dernières semaines), répartition entre superviseurs
   Clé partagée « coaching ». Étape 1 : liste, reconnaissance des noms, répartition, validation par la Direction.
   ===================================================================== */
const LS_COACH = 'rca.coach.v1';
let coachState = (() => { const s = lsGet(LS_COACH, null) || {}; s.weeks ||= {}; s.links ||= {}; return s; })();
const saveCoach = () => { lsSet(LS_COACH, coachState); Sync.changed('coaching'); };
const COACH_DEF = {n: 20, cap: 6, minShifts: 2, span: 2};
const coachCfg = () => ({...COACH_DEF, ...(coachState.cfg || {})});
const coachUI = {week: null};
const BAD_NAME = /acc[eè]s\s+r[eé]voqu|superviseu?r|\bsup\b|\bmanager\b|@/i;
const SHIFT_HOURS = [[4, 10], [10, 16], [16, 22], [22, 28]];
const supFocus = s => /mym/i.test(s.focus || '') ? 'MYM' : /only|^\s*of\s*$/i.test(s.focus || '') ? 'OF' : '';
const supEligible = (s, pid) => { const f = supFocus(s); return !f || f === (pid === 'of' ? 'OF' : 'MYM'); };
const mySup = () => { const e = String(Sync.email() || '').toLowerCase(); return e ? supList().find(s => String(s.email || '').toLowerCase() === e) : null; };

// Nom d'un import (« rocharlotrakotoson », « Vonjy Mym ») → prénom du planning (« Rocharlot », « Vonjy »)
// Toute l'équipe connue : tous les plannings enregistrés + Jours OFF (pas seulement les 3 dernières semaines)
function coachRoster(wk) {
  const roster = new Map(teamRoster(wk));
  const add = n => { const t = String(n || '').trim(); const k = rosterKey(t); if (t && k && !roster.has(k)) roster.set(k, t.replace(/\s+(mym|of)$/i, '').trim() || t); };
  for (const W of Object.values(planState.weeks)) for (const list of Object.values(W.cells || {})) for (const e of list) [e.n, ...(e.r ? e.r.split('/') : [])].forEach(add);
  return roster;
}
function editDist(a, b) {
  const m = a.length, n = b.length; if (Math.abs(m - n) > 3) return 9;
  let prev = Array.from({length: n + 1}, (_, j) => j);
  for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return prev[n];
}
const firstWord = n => (normName(String(n || '').replace(/\(.*?\)/g, ' ')).split(/[^a-z]+/).find(w => w.length >= 3) || '');
function coachMatch(importName, roster) {
  const k = rosterKey(importName); if (!k) return null;
  const link = coachState.links[k]; if (link) return link === '—' ? null : link;
  const list = [...roster];
  const uniq = arr => { if (arr.length === 1) return arr[0][1]; if (arr.length > 1) { arr.sort((a, b) => b[0].length - a[0].length); if (arr[0][0].length > arr[1][0].length) return arr[0][1]; } return null; };
  // 1. identique  2. une lettre d'écart  3. l'un commence par l'autre (« rocharlotrakotoson » / « Rocharlot »)
  let hit = list.find(([rk]) => rk === k) || list.find(([rk]) => nearKey(rk, k));
  if (hit) return hit[1];
  let r = uniq(list.filter(([rk]) => rk.length >= 4 && (k.startsWith(rk) || rk.startsWith(k) && k.length >= 4))); if (r) return r;
  // 4. même premier prénom (« Mahery Christian » / « Mahery »), s'il est unique dans l'équipe
  const fw = firstWord(importName);
  if (fw.length >= 4) { r = uniq(list.filter(([rk, name]) => rk === fw || firstWord(name) === fw)); if (r) return r; }
  // 4b. un des mots du nom (5 lettres et plus) est un prénom du planning (« Nate Fanomezantsoa » / « Fanomezantsoa »)
  const words = normName(String(importName).replace(/\(.*?\)/g, ' ')).split(/[^a-z]+/).filter(w => w.length >= 5 && w !== 'mym');
  if (normName(String(importName)).split(/[^a-z]+/).filter(Boolean).length > 1 && words.length) { r = uniq(list.filter(([rk]) => words.includes(rk))); if (r) return r; }
  // 5. deux lettres d'écart pour les noms longs (7 lettres et plus), si un seul nom correspond
  if (k.length >= 7) { const near2 = list.filter(([rk]) => rk.length >= 7 && editDist(rk, k) <= 2); if (near2.length === 1) return near2[0][1]; }
  return null;
}
// Prénoms du planning les plus proches d'un nom non reconnu (suggestions à valider en un clic)
function coachSuggest(importName, roster) {
  const k = rosterKey(importName), fw = firstWord(importName);
  return [...roster].map(([rk, name]) => ({name, d: rk.includes(k) || k.includes(rk) ? 0.5 : fw && firstWord(name) === fw ? 0.6 : editDist(rk, k)}))
    .filter(x => x.d <= Math.max(2, Math.floor(k.length / 3))).sort((a, b) => a.d - b.d || b.name.length - a.name.length).slice(0, 4).map(x => x.name);
}
// Shifts d'un chatter (prénom du planning) sur une plage de semaines : [{wk, d, s, mid}]
function coachShifts(planName, weeks) {
  const k = rosterKey(planName), out = [], seen = new Set();
  for (const wk of weeks) { const W = planState.weeks[wk]; if (!W) continue;
    for (const [key, list] of Object.entries(W.cells || {})) { const [d, s, mid] = key.split('|');
      for (const e of list) { const w = workerOf(e); if (!w) continue; if (w.split('/').some(n => nearKey(rosterKey(n), k))) { const sk = `${wk}|${d}|${s}`; if (!seen.has(sk)) { seen.add(sk); out.push({wk, d: +d, s: +s, mid}); } else out.push({wk, d: +d, s: +s, mid, dup: true}); } } } }
  return out;
}
// Heures communes entre les shifts d'un chatter et un superviseur
function coachOverlap(sup, shifts) {
  let h = 0;
  for (const x of shifts) { if (x.dup) continue; const [a, b] = SHIFT_HOURS[x.s];
    for (let t = a; t < b; t++) { const d = (x.d + Math.floor(t / 24)) % 7, hh = t % 24; if (supBlocks(sup, d).some(bl => hh + 0.5 > bl.start && hh + 0.5 < bl.end)) h++; } }
  return h;
}
function coachPeriod(pid, start, end) {
  const inside = chronoPeriods(pid).filter(p => p.start && p.end && p.start >= start && p.end <= end);
  if (!inside.length) return null;
  const p = inside.length === 1 ? inside[0] : RCA.combinePeriods(pid, inside, {id: `coach:${pid}:${start}:${end}`, name: `${fmtRange(start, end)}`, start, end});
  return {p, n: inside.length, res: store.resultsFor(p)};
}
// Construit la liste de la semaine wk à partir des performances des semaines précédentes
// keepFrom : liste déjà préparée dont on garde la répartition (retrait d'une personne → le suivant entre, le reste ne bouge pas)
function coachBuild(wk, keepFrom) {
  const supKeys = supList().map(s => rosterKey(s.name)).filter(k => k.length >= 3);
  const removed = (keepFrom && keepFrom.removed) || {};
  const cfg = coachCfg(), end = addDaysIso(wk, -1), start = addDaysIso(wk, -7 * cfg.span);
  const roster = coachRoster(wk);
  const prevWk = addDaysIso(wk, -7), prev = coachState.weeks[prevWk] && coachState.weeks[prevWk].status === 'validated' ? coachState.weeks[prevWk] : null;   // un brouillon (test) ne compte jamais
  const planWeeks = [...Array(cfg.span)].map((_, i) => addDaysIso(wk, -7 * (i + 1)));
  const curShiftWeek = planState.weeks[wk] ? wk : prevWk;
  const out = {items: {}, excluded: [], info: {noPlan: !planState.weeks[wk] && !planState.weeks[prevWk], planWeek: planState.weeks[wk] ? wk : planState.weeks[prevWk] ? prevWk : null}, start, end};
  for (const pid of ['of', 'mym']) {
    const d = coachPeriod(pid, start, end);
    out.info[pid] = d ? {imports: d.n, count: d.res.results.length} : null;
    if (!d) continue;
    const cand = [];
    for (const r of d.res.results) {
      if (BAD_NAME.test(r.name)) { out.excluded.push({name: r.name, pid, why: 'accès révoqué / superviseur'}); continue; }
      const rk = rosterKey(r.name);
      if (supKeys.includes(rk)) { out.excluded.push({name: r.name, pid, why: 'superviseur (planning des superviseurs)'}); continue; }
      const ign = (coachState.ignore || {})[rk];
      if (ign) { out.excluded.push({name: r.name, pid, why: 'retiré définitivement (pas un chatter)', key: rk, restore: true}); continue; }
      const plan = coachMatch(r.name, roster);
      if (removed[rosterKey(plan || r.name)]) { out.excluded.push({name: r.name, pid, why: 'retiré à la main cette semaine', key: rosterKey(plan || r.name), restoreWeek: true}); continue; }
      const fl = (coachState.flags || {})[rosterKey(plan || r.name)];
      if (fl && fl.state === 'stopped') { out.excluded.push({name: r.name, pid, why: `arrêté (décision de la ${planWeekLabel(fl.wk).toLowerCase()})`}); continue; }
      if (fl && fl.state === 'exited' && fl.wk === addDaysIso(wk, -7)) { out.excluded.push({name: r.name, pid, why: 'sorti du suivi la semaine dernière'}); continue; }
      const shifts = plan ? coachShifts(plan, planWeeks).filter(x => !x.dup) : [];
      if (plan && shifts.length < cfg.minShifts) { out.excluded.push({name: r.name, pid, why: `${plural(shifts.length, 'shift', 'shifts')} au planning sur la période`}); continue; }
      cand.push({r, plan, shifts: shifts.length});
    }
    cand.sort((a, b) => a.r.final - b.r.final);
    cand.slice(0, cfg.n).forEach((c, i) => {
      const key = rosterKey(c.plan || c.r.name);
      const ex = out.items[key];
      const item = {name: c.r.name, plan: c.plan || '', pid, rank: i + 1, of: cand.length, score: Math.round(c.r.final * 10) / 10, grade: c.r.grade, ca: c.r.row.revenue ?? c.r.row.total ?? null, shifts: c.shifts,
        isNew: c.plan ? isFlaggedNew(c.plan) : false, streak: prev && prev.items && prev.items[key] ? (prev.items[key].streak || 1) + 1 : 1};
      if (ex) { ex.pid = 'both'; ex.alsoRank = `${pid.toUpperCase()} ${i + 1}`; } else out.items[key] = item;
    });
  }
  // Répartition : continuité d'abord, puis heures communes + modèles attribuées + charge la plus faible
  const sups = supList(), load = Object.fromEntries(sups.map(s => [s.id, 0]));
  const items = Object.entries(out.items);
  const prep = items.map(([key, it]) => {
    const sh = it.plan ? coachShifts(it.plan, [curShiftWeek]) : [];
    const mids = new Set(sh.map(x => x.mid));
    const pids = it.pid === 'both' ? ['of', 'mym'] : [it.pid];
    const opts = sups.filter(s => pids.some(p => supEligible(s, p))).map(s => {
      const ov = coachOverlap(s, sh), mod = [...mids].filter(m => planState.supAssign && planState.supAssign[s.id] && planState.supAssign[s.id][m]).length;
      return {s, ov, mod};
    });
    const kept = keepFrom && keepFrom.items && keepFrom.items[key];
    if (kept) { it.sup = kept.sup || ''; it.why = kept.why; if (kept.isIn) it.isIn = true; if (kept.verdict) it.verdict = kept.verdict; if (kept.decision) it.decision = kept.decision; }
    return {key, it, opts, kept: !!kept, prevSup: prev && prev.items && prev.items[key] ? prev.items[key].sup : null};
  });
  for (const x of prep) if (x.kept && x.it.sup && load[x.it.sup] != null) load[x.it.sup]++;
  prep.sort((a, b) => a.opts.filter(o => o.ov > 0).length - b.opts.filter(o => o.ov > 0).length);
  for (const x of prep) {
    if (x.kept) continue;   // déjà attribué dans la liste en cours : on n'y touche pas
    const cap = cfg.cap;
    const keep = x.prevSup && x.opts.find(o => o.s.id === x.prevSup && load[o.s.id] < cap);
    const best = keep || x.opts.filter(o => load[o.s.id] < cap).sort((a, b) => (b.ov + b.mod * 3 - load[b.s.id] * 2) - (a.ov + a.mod * 3 - load[a.s.id] * 2))[0];
    if (best) { x.it.sup = best.s.id; x.it.why = (keepFrom && keepFrom.items ? 'entré dans la liste · ' : '') + (keep ? 'même superviseur que la semaine dernière' : best.ov ? `${best.ov} h communes${best.mod ? ` · ${plural(best.mod, 'modèle attribuée', 'modèles attribuées')}` : ''}` : 'aucune heure commune trouvée'); x.it.isIn = !!(keepFrom && keepFrom.items); load[best.s.id]++; }
    else { x.it.sup = ''; x.it.why = 'aucun superviseur disponible (plafond atteint ou focus incompatible)'; }
  }
  return out;
}

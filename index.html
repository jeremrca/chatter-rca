  const d = new Date(); set.add(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
  if (selected) set.add(selected);
  return [...set].sort().reverse().map(ym => `<option value="${ym}" ${ym === selected ? 'selected' : ''}>${esc(monthLabel(ym))}</option>`).join('');
}
function periodControls(pid, idp, p) {
  const t = p.type;
  let inputs = '';
  if (t === 'month') inputs = `<label class="f">Mois<select data-pa="${idp}">${monthOptions(pid, p.a.slice(0, 7))}</select></label>`;
  else if (t === 'half') inputs = `<label class="f">Mois<select data-pa="${idp}">${monthOptions(pid, p.a.slice(0, 7))}</select></label><label class="f">Quinzaine<select data-pb="${idp}"><option value="1" ${p.b !== '2' ? 'selected' : ''}>1 – 15</option><option value="2" ${p.b === '2' ? 'selected' : ''}>16 – fin du mois</option></select></label>`;
  else if (t === 'week') inputs = `<label class="f">Début de semaine<input type="date" data-pa="${idp}" value="${esc(p.a)}"></label>`;
  else if (t === 'day') inputs = `<label class="f">Jour<input type="date" data-pa="${idp}" value="${esc(p.a)}"></label>`;
  else inputs = `<label class="f">Du<input type="date" data-pa="${idp}" value="${esc(p.a)}"></label><label class="f">Au<input type="date" data-pb="${idp}" value="${esc(p.b)}"></label>`;

// Convertit un changement de type en valeurs par défaut cohérentes
function switchType(p, type) {

/* ---------- Données calculées pour une période ---------- */
function periodRows(pid, r) {
  const prev = ASVE.previousRange(r.start, r.end), E = entriesOf(pid);
  return modelsOf(pid).map(m => {
    const a = ASVE.aggregate(E, m.id, r.start, r.end);
    let b = ASVE.aggregate(E, m.id, prev.start, prev.end);
    // Quinzaine précédente absente (ex. seul le mois d'août est connu) : on compare au mois précédent entier
    if (!b && prev.start.slice(0, 7) === prev.end.slice(0, 7)) { const pm = ASVE.monthRange(prev.start.slice(0, 7)); if (pm.start !== prev.start || pm.end !== prev.end) b = ASVE.aggregate(E, m.id, pm.start, pm.end); }
    if (!a) return null;
    return {m, pid, fans:a.fans, revenue:a.revenue, asv:a.asv, approx:a.approx, prev:b ? b.asv : null, delta:ASVE.delta(a.asv, b ? b.asv : null)};

/* ---------- Structure des pages ASV ---------- */

function renderASV(main, P, sub) {

/* ---------- Tableau de bord (mise en page du rapport PDF) ---------- */
function asvDashboard(P, r) {
  const rows = periodRows(P.id, r);
  if (!rows.length) return `<section class="nc"><h2>Aucune donnée sur cette période</h2><p class="muted">Choisissez une autre période ci-dessus : ${plural(entriesOf(P.id).length, 'entrée enregistrée', 'entrées enregistrées')} pour ${P.name}.</p></section>`;
  const best = rows.find(x => x.asv != null);
  const E = entriesOf(P.id), ms = ASVE.months(E);
  const withFans = rows.filter(x => x.fans != null), withRev = rows.filter(x => x.revenue != null);
  const tf = withFans.length === rows.length ? withFans.reduce((a, x) => a + x.fans, 0) : null;
  const tr = withRev.length === rows.length ? withRev.reduce((a, x) => a + x.revenue, 0) : null;

/* ---------- Saisie & import ---------- */
/* ---------- Import ASV en 3 étapes : période → données → vérification ---------- */
function nextPeriod(pid) {
  const E = entriesOf(pid);
  const d = new Date(), ymNow = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  if (!E.length) return {p:{type:'month', a:ymNow, b:''}, note:'Par défaut : le mois en cours. Changez-la si besoin.'};
  const last = [...E].sort((x, y) => y.end.localeCompare(x.end) || x.start.localeCompare(y.start))[0];
  const ym = last.start.slice(0, 7), full = ASVE.monthRange(ym);
  const [y, m] = ym.split('-').map(Number), nextYm = m === 12 ? `${y + 1}-01` : `${y}-${String(m + 1).padStart(2, '0')}`;
  const note = `Suggestion : la période qui suit votre dernier import (${fmtRange(last.start, last.end)}). Changez-la si besoin.`;
  if (last.start === full.start && last.end === full.end) return {p:{type:'month', a:nextYm, b:''}, note};
  if (last.start === `${ym}-01` && last.end === `${ym}-15`) return {p:{type:'half', a:ym, b:'2'}, note};
  if (last.start === `${ym}-16` && last.end === full.end) return {p:{type:'half', a:nextYm, b:'1'}, note};
  const len = Math.round((new Date(last.end) - new Date(last.start)) / 86400000) + 1;
  return {p:{type:'custom', a:ASVE.addDays(last.end, 1), b:ASVE.addDays(last.end, len)}, note};
}
function impState(P) {
  asvUI.imp ||= {};
  if (!asvUI.imp[P.id]) { const s = nextPeriod(P.id); asvUI.imp[P.id] = {p:s.p, note:s.note, text:'', source:'', res:null, rows:[], remember:true}; }
  return asvUI.imp[P.id];
}
function impRange(st) { const r = ASVE.rangeFor(st.p.type, st.p.a, st.p.b); return r.start && r.end && r.end >= r.start ? r : null; }
function periodFromData(start, end) {
  const ym = start.slice(0, 7), full = ASVE.monthRange(ym);
  if (start === full.start && end === full.end) return {type:'month', a:ym, b:''};
  if (start === `${ym}-01` && end === `${ym}-15`) return {type:'half', a:ym, b:'1'};
  if (start === `${ym}-16` && end === full.end) return {type:'half', a:ym, b:'2'};
  return {type:'custom', a:start, b:end};
}
// Applique un résultat de lecture à l'état de l'import. Renvoie true si la période a été modifiée (dates trouvées dans les données).
function setImportResult(P, res, source) {
  const st = impState(P);
  const wasMulti = !!st.multi;
  st.source = source; st.res = res; st.rows = []; st.multi = null;
  if (res.error) return wasMulti;
  if (res.section && res.section !== P.id) { st.res = {error:`Ces données concernent ${PLATFORMS[res.section].name} : importez-les depuis Analyse ASV ${PLATFORMS[res.section].name}.`}; return false; }
  if (!res.rows.length) { st.res = {error:'Aucune ligne exploitable : vérifiez qu’il y a bien un nom de modèle et une valeur d’ASV par ligne.'}; return wasMulti; }
  const other = P.id === 'of' ? /\sMYM$/i : /\sOF$/i;
  const wrong = res.rows.filter(x => other.test(x.handle.trim()));
  res.issues ||= [];
  if (wrong.length) res.issues.push(`${plural(wrong.length, 'ligne se termine', 'lignes se terminent')} par « ${P.id === 'of' ? 'MYM' : 'OF'} » alors que vous êtes dans ${P.name} : vérifiez la plateforme.`);
  if (res.multi) {
    st.multi = res.periods;
    st.rows = res.rows.map(x => ({...x, origName:x.name, include:true}));

/* =====================================================================
   PLANNING — semaine par semaine, commun à MYM, Reveal/Telegram et OnlyFans
   Contenu (affectations, absences, notes) : modifiable par toute l'équipe → clé partagée « planning ».
   Structure (liste des modèles) : administrateurs uniquement → clé partagée « plancfg ».
   ===================================================================== */
const PLAN_SEED = {"week":"2026-09-28","models":[{"id":"mym-naya","name":"Naya","group":"mym"},{"id":"mym-thais","name":"Thais","group":"mym"},{"id":"mym-carla","name":"Carla","group":"mym"},{"id":"mym-ava-paid-subs","name":"Ava Paid Subs","group":"mym"},{"id":"mym-marie","name":"Marie","group":"mym"},{"id":"mym-flavie","name":"Flavie","group":"mym"},{"id":"mym-chloe","name":"Chloe","group":"mym"},{"id":"mym-eden","name":"Eden","group":"mym"},{"id":"mym-carla-baby","name":"Carla Baby","group":"mym"},{"id":"other-ava-reveal","name":"Ava Reveal","group":"other"},{"id":"mym-angel","name":"Angel","group":"mym"},{"id":"mym-charlotte","name":"Charlotte","group":"mym"},{"id":"mym-tia","name":"Tia","group":"mym"},{"id":"mym-steffy","name":"Steffy","group":"mym"},{"id":"mym-victoria","name":"Victoria","group":"mym"},{"id":"mym-anaelle","name":"Anaelle","group":"mym"},{"id":"other-lila-telegram","name":"Lila Telegram","group":"other"},{"id":"of-naya","name":"Naya","group":"of"},{"id":"of-angel","name":"Angel","group":"of"},{"id":"of-carla-baby","name":"Carla Baby","group":"of"},{"id":"of-steffy","name":"Steffy","group":"of"},{"id":"of-ava","name":"Ava","group":"of"},{"id":"of-mae","name":"Mae","group":"of"},{"id":"of-thais","name":"Thaïs","group":"of"},{"id":"of-flavie","name":"Flavie","group":"of"},{"id":"of-carla-trans","name":"Carla Trans","group":"of"},{"id":"of-marie","name":"Marie","group":"of"},{"id":"of-eden","name":"Eden","group":"of"},{"id":"of-lila","name":"Lila","group":"of"}]};
const PLAN_GROUPS = [
  {id:'mym', label:'MYM', color:'#22c55e', ink:'#062b14'},
  {id:'other', label:'Reveal / Telegram', color:'#a855f7', ink:'#ffffff'},
  {id:'of', label:'OnlyFans', color:'#eab308', ink:'#2a1d02'}
];
const PLAN_SHIFTS = ['04 - 10', '10 - 16', '16 - 22', '22 - 04'];
const PLAN_DAYS = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
const PLAN_DAYS_LONG = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
const NEW_SHIFTS = 5;   // un nouveau chatter est mis en couleur sur ses 5 premiers shifts travaillés
const LS_PLAN = 'rca.plan.v1', LS_PLANCFG = 'rca.plancfg.v1';
const DEFAULT_PLANCFG = {models: PLAN_SEED.models.map((m, i) => ({...m, order: i}))};
let planState = (() => { const s = lsGet(LS_PLAN, null) || {}; s.weeks ||= {}; s.chatters ||= {}; return s; })();
let planCfgSaved = lsGet(LS_PLANCFG, null);
const planCfg = () => planCfgSaved && Array.isArray(planCfgSaved.models) && planCfgSaved.models.length ? planCfgSaved : DEFAULT_PLANCFG;
const savePlan = () => { lsSet(LS_PLAN, planState); Sync.changed('planning'); };
const savePlanCfg = () => { lsSet(LS_PLANCFG, planCfgSaved); Sync.changed('plancfg'); };
const planUI = {week:null, day:null, q:'', tab:'week'};
/* ---------- Jours OFF (un ou plusieurs jours fixes par chatter) ---------- */
const DAY_WORDS = {lundi:0, lun:0, mardi:1, mar:1, mercredi:2, mer:2, jeudi:3, jeu:3, vendredi:4, ven:4, samedi:5, sam:5, dimanche:6, dim:6};
const offKey = n => normName(n).replace(/\s+(mym|of)$/, '');
const dayOff = () => (planState.dayoff ||= {});
function offOn(name, d) { if (!planState.dayoff) return false; return String(name).split('/').some(x => { const o = planState.dayoff[offKey(x.trim())]; return o && (o.days || []).includes(+d); }); }
function parseDays(txt) {
  const t = normName(txt);
  if (!t || /pas de off|aucun|^non$|^-$/.test(t)) return [];
  return [...new Set(t.split(/[^a-z]+/).map(w => DAY_WORDS[w]).filter(x => x != null))].sort();
}
// Liste collée depuis Excel : « Chatter | Jour OFF | Note » (tabulations, points-virgules ou espaces)
function parseOffList(text) {
  const out = [], skipped = [];
  for (const raw of String(text).replace(/\r/g, '').split('\n')) {
    const line = raw.trim(); if (!line) continue;
    let cols = line.includes('\t') ? raw.split('\t') : line.includes(';') ? line.split(';') : null;
    if (!cols) { const m = line.match(/^(.+?)\s+((?:pas de off)|(?:(?:lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)\b[\s,\/et]*)+)(.*)$/i); cols = m ? [m[1], m[2], m[3]] : [line]; }
    cols = cols.map(c => c.trim());
    const name = cols[0]; if (!name) continue;
    if (/^(name|nom|chatter|chatteur)s?$/i.test(name)) continue;   // ligne d'en-têtes
    const daysTxt = cols[1] || '', note = (cols[2] || '').trim();
    out.push({name, days: parseDays(daysTxt), none: /pas de off/i.test(daysTxt), unknown: !!daysTxt.trim() && !parseDays(daysTxt).length && !/pas de off/i.test(daysTxt), note});
  }
  return out;
}
const normName = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const cellKey = (d, s, mid) => `${d}|${s}|${mid}`;

const sortModels = list => list.sort((a, b) => groupIdx(a.group) - groupIdx(b.group) || (a.order ?? 0) - (b.order ?? 0) || a.name.localeCompare(b.name, 'fr'));

// Chacune a une date de début et une date de fin facultatives : une modèle lancée un mardi n'apparaît qu'à partir de ce mardi,
// puis dès le lundi les semaines suivantes ; les semaines passées ne changent pas.
function planModelsMap() {
  if (!planState.models || !Object.keys(planState.models).length)
    planState.models = Object.fromEntries(planCfg().models.map((m, i) => [m.id, {name: m.name, group: m.group, order: m.order ?? i, ...(m.archived ? {end: '2000-01-01'} : {})}]));
  return planState.models;
}
const allModels = () => sortModels(Object.entries(planModelsMap()).map(([id, m]) => ({id, ...m})));
const modelActiveOn = (m, date) => (!m.start || date >= m.start) && (!m.end || date <= m.end);
const activeModels = () => allModels();
const modelLabel = m => m.group === 'mym' ? `${m.name} MYM` : m.group === 'of' ? `${m.name} OF` : m.name;
const weekOf = wk => planState.weeks[wk];
// Qui travaille réellement : le remplaçant s'il y en a un, sinon le prévu s'il n'est pas absent
const workerOf = e => e.r ? e.r : (e.a ? null : e.n);

/* ---------- Nouveaux chatters : 5 premiers shifts travaillés, dans l'ordre chronologique ---------- */
function newHighlights() {
  const flagged = new Map(Object.entries(planState.chatters || {}).filter(([, c]) => c && c.isNew).map(([k, c]) => [k, c]));
  const out = new Map();
  if (!flagged.size) return out;
  const counts = {};
  const models = activeModels();
  for (const wk of Object.keys(planState.weeks).sort()) {
    const W = planState.weeks[wk];
    for (let d = 0; d < 7; d++) {
      const date = addDaysIso(wk, d);
      for (let s = 0; s < PLAN_SHIFTS.length; s++) {
        const seen = new Set();
        for (const m of models) for (const e of (W.cells[cellKey(d, s, m.id)] || [])) {
          const w = workerOf(e); if (!w) continue;
          for (const one of w.split('/').map(x => x.trim()).filter(Boolean)) {
            const k = normName(one), c = flagged.get(k);
            if (!c || seen.has(k) || (c.since && date < c.since)) continue;
            seen.add(k); counts[k] = (counts[k] || 0) + 1;
            if (counts[k] <= NEW_SHIFTS) out.set(`${wk}|${d}|${s}|${k}`, counts[k]);
          }
        }
      }
    }
  }
  return out;
}
const isFlaggedNew = name => !!(planState.chatters[normName(name)] || {}).isNew;
function knownChatters() {
  const set = new Map();
  for (const W of Object.values(planState.weeks)) for (const list of Object.values(W.cells || {})) for (const e of list) for (const n of [e.n, ...(e.r ? e.r.split('/') : [])]) { const t = (n || '').trim(); if (t) set.set(normName(t), t); }
  for (const p of store.periods) for (const r of p.rows) if (!set.has(normName(r.name))) set.set(normName(r.name), r.name);
  return [...set.values()].sort((a, b) => a.localeCompare(b, 'fr'));
}

/* ---------- Semaines ---------- */
const thisMonday = () => mondayOf(isoOf(new Date()));
// Nom d'un planning, comme les onglets Excel : « Semaine du 28/09 », « Semaine du 05/10 »…
const planWeekLabel = wk => { const d = parseDate(wk); const y = d.getFullYear() !== new Date().getFullYear() ? `/${d.getFullYear()}` : ''; return `Semaine du ${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}${y}`; };
function planWeekKey() {
  if (!planUI.week) { const ks = Object.keys(planState.weeks).sort(); const t = thisMonday(); planUI.week = planState.weeks[t] ? t : (ks.length ? ks[ks.length - 1] : t); }
  return planUI.week;
}
function planDay(wk) {
  if (planUI.day == null) { const t = isoOf(new Date()); planUI.day = t >= wk && t <= addDaysIso(wk, 6) ? (new Date().getDay() + 6) % 7 : 0; }
  return planUI.day;
}
function createWeek(wk, fromWk) {
  const src = fromWk && planState.weeks[fromWk];
  const cells = {};
  // On reprend les chatters prévus, sans absences, remplacements ni notes
  const models = planModelsMap();
  if (src) for (const [k, list] of Object.entries(src.cells || {})) {
    const [d, , mid] = k.split('|'), m = models[mid];
    if (m && !modelActiveOn(m, addDaysIso(wk, +d))) continue;   // modèle arrêtée (ou pas encore lancée) ce jour-là
    const l = list.map(e => ({n: e.n})); if (l.length) cells[k] = l;
  }
  planState.weeks[wk] = {cells, notes: {}, createdAt: Date.now(), from: fromWk || null};

}

const xmlText = (X, z, path) => { const f = X.CFB.find(z, path) || X.CFB.find(z, '/' + path) || X.CFB.find(z, 'Root Entry/' + path); if (!f || !f.content) return ''; return new TextDecoder('utf-8').decode(f.content instanceof Uint8Array ? f.content : new Uint8Array(f.content)); };

function planWeekFromSheetName(name, today = new Date()) {

  else if (g.length === 4) { dd = +g.slice(0, 2); mm = +g.slice(2); }
  else if (g.length === 3) { dd = +g.slice(0, 1); mm = +g.slice(1); }

  if (dd < 1 || dd > 31 || mm < 1 || mm > 12) return null;

  const limit = new Date(today); limit.setDate(limit.getDate() + 60);

function unavailability(wk) {

    return out; };
  const draw = () => {

      <div class="un-days" style="margin-top:12px"><label class="check"><input type="radio" name="un-mode" value="abs" ${st.mode === 'abs' ? 'checked' : ''}> Marquer absent (prénom en rouge, on peut ajouter un remplaçant)</label>
        <label class="check"><input type="radio" name="un-mode" value="del" ${st.mode === 'del' ? 'checked' : ''}> Retirer du planning</label></div>
      <p class="hint" id="un-prev" style="margin:12px 0 0"></p>
      <div class="acts"><button class="btn ghost" data-a="0" type="button">Annuler</button><button class="btn primary" data-a="1" type="button" id="un-go" disabled>Appliquer</button></div></div>`;
  };
  const preview = () => {
    const sl = slots();
    bg.querySelector('#un-prev').innerHTML = st.name && st.days.size ? (sl.length ? `${plural(sl.length, 'créneau trouvé', 'créneaux trouvés')} : ${sl.slice(0, 8).map(x => `${PLAN_DAYS[x.d]} ${PLAN_SHIFTS[x.s]} ${esc(modelLabel(x.m))}`).join(' · ')}${sl.length > 8 ? '…' : ''}` : 'Aucun créneau trouvé pour ce chatter sur ces jours.') : 'Choisissez un chatter et des jours.';
    bg.querySelector('#un-go').disabled = !sl.length;
  };
  draw(); preview();
  bg.addEventListener('input', e => { if (e.target.id === 'un-name') { st.name = e.target.value; preview(); } });
  bg.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.ud != null) t.checked ? st.days.add(+t.dataset.ud) : st.days.delete(+t.dataset.ud);
    if (t.name === 'un-mode') st.mode = t.value;
    preview();
  });
  bg.addEventListener('keydown', e => { if (e.key === 'Escape') bg.remove(); });
  bg.addEventListener('click', e => {
    if (e.target === bg) { bg.remove(); return; }
    const a = e.target.closest('[data-a]'); if (!a) return;
    if (a.dataset.a === '1') {
      const sl = slots();
      const byKey = {};
      for (const x of sl) (byKey[cellKey(x.d, x.s, x.m.id)] ||= []).push(x.i);
      for (const [k, idx] of Object.entries(byKey)) {
        if (st.mode === 'abs') idx.forEach(i => { W.cells[k][i].a = 1; });
        else { W.cells[k] = W.cells[k].filter((_, i) => !idx.includes(i)); if (!W.cells[k].length) delete W.cells[k]; }
      }

    }

  });

}

function bindPlanModels(wk, d) {
  const panel = document.getElementById('pm-panel'); if (!panel) return;
  panel.addEventListener('toggle', () => { planUI.modelsOpen = panel.open; });
  const map = planModelsMap();
  const done = () => { savePlan(); render(); };
  panel.querySelectorAll('[data-mg]').forEach(el => el.addEventListener('change', () => { map[el.dataset.mg].group = el.value; done(); }));
  panel.querySelectorAll('[data-mn]').forEach(el => el.addEventListener('change', () => { if (el.value.trim()) { map[el.dataset.mn].name = el.value.trim(); done(); } }));
  panel.querySelectorAll('[data-ms]').forEach(el => el.addEventListener('change', () => { const m = map[el.dataset.ms]; if (el.value) m.start = el.value; else delete m.start; done(); }));
  panel.querySelectorAll('[data-me]').forEach(el => el.addEventListener('change', () => {
    const id = el.dataset.me, m = map[id];
    if (!el.value) { delete m.end; return done(); }
    m.end = el.value;
    // Les cases recopiées après le dernier jour sont vidées (seulement après cette date)
    let removed = 0;
    for (const [wkey, W] of Object.entries(planState.weeks)) for (const k of Object.keys(W.cells || {})) {
      const [dd, , mid] = k.split('|');
      if (mid === id && addDaysIso(wkey, +dd) > m.end) { delete W.cells[k]; removed++; }
    }
    if (removed) toast(`${m.name} : dernier jour le ${fmtDayFr(m.end)}, ${plural(removed, 'case vidée', 'cases vidées')} après cette date.`);
    done();
  }));
  const move = (id, dir) => { const same = allModels().filter(x => x.group === map[id].group); same.forEach((x, i) => { map[x.id].order = i; }); const i = same.findIndex(x => x.id === id), j = i + dir; if (j < 0 || j >= same.length) return; map[same[i].id].order = j; map[same[j].id].order = i; done(); };
  panel.querySelectorAll('[data-mu]').forEach(el => el.addEventListener('click', () => move(el.dataset.mu, -1)));
  panel.querySelectorAll('[data-md]').forEach(el => el.addEventListener('click', () => move(el.dataset.md, 1)));
  document.getElementById('pm-add').addEventListener('click', () => addModelModal(addDaysIso(wk, d)));
}

/* =====================================================================
   PRIMES & PÉNALITÉS — pénalités, réattributions de ventes et primes, semaine par semaine
   Partagé avec toute l'équipe (clé « suivi »). Les semaines de plus de 5 semaines sont supprimées automatiquement.
   ===================================================================== */
const LS_SUIVI = 'rca.suivi.v1', LS_SUIVI_SUP = 'rca.suivi.sup';
const SUIVI_KEEP_WEEKS = 5;
let suiviState = (() => { const s = lsGet(LS_SUIVI, null) || {}; s.weeks ||= {}; return s; })();
const saveSuivi = () => { lsSet(LS_SUIVI, suiviState); Sync.changed('suivi'); };
const suiviUI = {week:null, tab:'pen', q:''};
const SUIVI_KINDS = {
  pen: {label:'Pénalités', one:'pénalité', add:'Ajouter une pénalité', color:'#f0605e', pts:'Malus'},
  rea: {label:'Réattributions', one:'réattribution', add:'Ajouter une réattribution', color:'#f2a43c'},
  pri: {label:'Primes', one:'prime', add:'Ajouter une prime', color:'#45d08f', pts:'Bonus'}
};
const suiviWeek = wk => (suiviState.weeks[wk] ||= {pen:{}, rea:{}, pri:{}});
const suiviList = (wk, kind) => Object.entries((suiviState.weeks[wk] || {})[kind] || {}).map(([id, e]) => ({id, ...e})).sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.at || 0) - (a.at || 0));
const fmtDateFr = iso => iso ? parseDate(iso).toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric'}) : '';
const saleAmount = s => { const nums = String(s || '').replace(/(\d)\s+(?=\d{3}\b)/g, '$1').match(/\d+(?:[.,]\d+)?/g); return nums ? nums.reduce((a, n) => a + parseFloat(n.replace(',', '.')), 0) : 0; };

// Suppression automatique : on garde la semaine en cours et les 5 précédentes
function purgeSuivi() {
  const cutoff = addDaysIso(mondayOf(isoOf(new Date())), -7 * SUIVI_KEEP_WEEKS);
  const old = Object.keys(suiviState.weeks).filter(k => k < cutoff);
  if (old.length) { old.forEach(k => delete suiviState.weeks[k]); saveSuivi(); }
}
function suiviSuggestions() {
  const s = {chatter:new Map(), sup:new Map(), comment:new Map(), model:new Map(), type:new Map()};
  const add = (m, v) => { const t = String(v || '').trim(); if (t) m.set(t.toLowerCase(), t); };
  for (const W of Object.values(suiviState.weeks)) for (const kind of ['pen', 'rea', 'pri']) for (const e of Object.values(W[kind] || {})) {
    add(s.chatter, e.chatter); add(s.sup, e.sup); add(s.comment, e.comment); add(s.model, e.model); add(s.type, e.type);
  }
  for (const n of knownChatters()) add(s.chatter, n);
  for (const m of allModels()) add(s.model, modelLabel(m));
  ['Média', 'Tips', 'Média + tips', 'Custom', 'Sextape'].forEach(t => add(s.type, t));
  ['Prime CUSTOM', 'Prime CAM'].forEach(t => add(s.comment, t));
  const sorted = m => [...m.values()].sort((a, b) => a.localeCompare(b, 'fr'));
  return {chatter:sorted(s.chatter), sup:sorted(s.sup), comment:sorted(s.comment), model:sorted(s.model), type:sorted(s.type)};
}

/* ---------- Page ---------- */
function renderSuivi(main) {
  purgeSuivi();
  const wk = suiviUI.week ||= mondayOf(isoOf(new Date()));
  const W = suiviState.weeks[wk] || {pen:{}, rea:{}, pri:{}};
  const counts = {pen: Object.keys(W.pen || {}).length, rea: Object.keys(W.rea || {}).length, pri: Object.keys(W.pri || {}).length};
  const tab = suiviUI.tab;
  const weeksAvail = [...new Set([...Object.keys(suiviState.weeks), mondayOf(isoOf(new Date())), wk])].sort().reverse();
  const head = `<div class="top"><h1><span class="pbadge lg sui" aria-hidden="true">±</span><span>Primes & Pénalités</span></h1>
    <div class="picker viewpick"><button class="btn ghost small-btn" id="sw-prev" type="button" aria-label="Semaine précédente">‹</button>
      <select id="sw-sel">${weeksAvail.map(k => `<option value="${k}" ${k === wk ? 'selected' : ''}>${esc(planWeekLabel(k))}</option>`).join('')}</select>
      <button class="btn ghost small-btn" id="sw-next" type="button" aria-label="Semaine suivante">›</button></div></div>`;
  const tabs = `<div class="ptopt sui-tabs" role="tablist">${['pen', 'rea', 'pri'].map(k => `<button type="button" class="${tab === k ? 'on' : ''}" data-stab="${k}" style="--tc:${SUIVI_KINDS[k].color}"><span class="sdot"></span>${SUIVI_KINDS[k].label} <span class="sub">${counts[k] || ''}</span></button>`).join('')}<button type="button" class="${tab === 'bilan' ? 'on' : ''}" data-stab="bilan">Bilan de la semaine</button></div>`;
  let body;
  if (tab === 'bilan') body = suiviBilanHTML(wk);
  else {
    const K = SUIVI_KINDS[tab], q = normName(suiviUI.q);
    const rows = suiviList(wk, tab).filter(e => !q || normName(e.chatter).includes(q) || normName(e.comment).includes(q));
    const total = tab === 'rea' ? rows.reduce((a, e) => a + saleAmount(e.sale), 0) : rows.reduce((a, e) => a + (+e.pts || 0), 0);
    const cols = tab === 'rea'
      ? [['Date', e => fmtDateFr(e.date)], ['Type', e => esc(e.type || '')], ['Vente', e => `<strong>${esc(e.sale || '')}</strong>`], ['Fan', e => `<span class="fanc">${esc(e.fan || '')}</span>`], ['ID', e => `<span class="muted">${esc(e.fanId || '')}</span>`], ['Modèle', e => esc(e.model || '')], ['Chatteur', e => `<strong>${esc(e.chatter || '')}</strong>`], ['Commentaire', e => esc(e.comment || '')], ['Superviseur', e => esc(e.sup || '')]]
      : [['Date', e => fmtDateFr(e.date)], [K.pts, e => `<span class="ptsb ${tab}">${tab === 'pen' ? '−' : '+'}${esc(e.pts)}</span>`], ['Chatteur', e => `<strong>${esc(e.chatter || '')}</strong>`], ['Commentaire', e => esc(e.comment || '')], ['Superviseur', e => esc(e.sup || '')]];
    body = `<section class="panel sui-card" style="--tc:${K.color}">
      <div class="sui-bar"><button class="btn primary" id="s-add" type="button">+ ${K.add}</button>
        <input type="search" id="s-q" placeholder="Rechercher un chatteur ou un commentaire" value="${esc(suiviUI.q)}">
        <span class="muted sui-total">${rows.length ? plural(rows.length, K.one, K.label.toLowerCase()) : ''}${rows.length ? ` · ${tab === 'rea' ? `${nf(total, 0, 2)} au total` : `${tab === 'pen' ? '−' : '+'}${nf(total, 0, 1)} pts`}` : ''}</span>
        ${rows.length ? `<button class="btn ghost" id="s-csv" type="button">${icon('download')}CSV</button>` : ''}</div>
      ${rows.length ? `<div class="tbl-wrap" style="max-height:none"><table class="sui-table"><thead><tr>${cols.map(c => `<th>${c[0]}</th>`).join('')}</tr></thead><tbody>
        ${rows.map(e => `<tr class="click" data-sid="${e.id}" tabindex="0" title="Cliquer pour modifier">${cols.map(c => `<td>${c[1](e)}</td>`).join('')}</tr>`).join('')}
      </tbody></table></div>`
      : `<div class="empty" style="padding:34px 10px"><div style="font-size:15px;color:var(--text);font-weight:600">Aucune ${K.one} ${q ? 'trouvée' : `pour la ${esc(planWeekLabel(wk))}`}</div><div class="hint" style="margin-top:4px">${q ? 'Essayez une autre recherche.' : `Cliquez sur « ${K.add} » pour en saisir une.`}</div></div>`}
    </section>`;
  }
  main.innerHTML = head + tabs + `<div class="stack">${body}
    <p class="hint" style="text-align:center;font-size:12px;margin:0">Partagé avec toute l'équipe · les ${SUIVI_KEEP_WEEKS} dernières semaines sont conservées, les plus anciennes sont supprimées automatiquement.</p></div>`;
  const goW = k => { suiviUI.week = k; render(); };
  document.getElementById('sw-prev').addEventListener('click', () => goW(addDaysIso(wk, -7)));
  document.getElementById('sw-next').addEventListener('click', () => goW(addDaysIso(wk, 7)));
  document.getElementById('sw-sel').addEventListener('change', e => goW(e.target.value));
  main.querySelectorAll('[data-stab]').forEach(b => b.addEventListener('click', () => { suiviUI.tab = b.dataset.stab; render(); }));
  if (tab !== 'bilan') {
    document.getElementById('s-add').addEventListener('click', () => suiviEdit(wk, tab, null));
    const qi = document.getElementById('s-q'); let t;
    qi.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { suiviUI.q = qi.value; render(); const n = document.getElementById('s-q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); });
    main.querySelectorAll('[data-sid]').forEach(tr => { const open = () => suiviEdit(wk, tab, tr.dataset.sid); tr.addEventListener('click', open); tr.addEventListener('keydown', e => { if (e.key === 'Enter') open(); }); });
    document.getElementById('s-csv')?.addEventListener('click', () => suiviCSV(wk, tab));
  } else {
    main.querySelectorAll('[data-bil]').forEach(tr => tr.addEventListener('click', () => { suiviUI.q = tr.dataset.bil; suiviUI.tab = tr.dataset.tab || 'pen'; render(); }));
    document.getElementById('s-csv-all')?.addEventListener('click', () => suiviCSV(wk, 'bilan'));
  }
}

/* ---------- Bilan par chatteur ---------- */
function suiviBilanData(wk) {
  const by = new Map();
  const row = n => { const k = normName(n); if (!by.has(k)) by.set(k, {name: n, mal: 0, nPen: 0, bon: 0, nPri: 0, nRea: 0, rea: 0}); return by.get(k); };
  for (const e of suiviList(wk, 'pen')) { const r = row(e.chatter); r.mal += +e.pts || 0; r.nPen++; }
  for (const e of suiviList(wk, 'pri')) { const r = row(e.chatter); r.bon += +e.pts || 0; r.nPri++; }
  for (const e of suiviList(wk, 'rea')) { const r = row(e.chatter); r.nRea++; r.rea += saleAmount(e.sale); }
  return [...by.values()].map(r => ({...r, net: r.bon - r.mal})).sort((a, b) => a.net - b.net || b.nRea - a.nRea || a.name.localeCompare(b.name, 'fr'));
}
function suiviBilanHTML(wk) {
  const rows = suiviBilanData(wk);
  const T = rows.reduce((a, r) => ({mal: a.mal + r.mal, bon: a.bon + r.bon, nPen: a.nPen + r.nPen, nPri: a.nPri + r.nPri, nRea: a.nRea + r.nRea, rea: a.rea + r.rea}), {mal:0, bon:0, nPen:0, nPri:0, nRea:0, rea:0});
  return `<section class="stats sui-stats">
      <div class="stat"><div class="k">Pénalités</div><div class="v" style="color:#f87171">−${nf(T.mal, 0, 1)} pts</div><div class="d">${plural(T.nPen, 'pénalité', 'pénalités')}</div></div>
      <div class="stat"><div class="k">Primes</div><div class="v" style="color:#4ade80">+${nf(T.bon, 0, 1)} pts</div><div class="d">${plural(T.nPri, 'prime', 'primes')}</div></div>
      <div class="stat"><div class="k">Réattributions</div><div class="v" style="color:#fbbf24">${T.nRea}</div><div class="d">${nf(T.rea, 0, 2)} au total</div></div>
      <div class="stat"><div class="k">Chatteurs concernés</div><div class="v">${rows.length}</div><div class="d">${esc(planWeekLabel(wk))}</div></div>
    </section>
    <section class="panel"><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px"><h2 style="margin:0">Bilan par chatteur</h2><span class="hint" style="margin:0">Du solde le plus négatif au plus positif · cliquez sur une ligne pour voir le détail</span>
      ${rows.length ? `<button class="btn ghost" id="s-csv-all" type="button" style="margin-left:auto">${icon('download')}Exporter le bilan</button>` : ''}</div>
      ${rows.length ? `<div class="tbl-wrap" style="max-height:none"><table><thead><tr><th>Chatteur</th><th class="num">Malus</th><th class="num">Bonus</th><th class="num">Solde</th><th class="num">Réattributions</th></tr></thead><tbody>
        ${rows.map(r => `<tr class="click" data-bil="${esc(r.name)}" data-tab="${r.nPen ? 'pen' : r.nRea ? 'rea' : 'pri'}"><td><strong>${esc(r.name)}</strong></td>
          <td class="num">${r.nPen ? `<span class="ptsb pen">−${nf(r.mal, 0, 1)}</span> <span class="sub">${r.nPen}×</span>` : '<span class="muted">—</span>'}</td>
          <td class="num">${r.nPri ? `<span class="ptsb pri">+${nf(r.bon, 0, 1)}</span> <span class="sub">${r.nPri}×</span>` : '<span class="muted">—</span>'}</td>
          <td class="num"><strong class="${r.net < 0 ? 'sc-lo' : r.net > 0 ? 'sc-hi' : ''}">${r.net > 0 ? '+' : ''}${nf(r.net, 0, 1)}</strong></td>
          <td class="num">${r.nRea ? `${r.nRea} <span class="sub">(${nf(r.rea, 0, 2)})</span>` : '<span class="muted">—</span>'}</td></tr>`).join('')}
      </tbody></table></div>` : `<div class="empty" style="padding:30px 10px">Rien de saisi pour la ${esc(planWeekLabel(wk))}.</div>`}
    </section>`;
}

/* ---------- Saisie / modification ---------- */
function suiviEdit(wk, kind, id) {
  const K = SUIVI_KINDS[kind], sug = suiviSuggestions();
  const today = isoOf(new Date());
  const cur = id ? {...suiviState.weeks[wk][kind][id]} : {date: today >= wk && today <= addDaysIso(wk, 6) ? today : wk, sup: lsGet(LS_SUIVI_SUP, '') || '', pts: kind === 'pen' ? 5 : kind === 'pri' ? 10 : undefined};
  const dl = (idn, list) => `<datalist id="${idn}">${list.map(v => `<option value="${esc(v)}">`).join('')}</datalist>`;
  const f = (label, html, wide) => `<label class="sf ${wide ? 'wide' : ''}"><span>${label}</span>${html}</label>`;
  const inp = (name, extra = '') => `<input type="text" name="${name}" value="${esc(cur[name] ?? '')}" ${extra}>`;
  const quick = kind === 'pen' ? [2, 5, 10] : kind === 'pri' ? [5, 10, 20] : [];
  const fields = kind === 'rea'
    ? f('Date', `<input type="date" name="date" value="${esc(cur.date || '')}" required>`) + f('Type', inp('type', 'list="sd-type" placeholder="Média, Tips…"')) + f('Vente', inp('sale', 'placeholder="40 ou 25 tips + 100 ppv"'))
      + f('Fan', inp('fan', 'placeholder="Nom du fan"')) + f('ID du fan', inp('fanId', 'placeholder="@u507578546"')) + f('Modèle', inp('model', 'list="sd-model" placeholder="Alice OF"'))
      + f('Chatteur', inp('chatter', 'list="sd-chatter" required')) + f('Superviseur', inp('sup', 'list="sd-sup"')) + f('Commentaire', `<textarea name="comment" rows="2" placeholder="non respect du pricing…">${esc(cur.comment || '')}</textarea>`, true)
    : f('Date', `<input type="date" name="date" value="${esc(cur.date || '')}" required>`)
      + f(K.pts + ' (points)', `<div class="qrow">${quick.map(v => `<button type="button" class="qpt ${+cur.pts === v ? 'on' : ''}" data-qpt="${v}">${kind === 'pen' ? '−' : '+'}${v}</button>`).join('')}<input type="number" name="pts" min="0" step="any" value="${esc(cur.pts ?? '')}" style="width:90px"></div>`)
      + f('Chatteur', inp('chatter', 'list="sd-chatter" required'))
      + f('Superviseur', inp('sup', 'list="sd-sup"'))
      + f('Commentaire', `${kind === 'pri' ? `<div class="qrow" style="margin-bottom:6px">${['Prime CUSTOM', 'Prime CAM'].map(v => `<button type="button" class="qpt" data-qc="${v}">${v}</button>`).join('')}</div>` : ''}<textarea name="comment" rows="2" placeholder="${kind === 'pen' ? 'Inactif, mauvais prix de sextape…' : 'Prime CUSTOM, Prime CAM…'}">${esc(cur.comment || '')}</textarea>`, true);
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal sui-modal" role="dialog" aria-modal="true" style="--tc:${K.color}"><h3><span class="sdot"></span>${id ? `Modifier la ${K.one}` : K.add}</h3>
    <form class="sform" novalidate>${fields}</form>
    ${dl('sd-chatter', sug.chatter)}${dl('sd-sup', sug.sup)}${dl('sd-model', sug.model)}${dl('sd-type', sug.type)}
    <div id="s-err" class="sc-lo" style="min-height:18px;font-size:13px;margin-top:6px"></div>
    <div class="acts">${id ? '<button class="btn danger" data-a="del" type="button" style="margin-right:auto">Supprimer</button>' : ''}<button class="btn ghost" data-a="0" type="button">Annuler</button><button class="btn primary" data-a="1" type="button">${id ? 'Enregistrer' : 'Ajouter'}</button></div></div>`;
  const form = bg.querySelector('form');
  const close = () => bg.remove();
  bg.addEventListener('keydown', e => { if (e.key === 'Escape') close(); if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); bg.querySelector('[data-a="1"]').click(); } });
  bg.addEventListener('click', async e => {
    if (e.target === bg) return close();
    const q = e.target.closest('[data-qpt]'); if (q) { form.pts.value = q.dataset.qpt; bg.querySelectorAll('[data-qpt]').forEach(b => b.classList.toggle('on', b === q)); return; }
    const qc = e.target.closest('[data-qc]'); if (qc) { form.comment.value = qc.dataset.qc; return; }
    const a = e.target.closest('[data-a]'); if (!a) return;
    if (a.dataset.a === '0') return close();
    if (a.dataset.a === 'del') {
      if (!(await modal(`Supprimer cette ${K.one}`, `<p>Supprimer la ${K.one} de <strong>${esc(cur.chatter || '')}</strong> du ${esc(fmtDateFr(cur.date))} ? Cette action est définitive.</p>`, 'Supprimer'))) return;
      delete suiviState.weeks[wk][kind][id]; saveSuivi(); close(); toast(`${K.one.charAt(0).toUpperCase() + K.one.slice(1)} supprimée.`); render(); return;
    }
    const data = Object.fromEntries(new FormData(form).entries());
    for (const k of Object.keys(data)) data[k] = String(data[k]).trim();
    const err = !data.date ? 'Choisissez une date.' : !data.chatter ? 'Indiquez le chatteur.' : kind !== 'rea' && !(+data.pts > 0) ? `Indiquez le ${K.pts.toLowerCase()} en points.` : '';
    if (err) { bg.querySelector('#s-err').textContent = err; return; }
    if (kind !== 'rea') data.pts = +data.pts;
    const clean = Object.fromEntries(Object.entries(data).filter(([, v]) => v !== ''));
    clean.at = id ? (cur.at || Date.now()) : Date.now();
    if (data.sup) lsSet(LS_SUIVI_SUP, data.sup);
    const target = mondayOf(data.date);
    if (id) delete suiviState.weeks[wk][kind][id];
    suiviWeek(target)[kind][id || 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6)] = clean;
    saveSuivi(); close();
    if (target !== wk) { suiviUI.week = target; toast(`Enregistrée dans la ${planWeekLabel(target)} (selon sa date).`); } else toast(id ? 'Modification enregistrée.' : `${K.one.charAt(0).toUpperCase() + K.one.slice(1)} ajoutée.`);
    render();
  });
  document.body.appendChild(bg);
  (bg.querySelector('[name="chatter"]') || bg.querySelector('input')).focus();
}

/* ---------- Export CSV ---------- */
function suiviCSV(wk, kind) {
  const w = planWeekLabel(wk).replace('Semaine du ', '').replace(/\//g, '-');
  if (kind === 'bilan') {
    const head = ['Chatteur','Malus (pts)','Nb pénalités','Bonus (pts)','Nb primes','Solde','Nb réattributions','Montant réattribué'];
    return saveFile(`bilan-semaine-${w}.csv`, [head, ...suiviBilanData(wk).map(r => [r.name, r.mal, r.nPen, r.bon, r.nPri, r.net, r.nRea, Math.round(r.rea * 100) / 100])].map(l => l.map(csvCell).join(';')).join('\r\n'));
  }
  const rows = suiviList(wk, kind);
  const spec = kind === 'rea' ? [['Date', 'date'], ['Type', 'type'], ['Vente', 'sale'], ['Fan', 'fan'], ['ID', 'fanId'], ['Modèle', 'model'], ['Chatteur', 'chatter'], ['Commentaire', 'comment'], ['Superviseur', 'sup']]
    : [['Date', 'date'], [SUIVI_KINDS[kind].pts, 'pts'], ['Chatteur', 'chatter'], ['Commentaire', 'comment'], ['Superviseur', 'sup']];
  saveFile(`${SUIVI_KINDS[kind].label.toLowerCase()}-semaine-${w}.csv`, [spec.map(s => s[0]), ...rows.map(e => spec.map(s => s[1] === 'date' ? fmtDateFr(e.date) : e[s[1]] ?? ''))].map(l => l.map(csvCell).join(';')).join('\r\n'));
}

/* =====================================================================
   GESTION CAM / CUSTOM — demandes personnalisées, suivi « faite », rappels des demandes en attente
   Partagé avec toute l'équipe (clé « cams »). Une demande en attente reste visible tant qu'elle n'est pas faite.
   ===================================================================== */
const LS_CAMS = 'rca.cams.v1', LS_CAMS_REMIND = 'rca.cams.remind';
let camsState = (() => { const s = lsGet(LS_CAMS, null) || {}; s.items ||= {}; return s; })();
const saveCams = () => { lsSet(LS_CAMS, camsState); Sync.changed('cams'); };
const camsUI = {tab:'todo', week:null, type:'all', model:'', q:''};
const CAM_TYPES = [['custom', 'Custom', '#a78bfa'], ['cam', 'Cam', '#38bdf8'], ['snap', 'Snap', '#facc15']];
const camType = t => CAM_TYPES.find(x => x[0] === t) || ['autre', t || 'Autre', '#94a3b8'];
const camList = () => Object.entries(camsState.items).map(([id, e]) => ({id, ...e}));
const camCur = e => /\bof\b/i.test(e.model || '') ? '$' : /\bmym\b/i.test(e.model || '') ? '€' : '';
const camMoney = (v, c) => v == null || v === '' ? '—' : `${nf(+v, 0, 2)}${c ? '\u00a0' + c : ''}`;
const camRest = e => Math.max(0, (+e.price || 0) - (+e.paid || 0));
const daysSince = iso => Math.max(0, Math.round((parseDate(isoOf(new Date())) - parseDate(iso)) / 86400000));
function camsPending() {
  const thisMon = mondayOf(isoOf(new Date()));
  const todo = camList().filter(e => (e.status || 'todo') === 'todo');
  return {all: todo, old: todo.filter(e => e.date < thisMon)};
}
// Rappel : une fois par jour et par navigateur, s'il reste des demandes en attente
function camsReminder() {
  const p = camsPending(); if (!p.all.length) return;
  const today = isoOf(new Date()); if (lsGet(LS_CAMS_REMIND, '') === today) return;
  lsSet(LS_CAMS_REMIND, today);
  setTimeout(() => toast(`Rappel : ${plural(p.all.length, 'cam/custom en attente', 'cams/customs en attente')}${p.old.length ? `, dont ${p.old.length} des semaines précédentes` : ''}.`), 900);
}
function camsSuggest() {
  const m = {chatter:new Map(), model:new Map()};
  const add = (map, v) => { const t = String(v || '').trim(); if (t) map.set(t.toLowerCase(), t); };
  for (const e of camList()) { add(m.chatter, e.chatter); add(m.model, e.model); }
  for (const n of knownChatters()) add(m.chatter, n);
  for (const x of allModels()) add(m.model, modelLabel(x));
  const s = map => [...map.values()].sort((a, b) => a.localeCompare(b, 'fr'));
  return {chatter: s(m.chatter), model: s(m.model)};
}

      <td class="nc"><input type="checkbox" class="cdone" data-cd="${e.id}" ${st === 'done' ? 'checked' : ''} ${st === 'cancel' ? 'disabled' : ''} aria-label="Marquer comme faite" title="${st === 'done' ? `Faite le ${esc(fmtDateFr(e.doneAt))}` : 'Cocher quand elle est faite'}"></td>

      <td style="min-width:200px;max-width:360px"><div class="creq" title="${esc(e.request || '')}">${esc(e.request || '')}</div></td>
      ${pendingView ? `<td><span class="age ${age > 6 ? 'hot' : age > 2 ? 'warm' : ''}">${age === 0 ? "aujourd'hui" : plural(age, 'jour', 'jours')}</span></td>`

  </tbody></table></div>`;
}
function bindCams(main, wk) {
  const goW = k => { camsUI.week = k; render(); };
  document.getElementById('cw-prev')?.addEventListener('click', () => goW(addDaysIso(wk, -7)));
  document.getElementById('cw-next')?.addEventListener('click', () => goW(addDaysIso(wk, 7)));
  document.getElementById('cw-sel')?.addEventListener('change', e => goW(e.target.value));
  main.querySelectorAll('[data-ctab]').forEach(b => b.addEventListener('click', () => { camsUI.tab = b.dataset.ctab; render(); }));
  document.getElementById('c-add').addEventListener('click', () => camEdit(null));
  main.querySelectorAll('[data-cf]').forEach(b => b.addEventListener('click', () => { camsUI.type = b.dataset.cf; render(); }));
  document.getElementById('c-model')?.addEventListener('change', e => { camsUI.model = e.target.value; render(); });
  const qi = document.getElementById('c-q'); let t;
  qi?.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { camsUI.q = qi.value; render(); const n = document.getElementById('c-q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); });
  main.querySelectorAll('[data-cd]').forEach(cb => {
    cb.addEventListener('click', e => e.stopPropagation());
    cb.addEventListener('change', () => {
      const it = camsState.items[cb.dataset.cd];
      if (cb.checked) { it.status = 'done'; it.doneAt = isoOf(new Date()); } else { it.status = 'todo'; delete it.doneAt; }
      saveCams(); toast(cb.checked ? `Marquée comme faite (${it.chatter || ''} · ${it.model || ''}).` : 'Remise en attente.'); render();
    });
  });
  main.querySelectorAll('tr[data-cid]').forEach(tr => tr.addEventListener('click', () => camEdit(tr.dataset.cid)));
  main.querySelectorAll('[data-cm]').forEach(tr => tr.addEventListener('click', () => { camsUI.model = tr.dataset.cm === '—' ? '' : tr.dataset.cm; camsUI.tab = 'week'; render(); }));
}

/* ---------- Saisie / modification ---------- */
function camEdit(id) {
  const sug = camsSuggest();
  const cur = id ? {...camsState.items[id]} : {date: isoOf(new Date()), type: 'custom', status: 'todo'};
  const f = (label, html, wide) => `<label class="sf ${wide ? 'wide' : ''}"><span>${label}</span>${html}</label>`;
  const inp = (name, extra = '') => `<input type="text" name="${name}" value="${esc(cur[name] ?? '')}" ${extra}>`;
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal sui-modal" role="dialog" aria-modal="true" style="--tc:#38bdf8;max-width:680px"><h3><span class="sdot"></span>${id ? 'Modifier la demande' : 'Nouvelle demande cam / custom'}</h3>
    <form class="sform" novalidate>
      ${f('Type', `<div class="qrow">${CAM_TYPES.map(([k, l, c]) => `<button type="button" class="qpt ${cur.type === k ? 'on' : ''}" data-ty="${k}" style="--tc:${c}">${l}</button>`).join('')}</div><input type="hidden" name="type" value="${esc(cur.type || 'custom')}">`)}
      ${f('Date de la demande', `<input type="date" name="date" value="${esc(cur.date || '')}">`)}
      ${f('Modèle', inp('model', 'list="cd-model" placeholder="Ava MYM, Steffy OF…"'))}
      ${f('Chatteur', inp('chatter', 'list="cd-chatter"'))}
      ${f('Fan', inp('fan', 'placeholder="Nom du fan"'))}
      ${f('ID du fan', inp('fanId', 'placeholder="@pseudo"'))}
      ${f('Prix', `<input type="number" name="price" min="0" step="any" value="${esc(cur.price ?? '')}" placeholder="450">`)}
      ${f('Déjà payé', `<div class="qrow"><input type="number" name="paid" min="0" step="any" value="${esc(cur.paid ?? '')}" placeholder="0" style="width:120px"><button type="button" class="qpt" data-allpaid style="--tc:#45d08f">Tout payé</button></div>`)}
      ${f('Détail de la demande', `<textarea name="request" rows="3" placeholder="Ce que le fan demande…">${esc(cur.request || '')}</textarea>`, true)}
      ${f('Statut', `<select name="status"><option value="todo" ${cur.status === 'todo' ? 'selected' : ''}>En attente</option><option value="done" ${cur.status === 'done' ? 'selected' : ''}>Faite</option><option value="cancel" ${cur.status === 'cancel' ? 'selected' : ''}>Annulée</option></select>`)}
      ${f('À faire avant le (facultatif)', `<input type="date" name="due" value="${esc(cur.due || '')}">`)}
    </form>
    <datalist id="cd-chatter">${sug.chatter.map(v => `<option value="${esc(v)}">`).join('')}</datalist><datalist id="cd-model">${sug.model.map(v => `<option value="${esc(v)}">`).join('')}</datalist>
    <div id="c-err" class="sc-lo" style="min-height:18px;font-size:13px;margin-top:6px"></div>
    <div class="acts">${id ? '<button class="btn danger" data-a="del" type="button" style="margin-right:auto">Supprimer</button>' : ''}<button class="btn ghost" data-a="0" type="button">Annuler</button><button class="btn primary" data-a="1" type="button">${id ? 'Enregistrer' : 'Ajouter la demande'}</button></div></div>`;
  const form = bg.querySelector('form'), close = () => bg.remove();
  bg.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  bg.addEventListener('click', async e => {
    if (e.target === bg) return close();
    const ty = e.target.closest('[data-ty]'); if (ty) { form.type.value = ty.dataset.ty; bg.querySelectorAll('[data-ty]').forEach(b => b.classList.toggle('on', b === ty)); return; }
    if (e.target.closest('[data-allpaid]')) { form.paid.value = form.price.value || ''; return; }
    const a = e.target.closest('[data-a]'); if (!a) return;
    if (a.dataset.a === '0') return close();
    if (a.dataset.a === 'del') {
      if (!(await modal('Supprimer la demande', `<p>Supprimer cette demande (${esc(cur.model || '')} · ${esc(cur.chatter || '')}) ? Cette action est définitive.</p>`, 'Supprimer'))) return;
      delete camsState.items[id]; saveCams(); close(); toast('Demande supprimée.'); render(); return;
    }
    const d = Object.fromEntries([...new FormData(form).entries()].map(([k, v]) => [k, String(v).trim()]));
    const err = !d.date ? 'Indiquez la date de la demande.' : !d.model ? 'Indiquez la modèle.' : !d.chatter ? 'Indiquez le chatteur.' : d.price !== '' && !(+d.price >= 0) ? 'Le prix doit être un nombre.' : '';
    if (err) { bg.querySelector('#c-err').textContent = err; return; }
    const it = Object.fromEntries(Object.entries(d).filter(([, v]) => v !== ''));
    if (it.price != null) it.price = +it.price; if (it.paid != null) it.paid = +it.paid;
    // Même modèle / chatteur écrit avec d'autres majuscules : on reprend le nom déjà connu
    const canon = (v, list) => list.find(x => normName(x) === normName(v)) || v;
    it.model = canon(it.model, sug.model); it.chatter = canon(it.chatter, sug.chatter);
    it.at = id ? (cur.at || Date.now()) : Date.now();
    if (it.status === 'done') it.doneAt = cur.doneAt || isoOf(new Date());
    camsState.items[id || 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6)] = it;
    saveCams(); close(); toast(id ? 'Demande mise à jour.' : 'Demande ajoutée : elle apparaît dans « En attente » jusqu’à ce qu’elle soit cochée.'); render();
  });
  document.body.appendChild(bg);
  form.model.focus();
}

/* =====================================================================
   PARTAGE DES DONNÉES (Supabase) — tout le monde voit et importe les mêmes données
   Trois blocs sont partagés : « periods » (chatters OF + MYM), « settings » (paramètres de notation), « asv ».
   ===================================================================== */
const Sync = (() => {
  const KEYS = ['periods', 'settings', 'asv', 'asvcfg', 'planning', 'plancfg', 'suivi', 'cams'];
  const OPTIONAL = new Set(['planning', 'plancfg', 'suivi', 'cams']);   // lignes ajoutées par un script SQL plus récent
  const missing = new Set();
  // Paramètres de notation et réglages ASV : modifiables uniquement par les administrateurs (vérifié aussi côté Supabase)
  const PROTECTED = new Set(['settings', 'asvcfg', 'plancfg']);
  let isAdmin = true, rolesConfigured = false, admins = [], noCfgRow = false;
  const LS_CFG = 'rca.sync.cfg', LS_SES = 'rca.sync.session', LS_META = 'rca.sync.meta';
  const EMPTY = {periods: [], settings: {}, asv: {models: [], entries: []}, asvcfg: {}, planning: {weeks: {}, chatters: {}}, plancfg: {}, suivi: {weeks: {}}, cams: {items: {}}};
  const clone = o => JSON.parse(JSON.stringify(o ?? null));
  const same = (a, b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);
  let session = lsGet(LS_SES, null);
  const meta = Object.assign({version: {}, base: {}}, lsGet(LS_META, {}));
  const dirty = new Set();
  let busy = false, flushTimer = null, pollTimer = null, status = 'idle', lastSync = null, lastError = '', firstDone = false;

  const cfg = () => {
    const c = SHARED_CONFIG.url && SHARED_CONFIG.anonKey ? SHARED_CONFIG : lsGet(LS_CFG, null);
    return c && c.url && c.anonKey ? {url: c.url.replace(/\/+$/, ''), anonKey: c.anonKey.trim(), embedded: !!(SHARED_CONFIG.url && SHARED_CONFIG.anonKey)} : null;
  };
  const configured = () => !!cfg();
  const connected = () => configured() && !!session;
  const saveMeta = () => lsSet(LS_META, meta);

  /* ---------- Lecture / écriture de l'état local ---------- */
  function getData(key) {
    if (key === 'periods') return clone(store.periods);
    if (key === 'settings') return clone({of: allSettings.of, mym: allSettings.mym});
    if (key === 'asvcfg') return clone(asvState.settings);
    if (key === 'planning') return clone(planState);
    if (key === 'suivi') return clone(suiviState);
    if (key === 'cams') return clone(camsState);
    if (key === 'plancfg') return clone(planCfgSaved || {});
    return clone({models: asvState.models, entries: asvState.entries});
  }
  function setData(key, data) {
    if (key === 'periods') {
      const arr = Array.isArray(data) ? data : [];
      store.periods.splice(0, store.periods.length, ...arr.map(p => ({...p, platform: p.platform || 'of'})));
      store.invalidate(); lsSet(LS.periods, store.periods);
    } else if (key === 'settings') {
      for (const pid of PIDS) if (data && data[pid]) store.setSettings(pid, RCA.mergeSettings(pid, data[pid]));
      lsSet(LS.settings, allSettings);
    } else if (key === 'cams') {
      camsState = {items: (data && data.items) || {}}; lsSet(LS_CAMS, camsState);
    } else if (key === 'suivi') {
      suiviState = {weeks: (data && data.weeks) || {}}; lsSet(LS_SUIVI, suiviState);
    } else if (key === 'planning') {
      planState = {weeks: (data && data.weeks) || {}, chatters: (data && data.chatters) || {}, ...(data && data.models && Object.keys(data.models).length ? {models: data.models} : {}), ...(data && data.dayoff ? {dayoff: data.dayoff} : {})}; lsSet(LS_PLAN, planState);
    } else if (key === 'plancfg') {
      planCfgSaved = data && Array.isArray(data.models) && data.models.length ? data : null; lsSet(LS_PLANCFG, planCfgSaved);
    } else if (key === 'asvcfg') {
      if (data && Object.keys(data).length) { asvState.settings = mergeAsvSettings(data); lsSet(LS_ASV, asvState); }
    } else {
      asvState.models = Array.isArray(data?.models) ? data.models : [];
      asvState.entries = Array.isArray(data?.entries) ? data.entries : [];
      lsSet(LS_ASV, asvState);
    }
  }
  const hasLocal = key => key === 'periods' ? store.periods.length > 0 : key === 'asv' ? asvState.models.length > 0 || asvState.entries.length > 0
    : key === 'planning' ? Object.keys(planState.weeks).length > 0 : key === 'plancfg' ? !!planCfgSaved : key === 'suivi' ? Object.keys(suiviState.weeks).length > 0 : key === 'cams' ? Object.keys(camsState.items).length > 0 : true;
  const remoteEmpty = (key, d) => key === 'cams' ? !d || !Object.keys(d.items || {}).length : key === 'suivi' ? !d || !Object.keys(d.weeks || {}).length : key === 'planning' ? !d || !Object.keys(d.weeks || {}).length : key === 'plancfg' ? !d || !(d.models || []).length : key === 'periods' ? !Array.isArray(d) || !d.length : key === 'asv' ? !d || (!(d.models || []).length && !(d.entries || []).length) : key === 'asvcfg' ? !d || !Object.keys(d).length : !d || !d.of;

  /* ---------- Fusion à trois (base commune, local, distant) ---------- */
  function mergeById(b = [], l = [], r = []) {
    const B = new Map(b.map(x => [x.id, x])), L = new Map(l.map(x => [x.id, x])), R = new Map(r.map(x => [x.id, x]));
    const out = [];
    for (const id of new Set([...r.map(x => x.id), ...l.map(x => x.id)])) {
      const bb = B.get(id), ll = L.get(id), rr = R.get(id);
      if (ll && rr) out.push(!same(ll, bb) ? ll : rr);
      else if (ll) { if (!bb || !same(ll, bb)) out.push(ll); }        // ajouté ici, ou modifié ici alors que supprimé ailleurs
      else if (rr) { if (!bb || !same(rr, bb)) out.push(rr); }        // ajouté ailleurs, ou modifié ailleurs alors que supprimé ici
    }
    return out;
  }
  const pick = (b, l, r) => !same(l, b) ? l : r;
  const isObj = x => x && typeof x === 'object' && !Array.isArray(x);
  // Fusion clé par clé (planning) : deux personnes qui modifient des cases différentes ne s'écrasent jamais.
  function deepMerge(b, l, r) {
    if (isObj(l) && isObj(r)) {
      const out = {};
      for (const k of new Set([...Object.keys(l), ...Object.keys(r)])) {
        const bb = isObj(b) ? b[k] : undefined, ll = l[k], rr = r[k];
        if (ll === undefined) { if (bb === undefined || !same(rr, bb)) out[k] = rr; continue; }
        if (rr === undefined) { if (bb === undefined || !same(ll, bb)) out[k] = ll; continue; }
        out[k] = deepMerge(bb, ll, rr);
      }
      return out;
    }
    return !same(l, b) ? l : r;
  }
  function merge(key, b, l, r, preferRemote) {
    b = b ?? clone(EMPTY[key]);
    if (key === 'periods') return mergeById(b, l, r);
    if (key === 'settings') return preferRemote ? r : {of: pick(b.of, l.of, r.of), mym: pick(b.mym, l.mym, r.mym)};
    if (key === 'asvcfg') return preferRemote ? r : pick(b, l, r);
    if (key === 'plancfg') return preferRemote ? r : pick(b, l, r);
    if (key === 'planning' || key === 'suivi' || key === 'cams') return deepMerge(b, l, r);
    return {models: mergeById(b.models, l.models, r?.models), entries: mergeById(b.entries, l.entries, r?.entries)};
  }

  /* ---------- Accès à l'API ---------- */
  async function api(path, opts = {}, retry = true) {
    const c = cfg();
    const headers = {apikey: c.anonKey, 'Content-Type': 'application/json', ...(opts.headers || {})};
    if (session && !path.startsWith('/auth/')) headers.Authorization = `Bearer ${session.access_token}`;
    let res;
    try { res = await fetch(c.url + path, {...opts, headers}); }
    catch (e) { throw Object.assign(new Error('Pas de connexion à la base partagée (internet ?).'), {offline: true}); }
    if (res.status === 401 && retry && session && !path.startsWith('/auth/')) { await refresh(); return api(path, opts, false); }
    const text = await res.text();
    const body = text ? (() => { try { return JSON.parse(text); } catch { return text; } })() : null;
    if (!res.ok) throw Object.assign(new Error((body && (body.error_description || body.msg || body.message || body.error)) || `Erreur ${res.status}`), {status: res.status});
    return body;
  }
  function keepSession(b) {
    session = {access_token: b.access_token, refresh_token: b.refresh_token, expires_at: Date.now() + (b.expires_in || 3600) * 1000, email: b.user?.email || session?.email || ''};
    lsSet(LS_SES, session);
  }
  async function refresh() {
    try { keepSession(await api('/auth/v1/token?grant_type=refresh_token', {method: 'POST', body: JSON.stringify({refresh_token: session.refresh_token})}, false)); }
    catch (e) { if (!e.offline) { session = null; lsSet(LS_SES, null); render(); } throw e; }
  }
  async function login(email, password) {
    const b = await api('/auth/v1/token?grant_type=password', {method: 'POST', body: JSON.stringify({email, password})}, false);
    keepSession(b);
    meta.version = {}; meta.base = {}; saveMeta();
    firstDone = false; isAdmin = false; rolesConfigured = false;
    await pull(true);
    start();
  }
  function logout() {
    session = null; lsSet(LS_SES, null); stop(); render();
  }

  /* ---------- Rôles ---------- */
  async function refreshRoles() {
    const before = isAdmin;
    try {
      admins = (await api('/rest/v1/admins?select=email,added_at&order=added_at.asc')) || [];
      rolesConfigured = true;
      isAdmin = admins.some(a => String(a.email).toLowerCase() === String(session.email || '').toLowerCase());
    } catch (e) {
      if (e.offline) throw e;
      rolesConfigured = false; admins = []; isAdmin = true;   // table des administrateurs pas encore créée : comportement d'avant
    }
    return before !== isAdmin;
  }
  const canManage = () => !connected() || isAdmin;
  async function addAdmin(email) { await api('/rest/v1/admins', {method: 'POST', headers: {Prefer: 'return=representation'}, body: JSON.stringify({email: email.trim().toLowerCase()})}); await refreshRoles(); }
  async function removeAdmin(email) { await api(`/rest/v1/admins?email=eq.${encodeURIComponent(email)}`, {method: 'DELETE'}); await refreshRoles(); }

  /* ---------- Synchronisation ---------- */
  async function pull(first = false) {
    if (!connected() || busy) return false;
    busy = true; setStatus('sync');
    let changedBy = null, changed = false;
    try {
      if (session.expires_at - Date.now() < 60000) await refresh();
      if (await refreshRoles()) changed = true;
      const rows = await api('/rest/v1/app_state?select=key,data,version,updated_by');
      let legacyAsvCfg = null; noCfgRow = false;
      for (const key of KEYS) {
        const row = (rows || []).find(x => x.key === key);
        if (!row && OPTIONAL.has(key)) { missing.add(key); continue; }
        if (row) missing.delete(key);
        if (!row) {
          if (key === 'asvcfg') {   // ligne pas encore créée (ancien script SQL) : on lit les réglages ASV de l'ancien format
            noCfgRow = true;
            if (legacyAsvCfg && !same(legacyAsvCfg, asvState.settings) && !dirty.has('asvcfg')) { setData('asvcfg', legacyAsvCfg); changed = true; }
            continue;
          }
          throw new Error(`La table app_state ne contient pas la ligne « ${key} » : relancez le script SQL.`);
        }
        if (key === 'asv' && row.data && row.data.settings) legacyAsvCfg = row.data.settings;
        const known = meta.version[key];
        if (key === 'asvcfg' && remoteEmpty(key, row.data) && legacyAsvCfg && known === undefined) {
          setData('asvcfg', legacyAsvCfg); changed = true;   // reprise des réglages ASV enregistrés avec l'ancienne version
          meta.version[key] = row.version; meta.base[key] = clone(row.data); if (isAdmin) dirty.add(key); continue;
        }
        if (known === undefined) {   // première synchronisation de cette donnée (connexion, ou ligne nouvellement créée)
          if (row.version === 0 || remoteEmpty(key, row.data)) { if (hasLocal(key) && (!PROTECTED.has(key) || isAdmin)) dirty.add(key); meta.version[key] = row.version; meta.base[key] = clone(row.data); continue; }
          if (hasLocal(key) && key !== 'settings') {
            const merged = merge(key, EMPTY[key], getData(key), row.data, true);
            setData(key, merged); if (!same(merged, row.data)) dirty.add(key);
          } else setData(key, row.data);
          meta.version[key] = row.version; meta.base[key] = clone(row.data); changed = true;
          continue;
        }
        if (row.version > (known ?? -1)) {
          if (dirty.has(key)) setData(key, merge(key, meta.base[key], getData(key), row.data, false));
          else setData(key, row.data);
          meta.version[key] = row.version; meta.base[key] = clone(row.data);
          changed = true; if (row.updated_by && row.updated_by !== session.email) changedBy = row.updated_by;
        }
      }
      saveMeta(); lastSync = Date.now(); lastError = ''; firstDone = true;
      setStatus(dirty.size ? 'pending' : 'ok');
    } catch (e) { lastError = e.message; setStatus(e.offline ? 'offline' : 'error'); }
    finally { busy = false; }
    if (changed) { render(); if (changedBy && !first) toast(`Données mises à jour par ${changedBy}.`); }
    if (dirty.size) scheduleFlush(50);
    return changed;
  }
  async function pushKey(key, attempt = 0) {
    if ((PROTECTED.has(key) && !isAdmin) || (key === 'asvcfg' && noCfgRow) || missing.has(key)) { dirty.delete(key); return; }
    const local = getData(key), v = meta.version[key] ?? 0;
    const rows = await api(`/rest/v1/app_state?key=eq.${key}&version=eq.${v}`, {method: 'PATCH', headers: {Prefer: 'return=representation'},
      body: JSON.stringify({data: local, version: v + 1, updated_at: new Date().toISOString(), updated_by: session.email || null})});
    if (Array.isArray(rows) && rows.length) {
      meta.version[key] = v + 1; meta.base[key] = local; saveMeta();
      if (same(getData(key), local)) dirty.delete(key);
      return;
    }
    // Quelqu'un a enregistré entre-temps : on récupère sa version, on fusionne, on réessaie.
    if (PROTECTED.has(key) && attempt >= 1) {
      await refreshRoles();
      if (!isAdmin) { setData(key, meta.base[key]); dirty.delete(key); render(); throw new Error('Seuls les administrateurs peuvent modifier les paramètres.'); }
    }
    if (attempt >= 4) throw new Error('Trop de modifications simultanées, réessayez dans un instant.');
    busy = false; await pull(); busy = true;
    return pushKey(key, attempt + 1);
  }
  async function flush() {
    if (!connected() || !dirty.size) return;
    if (busy) { scheduleFlush(400); return; }
    busy = true; setStatus('saving');
    try { for (const key of [...dirty]) await pushKey(key); lastSync = Date.now(); lastError = ''; setStatus(dirty.size ? 'pending' : 'ok'); }
    catch (e) { lastError = e.message; setStatus(e.offline ? 'offline' : 'error'); scheduleFlush(15000); }
    finally { busy = false; }
  }
  function scheduleFlush(ms = 300) { clearTimeout(flushTimer); flushTimer = setTimeout(flush, ms); }
  function changed(key) { if (!connected() || (PROTECTED.has(key) && !isAdmin)) return; dirty.add(key); setStatus('pending'); scheduleFlush(); }
  async function poll() {
    if (!connected() || busy || document.visibilityState === 'hidden') return;
    try {
      const rows = await api('/rest/v1/app_state?select=key,version');
      if ((rows || []).some(r => r.version > (meta.version[r.key] ?? -1))) await pull();
      else if (status === 'offline' || status === 'error') { lastError = ''; setStatus(dirty.size ? 'pending' : 'ok'); if (dirty.size) scheduleFlush(50); }
      else { lastSync = Date.now(); drawStatus(); }
    } catch (e) { lastError = e.message; setStatus(e.offline ? 'offline' : 'error'); }
  }
  function start() { stop(); pollTimer = setInterval(poll, 15000); }
  function stop() { clearInterval(pollTimer); pollTimer = null; }
  window.addEventListener('focus', () => poll());
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') poll(); });
  window.addEventListener('beforeunload', e => { if (connected() && dirty.size) { e.preventDefault(); e.returnValue = ''; } });

  /* ---------- Affichage de l'état ---------- */
  function setStatus(s) { status = s; drawStatus(); }
  function drawStatus() {
    const el = document.getElementById('sync-status');
    if (!el) return;
    if (!configured()) { el.innerHTML = `<a href="#of/partage" class="sync-link"><span class="dot"></span>Données sur cet appareil uniquement</a>`; el.className = 'sync local'; return; }
    if (!session) { el.innerHTML = `<a href="#of/partage" class="sync-link"><span class="dot"></span>Non connecté</a>`; el.className = 'sync off'; return; }
    const ago = lastSync ? Math.max(0, Math.round((Date.now() - lastSync) / 1000)) : null;
    const label = {sync: 'Synchronisation…', saving: 'Enregistrement…', pending: 'Modifications en attente…', offline: 'Hors ligne · modifications gardées', error: 'Erreur de synchronisation', ok: `Partagé · à jour${ago != null && ago > 20 ? ` (il y a ${ago < 90 ? ago + ' s' : Math.round(ago / 60) + ' min'})` : ''}`, idle: 'Connexion…'}[status];
    el.className = 'sync ' + (status === 'ok' ? 'ok' : status === 'error' || status === 'offline' ? 'bad' : 'wait');
    el.innerHTML = `<a href="#of/partage" class="sync-link" title="${esc(lastError)}"><span class="dot"></span>${esc(label)}</a><span class="sync-who">${esc(session.email || '')}${rolesConfigured ? ` · ${isAdmin ? 'Administrateur' : 'Équipe'}` : ''}</span>`;
  }
  setInterval(drawStatus, 30000);

  function init() {
    drawStatus();
    if (connected()) { pull(true); start(); }
  }
  return {configured, connected, cfg, login, logout, pull, changed, init, drawStatus, status: () => status, lastError: () => lastError,
    saveLocalCfg(url, key) { lsSet(LS_CFG, url ? {url, anonKey: key} : null); session = null; lsSet(LS_SES, null); meta.version = {}; meta.base = {}; saveMeta(); drawStatus(); },
    needsLogin: () => configured() && !session, email: () => session?.email || '', _merge: merge,
    canManage, isAdmin: () => isAdmin, planningShared: () => connected() && !missing.has('planning'), rolesConfigured: () => rolesConfigured, admins: () => admins.slice(), addAdmin, removeAdmin, refreshRoles};
})();

/* ---------- Écrans : connexion et page « Partage des données » ---------- */
function renderLogin(main) {
  main.innerHTML = `<div class="login-wrap"><div class="panel login">
    <h2 style="font-size:20px;margin-bottom:4px">Connexion à l'espace partagé</h2>
    <p class="hint">Connectez-vous avec l'e-mail et le mot de passe fournis par l'agence pour voir et importer les données de toute l'équipe.</p>
    <label class="f">E-mail<input type="email" id="lg-email" autocomplete="username" value="${esc(lsGet('rca.sync.lastEmail', ''))}"></label>
    <label class="f">Mot de passe<input type="password" id="lg-pw" autocomplete="current-password"></label>
    <div id="lg-err" class="sc-lo" style="min-height:20px;font-size:13px"></div>
    <button class="btn primary" id="lg-go" type="button" style="width:100%;justify-content:center">Se connecter</button>
  </div></div>`;
  const go = async () => {
    const email = document.getElementById('lg-email').value.trim(), pw = document.getElementById('lg-pw').value;
    const err = document.getElementById('lg-err'), btn = document.getElementById('lg-go');
    if (!email || !pw) { err.textContent = 'Renseignez votre e-mail et votre mot de passe.'; return; }
    btn.disabled = true; btn.textContent = 'Connexion…'; err.textContent = '';
    try { lsSet('rca.sync.lastEmail', email); await Sync.login(email, pw); toast('Connecté : les données de l’équipe sont chargées.'); render(); }
    catch (e) { err.textContent = /invalid/i.test(e.message) ? 'E-mail ou mot de passe incorrect.' : e.message; btn.disabled = false; btn.textContent = 'Se connecter'; }
  };
  document.getElementById('lg-go').addEventListener('click', go);
  document.getElementById('lg-pw').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  (document.getElementById('lg-email').value ? document.getElementById('lg-pw') : document.getElementById('lg-email')).focus();
}
function renderPartage(main) {
  const c = Sync.cfg();
  main.innerHTML = `<div class="top"><h1>Partage des données</h1></div><div class="stack">
    <section class="panel"><h2>État</h2>
      ${!c ? `<p>Les données sont enregistrées <strong>uniquement dans ce navigateur</strong>. Pour que toute l'équipe voie et importe les mêmes données, reliez le site à une base Supabase (ci-dessous).</p>`
        : !Sync.connected() ? `<p>Le site est relié à la base partagée, mais vous n'êtes pas connecté.</p><a class="btn primary" href="#of/dashboard">Se connecter</a>`
        : `<p>Connecté en tant que <strong>${esc(Sync.email())}</strong>. Chaque import, suppression ou changement de paramètres est enregistré pour toute l'équipe, et les modifications des autres apparaissent ici en moins de 15 secondes.</p>
           <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="sy-now" type="button">Synchroniser maintenant</button><button class="btn danger" id="sy-out" type="button">Se déconnecter</button></div>
           ${Sync.lastError() ? `<div class="alert err" style="margin-top:12px">${esc(Sync.lastError())}</div>` : ''}`}
    </section>
    ${Sync.connected() ? `<section class="panel" id="roles"><h2>Qui peut modifier les paramètres</h2>
      ${!Sync.rolesConfigured() ? `<p class="hint">Les droits ne sont pas encore activés : pour l'instant, toute personne connectée peut modifier les paramètres. Exécutez le script SQL « rôles » dans Supabase pour les activer.</p>`
      : Sync.isAdmin() ? `<p class="hint">Les administrateurs voient et modifient tout, y compris les paramètres de notation et les réglages ASV. Les autres comptes voient les tableaux de bord et importent des données, sans accès aux paramètres.</p>
        <div class="tbl-wrap" style="max-height:none;margin-bottom:12px"><table><thead><tr><th>Administrateur</th><th></th></tr></thead><tbody>
        ${Sync.admins().map(a => { const me = a.email.toLowerCase() === Sync.email().toLowerCase(); const alone = Sync.admins().length === 1;
          return `<tr><td>${esc(a.email)}${me ? ' <span class="sub">(vous)</span>' : ''}</td><td class="num">${me && alone ? '<span class="sub">dernier administrateur</span>' : `<button class="btn danger" type="button" data-unadmin="${esc(a.email)}">Retirer l'accès</button>`}</td></tr>`; }).join('')}
        </tbody></table></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end"><label style="display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);flex:1;min-width:240px">E-mail du compte à promouvoir (il doit déjà exister dans Supabase)<input type="email" id="new-admin" placeholder="prenom@exemple.com"></label>
        <button class="btn primary" id="add-admin" type="button">Donner l'accès aux paramètres</button></div>`
      : `<p>Votre compte a un accès <strong>Équipe</strong> : vous voyez les tableaux de bord et vous pouvez importer, mais seuls les administrateurs modifient les paramètres.</p><p class="hint">Administrateurs : ${Sync.admins().map(a => esc(a.email)).join(', ') || '—'}</p>`}
    </section>` : ''}
    ${c && c.embedded ? '' : `<section class="panel"><h2>Relier à Supabase</h2><p class="hint">Collez l'adresse du projet et la clé publique (Project Settings → API). Ce réglage ne vaut que pour ce navigateur : pour vos superviseurs, envoyez ces deux valeurs à Claude, qui les intégrera au fichier index.html.</p>
      <div class="set-grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))"><label>Project URL<input type="text" id="sy-url" placeholder="https://xxxx.supabase.co" value="${esc(c?.url || '')}"></label>
      <label>Clé publique (anon / publishable)<input type="text" id="sy-key" placeholder="eyJ… ou sb_publishable_…" value="${esc(c?.anonKey || '')}"></label></div>
      <div style="display:flex;gap:10px;margin-top:12px"><button class="btn primary" id="sy-save" type="button">Enregistrer et se connecter</button>${c ? '<button class="btn ghost" id="sy-clear" type="button">Revenir au mode local</button>' : ''}</div></section>`}
  </div>`;
  document.getElementById('sy-now')?.addEventListener('click', async () => { await Sync.pull(); toast('Synchronisation terminée.'); render(); });
  document.getElementById('add-admin')?.addEventListener('click', async () => {
    const email = document.getElementById('new-admin').value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { toast('Saisissez une adresse e-mail valide.', true); return; }
    try { await Sync.addAdmin(email); toast(`${email} peut maintenant modifier les paramètres.`); render(); }
    catch (e) { toast(/duplicate|conflict|23505/i.test(e.message) ? 'Ce compte est déjà administrateur.' : `Impossible d'ajouter : ${e.message}`, true); }
  });
  document.querySelectorAll('[data-unadmin]').forEach(b => b.addEventListener('click', async () => {
    const email = b.dataset.unadmin;
    if (!(await modal(`Retirer l'accès aux paramètres`, `<p><strong>${esc(email)}</strong> pourra toujours voir les tableaux de bord et importer, mais plus modifier les paramètres.</p>`, 'Retirer'))) return;
    try { await Sync.removeAdmin(email); toast(`Accès retiré à ${email}.`); render(); } catch (e) { toast(`Impossible de retirer : ${e.message}`, true); }
  }));
  document.getElementById('sy-out')?.addEventListener('click', () => Sync.logout());
  document.getElementById('sy-save')?.addEventListener('click', () => {
    const url = document.getElementById('sy-url').value.trim(), key = document.getElementById('sy-key').value.trim();
    if (!/^https:\/\/.+/.test(url) || key.length < 20) { toast('Vérifiez l’adresse (https://…supabase.co) et la clé.', true); return; }
    Sync.saveLocalCfg(url, key); go('of/dashboard');
  });
  document.getElementById('sy-clear')?.addEventListener('click', () => { Sync.saveLocalCfg(null); toast('Retour au mode local.'); render(); });
}

/* ---------- Auto-test ---------- */
function selfTest() {
  const tests = RCA.runSelfTests(store.periods).concat(RCA.ASV.selfTests());
  const passed = tests.filter(t => t.pass).length;
  console.groupCollapsed(`%cChatter RCA Grading — auto-test : ${passed}/${tests.length} réussis`, `color:${passed === tests.length ? '#45D08F' : '#F0605E'};font-weight:bold`);
  tests.forEach((t, i) => console[t.pass ? 'log' : 'error'](`${t.pass ? '✓' : '✗'} ${i + 1}. ${t.name} — ${t.detail}`));
  console.groupEnd();
  const btn = document.getElementById('selftest-btn');
  btn.className = 'selftest ' + (passed === tests.length ? 'ok' : 'bad');
  document.getElementById('selftest-label').textContent = `Auto-test : ${passed}/${tests.length} réussis`;
  btn.onclick = () => modal(`Résultats de l'auto-test`, `<ul class="testlist">${tests.map((t, i) => `<li><span class="${t.pass ? 'p' : 'f'}">${t.pass ? 'Réussi' : 'Échec'}</span> ${i + 1}. ${esc(t.name)}<small>${esc(t.detail)}</small></li>`).join('')}</ul>`, null, 'Fermer');
}

if (!/^(of|mym)\//.test(routeHash)) {
  const r = route();
  routeHash = `${r.pid}/${r.chatter != null ? 'chatter/' + encodeURIComponent(r.chatter) : r.page === 'asv' ? 'asv/' + r.sub : r.page}`;
}
Sync.init();
try { render(); } catch (e) {
  console.error(e);
  document.getElementById('main').innerHTML = `<div class="panel empty"><h2>Une erreur a empêché l'affichage</h2><p class="hint">${esc(e.message)}</p></div>`;
}
try { selfTest(); } catch (e) { console.error(e); }
})();
</script>
</body>
